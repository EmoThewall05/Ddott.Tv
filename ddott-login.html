<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDOTT.TV - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { width: 90%; max-width: 400px; }
.logo { text-align: center; margin-bottom: 40px; }
.logo h1 { font-size: 2.5rem; background: linear-gradient(90deg, #00f5ff, #bf00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo p { color: #888; margin-top: 5px; }
.card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 30px; }
.tabs { display: flex; margin-bottom: 25px; background: #000; border-radius: 8px; padding: 4px; }
.tab { flex: 1; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; color: #888; transition: all 0.3s; }
.tab.active { background: #1a1a2e; color: #00f5ff; }
input { width: 100%; background: #000; border: 1px solid #333; border-radius: 8px; padding: 14px; color: #fff; font-size: 1rem; margin-bottom: 15px; outline: none; }
input:focus { border-color: #00f5ff; }
button { width: 100%; padding: 14px; background: linear-gradient(90deg, #00f5ff, #bf00ff); border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; }
.msg { text-align: center; margin-top: 15px; font-size: 0.9rem; min-height: 20px; }
.msg.success { color: #00ff88; }
.msg.error { color: #ff4444; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>DDOTT.TV</h1>
    <p>Dwin Universe</p>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login', this)">Login</div>
      <div class="tab" onclick="switchTab('signup', this)">Sign Up</div>
    </div>
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="handleLogin()">Login</button>
    </div>
    <div id="signupForm" style="display:none">
      <input type="text" id="signupUsername" placeholder="Username">
      <input type="email" id="signupEmail" placeholder="Email">
      <input type="password" id="signupPassword" placeholder="Password">
      <button onclick="handleSignup()">Create Account</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  el.classList.add('active')
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none'
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none'
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value
  const password = document.getElementById('loginPassword').value
  const msg = document.getElementById('msg')
  msg.textContent = 'Logging in...'
  msg.className = 'msg'
  const { data, error } = await signIn(email, password)
  if (error) {
    msg.textContent = error.message
    msg.className = 'msg error'
  } else {
    msg.textContent = 'Success!'
    msg.className = 'msg success'
    setTimeout(() => window.location.href = 'ddott-home-v2.html', 1000)
  }
}

async function handleSignup() {
  const username = document.getElementById('signupUsername').value
  const email = document.getElementById('signupEmail').value
  const password = document.getElementById('signupPassword').value
  const msg = document.getElementById('msg')
  msg.textContent = 'Creating account...'
  msg.className = 'msg'
  const { data, error } = await signUp(email, password, username)
  if (error) {
    msg.textContent = error.message
    msg.className = 'msg error'
  } else {
    msg.textContent = 'Account created! Check email to verify.'
    msg.className = 'msg success'
  }
}
</script>
</body>
</html>
