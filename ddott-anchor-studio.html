<script>
// ============================================================
// DDOTT NEWS STUDIO v4.2 - AI News Anchor System
// Matches Cloudflare Worker: POST /news -> {text: "..."}
// ============================================================

const canvas = document.getElementById('anchor-canvas');
const ctx = canvas.getContext('2d');

// Configuration
let config = {
    language: 'en',
    gender: 'female',
    workerUrl: 'https://ddott-news.meradivin.workers.dev'
};

// Animation states
let animState = {
    time: 0,
    blinkPhase: 0,
    blinkDuration: 0,
    isBlinking: false,
    breathPhase: 0,
    headTilt: 0,
    headNod: 0,
    mouthOpen: 0,
    mouthTarget: 0,
    eyeLookX: 0,
    eyeLookY: 0,
    handGesture: 0,
    isSpeaking: false,
    speechQueue: [],
    speechIndex: 0
};

// Character presets for 8 combinations
const characters = {
    'en-female': {
        skinTone: '#f5d0b5', hairColor: '#3d2317', eyeColor: '#4a6741',
        lipColor: '#d4556a', suitColor: '#1e3a5f', shirtColor: '#ffffff',

    },

        tieColor: '#1a5fff', name: 'James'
    },
    'ml-female': {

    },
    'ml-male': {

        tieColor: '#228b22', name: 'Arjun'
    },
    'hi-female': {

        lipColor: '#c14444', suitColor: '#2d1b4e', shirtColor: '#fff5e6',
        tieColor: '#ff9933', name: 'Priya'
    },
    'hi-male': {
        skinTone: '#b8956a', hairColor: '#151515', eyeColor: '#4a3728',
        lipColor: '#a0522d', suitColor: '#1a1a2e', shirtColor: '#f5f5f5',
        tieColor: '#138808', name: 'Rahul'
    },
    'ar-female': {
        skinTone: '#d4a574', hairColor: '#0f0f0f', eyeColor: '#4a5d23',
        lipColor: '#b85c5c', suitColor: '#1a3a3a', shirtColor: '#f5f5dc',
        tieColor: '#006600', name: 'Fatima'
    },
    'ar-male': {
        skinTone: '#c68642', hairColor: '#1a1a1a', eyeColor: '#3d4a1e',
        lipColor: '#8b4513', suitColor: '#0f1f0f', shirtColor: '#fff8dc',
        tieColor: '#cc0000', name: 'Omar'
    }
};

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function sin01(t) { return (Math.sin(t) + 1) / 2; }

function darken(color, amount) {
    const num = parseInt(color.replace('#', ''), 16);
    const r = clamp(Math.floor((num >> 16) * (1 - amount)), 0, 255);
    const g = clamp(Math.floor(((num >> 8) & 0xFF) * (1 - amount)), 0, 255);
    const b = clamp(Math.floor((num & 0xFF) * (1 - amount)), 0, 255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function lighten(color, amount) {
    const num = parseInt(color.replace('#', ''), 16);
    const r = clamp(Math.floor((num >> 16) + (255 - (num >> 16)) * amount), 0, 255);
    const g = clamp(Math.floor(((num >> 8) & 0xFF) + (255 - ((num >> 8) & 0xFF)) * amount), 0, 255);
    const b = clamp(Math.floor((num & 0xFF) + (255 - (num & 0xFF)) * amount), 0, 255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// ============================================================
// DRAWING FUNCTIONS
// ============================================================

function drawStudioBackground() {
    const w = canvas.width, h = canvas.height;

    const grad = ctx.createRadialGradient(w/2, h/3, 0, w/2, h/2, w);
    grad.addColorStop(0, '#0a1a3a');
    grad.addColorStop(0.5, '#050d1f');
    grad.addColorStop(1, '#020510');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 5; i++) {
        const lx = w * (0.15 + i * 0.175);
        const lightGrad = ctx.createRadialGradient(lx, -50, 0, lx, 150, 200);
        lightGrad.addColorStop(0, 'rgba(100, 180, 255, 0.15)');
        lightGrad.addColorStop(1, 'rgba(100, 180, 255, 0)');
        ctx.fillStyle = lightGrad;
        ctx.fillRect(lx - 200, 0, 400, 300);
    }

    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#4488ff';
    ctx.lineWidth = 1;
    const mapY = h * 0.25;
    for (let i = 0; i < 20; i++) {
        ctx.beginPath();
        ctx.moveTo(w * 0.1, mapY + i * 15);
        for (let x = w * 0.1; x < w * 0.9; x += 30) {
            ctx.lineTo(x, mapY + i * 15 + Math.sin(x * 0.01 + i) * 10);
        }
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = '#4488ff';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 30; i++) {
        const y = h * 0.6 + i * (h * 0.4 / 30);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
    }
    for (let i = -20; i < 20; i++) {
        const x = w / 2 + i * 60;
        ctx.beginPath();
        ctx.moveTo(x, h * 0.6);
        ctx.lineTo(w / 2 + i * 200, h);
        ctx.stroke();
    }
    ctx.restore();

    const screenW = w * 0.5;
    const screenH = h * 0.35;
    const screenX = (w - screenW) / 2;
    const screenY = h * 0.08;

    const screenGlow = ctx.createRadialGradient(w/2, screenY + screenH/2, 0, w/2, screenY + screenH/2, screenW);
    screenGlow.addColorStop(0, 'rgba(20, 60, 120, 0.3)');
    screenGlow.addColorStop(1, 'rgba(20, 60, 120, 0)');
    ctx.fillStyle = screenGlow;
    ctx.fillRect(screenX - 100, screenY - 50, screenW + 200, screenH + 100);

    ctx.fillStyle = 'rgba(10, 20, 40, 0.8)';
    ctx.fillRect(screenX - 8, screenY - 8, screenW + 16, screenH + 16);
    ctx.strokeStyle = 'rgba(68, 136, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(screenX - 8, screenY - 8, screenW + 16, screenH + 16);

    ctx.save();
    ctx.beginPath();
    ctx.rect(screenX, screenY, screenW, screenH);
    ctx.clip();

    ctx.fillStyle = 'rgba(5, 15, 35, 0.9)';
    ctx.fillRect(screenX, screenY, screenW, screenH);

    const graphTime = animState.time * 0.5;
    ctx.strokeStyle = 'rgba(68, 180, 255, 0.4)';
    ctx.lineWidth = 1.5;
    for (let g = 0; g < 3; g++) {
        ctx.beginPath();
        for (let x = 0; x < screenW; x += 3) {
            const y = screenH/2 + Math.sin(x * 0.02 + graphTime + g * 2) * 30 
                     + Math.sin(x * 0.05 + graphTime * 1.5) * 15;
            if (x === 0) ctx.moveTo(screenX + x, screenY + y);
            else ctx.lineTo(screenX + x, screenY + y);
        }
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(100, 200, 255, 0.6)';
    for (let i = 0; i < 8; i++) {
        const px = screenX + 40 + i * (screenW - 80) / 7;
        const py = screenY + screenH/2 + Math.sin(i + graphTime) * 40;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = 'rgba(255, 50, 50, 0.8)';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('LIVE DATA', screenX + 15, screenY + 25);

    ctx.restore();
}

function drawDesk() {
    const w = canvas.width, h = canvas.height;
    const deskY = h * 0.72;
    const deskH = h * 0.28;

    const deskGrad = ctx.createLinearGradient(0, deskY, 0, h);
    deskGrad.addColorStop(0, '#3a2818');
    deskGrad.addColorStop(0.3, '#2a1a0a');
    deskGrad.addColorStop(1, '#1a0f05');
    ctx.fillStyle = deskGrad;
    ctx.fillRect(0, deskY, w, deskH);

    ctx.strokeStyle = 'rgba(180, 140, 80, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, deskY);
    ctx.lineTo(w, deskY);
    ctx.stroke();

    ctx.fillStyle = 'rgba(10, 20, 50, 0.9)';
    ctx.fillRect(w * 0.15, deskY + 20, w * 0.7, deskH - 40);

    ctx.save();
    ctx.fillStyle = 'rgba(68, 136, 255, 0.15)';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('DDOTT NEWS', w / 2, deskY + 55);
    ctx.fillStyle = 'rgba(100, 180, 255, 0.3)';
    ctx.font = '12px Arial';
    ctx.fillText('AI-POWERED NEWS NETWORK', w / 2, deskY + 75);
    ctx.restore();

    ctx.fillStyle = 'rgba(68, 136, 255,' + (0.3 + sin01(animState.time * 2) * 0.2) + ')';
    ctx.fillRect(w * 0.15, deskY + 5, w * 0.7, 3);
}

function drawLaptop(anchorX, anchorY) {
    const laptopW = 180;
    const laptopH = 12;
    const screenAngle = -0.3;
    const lx = anchorX - laptopW / 2;
    const ly = anchorY + 80;

    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(lx, ly, laptopW, laptopH);
    ctx.fillStyle = '#a0a0a0';
    ctx.fillRect(lx + 5, ly + laptopH, laptopW - 10, 4);

    ctx.save();
    ctx.translate(lx + laptopW / 2, ly);
    ctx.rotate(screenAngle);

    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-laptopW / 2 + 10, -110, laptopW - 20, 100);

    const screenGlow = ctx.createRadialGradient(0, -60, 0, 0, -60, 80);
    screenGlow.addColorStop(0, 'rgba(100, 180, 255, 0.3)');
    screenGlow.addColorStop(1, 'rgba(100, 180, 255, 0.05)');
    ctx.fillStyle = screenGlow;
    ctx.fillRect(-laptopW / 2 + 15, -105, laptopW - 30, 90);

    ctx.fillStyle = 'rgba(150, 220, 255, 0.5)';
    ctx.font = '6px monospace';
    for (let i = 0; i < 6; i++) {
        const lineW = 40 + Math.sin(animState.time + i) * 20;
        ctx.fillRect(-laptopW / 2 + 20, -100 + i * 14, lineW, 2);
    }

    ctx.restore();

    ctx.fillStyle = '#1a1a1a';
    for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 12; col++) {
            const kx = lx + 15 + col * 12;
            const ky = ly - 3 + row * 3;
            ctx.fillRect(kx, ky, 10, 2);
        }
    }

    return { x: lx + laptopW / 2, y: ly - 10 };
}

function drawRealisticFace(cx, cy, scale, char) {
    const s = scale;
    const skin = char.skinTone;
    const skinDark = darken(skin, 0.15);
    const skinLight = lighten(skin, 0.1);

    ctx.save();
    ctx.translate(cx, cy);

    ctx.fillStyle = skinDark;
    ctx.beginPath();
    ctx.moveTo(-25 * s, 60 * s);
    ctx.lineTo(25 * s, 60 * s);
    ctx.lineTo(20 * s, 100 * s);
    ctx.lineTo(-20 * s, 100 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = darken(skin, 0.25);
    ctx.beginPath();
    ctx.ellipse(0, 75 * s, 22 * s, 8 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.moveTo(-45 * s, -30 * s);
    ctx.bezierCurveTo(-48 * s, -10 * s, -50 * s, 20 * s, -40 * s, 50 * s);
    ctx.bezierCurveTo(-35 * s, 65 * s, -20 * s, 72 * s, 0, 72 * s);
    ctx.bezierCurveTo(20 * s, 72 * s, 35 * s, 65 * s, 40 * s, 50 * s);
    ctx.bezierCurveTo(50 * s, 20 * s, 48 * s, -10 * s, 45 * s, -30 * s);
    ctx.bezierCurveTo(42 * s, -55 * s, 25 * s, -70 * s, 0, -70 * s);
    ctx.bezierCurveTo(-25 * s, -70 * s, -42 * s, -55 * s, -45 * s, -30 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = darken(skin, 0.08);
    ctx.beginPath();
    ctx.moveTo(-45 * s, -30 * s);
    ctx.bezierCurveTo(-48 * s, -10 * s, -50 * s, 20 * s, -40 * s, 50 * s);
    ctx.bezierCurveTo(-35 * s, 65 * s, -20 * s, 72 * s, -5 * s, 72 * s);
    ctx.lineTo(-5 * s, -70 * s);
    ctx.bezierCurveTo(-25 * s, -70 * s, -42 * s, -55 * s, -45 * s, -30 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = skinLight;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.ellipse(0, -45 * s, 30 * s, 15 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = skinLight;
    ctx.globalAlpha = 0.2;
    ctx.beginPath();
    ctx.ellipse(-25 * s, 10 * s, 12 * s, 8 * s, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(25 * s, 10 * s, 12 * s, 8 * s, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    const noseY = 15 * s;
    ctx.fillStyle = darken(skin, 0.12);
    ctx.beginPath();
    ctx.moveTo(-4 * s, -10 * s);
    ctx.lineTo(-6 * s, noseY);
    ctx.lineTo(-2 * s, noseY + 5 * s);
    ctx.lineTo(2 * s, noseY + 5 * s);
    ctx.lineTo(6 * s, noseY);
    ctx.lineTo(4 * s, -10 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = skinLight;
    ctx.beginPath();
    ctx.ellipse(0, noseY + 2 * s, 5 * s, 3 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = darken(skin, 0.3);
    ctx.beginPath();
    ctx.ellipse(-4 * s, noseY + 6 * s, 2.5 * s, 1.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(4 * s, noseY + 6 * s, 2.5 * s, 1.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    drawRealisticEyes(0, -5 * s, s, char);
    drawEyebrows(0, -22 * s, s, char);
    drawRealisticMouth(0, 38 * s, s, char);
    drawEars(0, 5 * s, s, char);

    ctx.restore();
}

function drawRealisticEyes(cx, cy, s, char) {
    const eyeSpacing = 22 * s;
    const eyeY = cy;
    const eyeW = 14 * s;
    const eyeH = 8 * s;
    const blink = animState.isBlinking ? animState.blinkPhase : 0;
    const currentEyeH = eyeH * (1 - blink);

    const lookX = animState.eyeLookX * 4 * s;
    const lookY = animState.eyeLookY * 2 * s;

    [-1, 1].forEach(function(side) {
        const ex = cx + side * eyeSpacing;

        ctx.fillStyle = darken(char.skinTone, 0.1);
        ctx.beginPath();
        ctx.ellipse(ex, eyeY + 2 * s, eyeW + 2 * s, eyeH + 3 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath();
        ctx.ellipse(ex, eyeY, eyeW, currentEyeH, 0, 0, Math.PI * 2);
        ctx.fill();

        if (blink < 0.9) {
            const irisColor = char.eyeColor;
            ctx.fillStyle = irisColor;
            ctx.beginPath();
            ctx.ellipse(ex + lookX, eyeY + lookY, eyeW * 0.55, currentEyeH * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = darken(irisColor, 0.3);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(ex + lookX, eyeY + lookY, eyeW * 0.4, currentEyeH * 0.55, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.ellipse(ex + lookX, eyeY + lookY, eyeW * 0.28, currentEyeH * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.ellipse(ex + lookX - 2 * s, eyeY + lookY - 2 * s, 2.5 * s, 1.8 * s, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.ellipse(ex + lookX + 3 * s, eyeY + lookY + 1 * s, 1.5 * s, 1 * s, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = char.skinTone;
        ctx.beginPath();
        ctx.ellipse(ex, eyeY - eyeH * 0.3, eyeW + 1 * s, eyeH * 0.6, 0, Math.PI, 0);
        ctx.fill();

        ctx.strokeStyle = darken(char.skinTone, 0.15);
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.ellipse(ex, eyeY - eyeH * 0.8, eyeW * 0.9, eyeH * 0.4, 0, Math.PI * 0.2, Math.PI * 0.8);
        ctx.stroke();

        ctx.fillStyle = char.skinTone;
        ctx.beginPath();
        ctx.ellipse(ex, eyeY + eyeH * 0.5, eyeW * 0.9, eyeH * 0.4, 0, 0, Math.PI);
        ctx.fill();

        ctx.strokeStyle = darken(char.hairColor, 0.2);
        ctx.lineWidth = 0.8;
        for (let i = -3; i <= 3; i++) {
            const lashX = ex + i * 3 * s;
            const lashY = eyeY - eyeH * 0.5;
            ctx.beginPath();
            ctx.moveTo(lashX, lashY);
            ctx.lineTo(lashX + i * 0.5 * s, lashY - (3 + Math.abs(i) * 0.5) * s);
            ctx.stroke();
        }
    });
}

function drawEyebrows(cx, cy, s, char) {
    const browSpacing = 22 * s;
    const browY = cy;

    [-1, 1].forEach(function(side) {
        const bx = cx + side * browSpacing;
        ctx.strokeStyle = char.hairColor;
        ctx.lineWidth = 2.5 * s;
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(bx - 10 * s, browY + side * 2 * s);
        ctx.quadraticCurveTo(bx, browY - 3 * s + side * 1 * s, bx + 10 * s, browY + side * 3 * s);
        ctx.stroke();

        ctx.lineWidth = 0.5 * s;
        for (let i = 0; i < 8; i++) {
            const hx = bx - 8 * s + i * 2.5 * s;
            const hy = browY + Math.sin(i * 0.5) * 2 * s;
            ctx.beginPath();
            ctx.moveTo(hx, hy);
            ctx.lineTo(hx + (Math.random() - 0.3) * 3 * s, hy - 2 * s);
            ctx.stroke();
        }
    });
}

function drawRealisticMouth(cx, cy, s, char) {
    const mouthOpen = animState.mouthOpen;
    const lipColor = char.lipColor;
    const lipDark = darken(lipColor, 0.2);

    ctx.fillStyle = lipColor;
    ctx.beginPath();
    ctx.moveTo(cx - 12 * s, cy);
    ctx.quadraticCurveTo(cx - 6 * s, cy - 4 * s, cx, cy - 2 * s);
    ctx.quadraticCurveTo(cx + 6 * s, cy - 4 * s, cx + 12 * s, cy);
    ctx.quadraticCurveTo(cx + 6 * s, cy + 1 * s, cx, cy + 1 * s);
    ctx.quadraticCurveTo(cx - 6 * s, cy + 1 * s, cx - 12 * s, cy);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = lipDark;
    ctx.beginPath();
    ctx.moveTo(cx - 10 * s, cy + 1 * s);
    ctx.quadraticCurveTo(cx - 5 * s, cy + (5 + mouthOpen * 8) * s, cx, cy + (4 + mouthOpen * 8) * s);
    ctx.quadraticCurveTo(cx + 5 * s, cy + (5 + mouthOpen * 8) * s, cx + 10 * s, cy + 1 * s);
    ctx.quadraticCurveTo(cx + 5 * s, cy + 2 * s, cx, cy + 2 * s);
    ctx.quadraticCurveTo(cx - 5 * s, cy + 2 * s, cx - 10 * s, cy + 1 * s);
    ctx.closePath();
    ctx.fill();

    if (mouthOpen > 0.1) {
        ctx.fillStyle = '#4a2020';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 3 * s, 8 * s, 3 * s * mouthOpen, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f0f0f0';
        ctx.beginPath();
        ctx.rect(cx - 6 * s, cy + 1 * s, 12 * s, 2 * s * mouthOpen);
        ctx.fill();

        ctx.fillStyle = '#cc6666';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 4 * s, 5 * s, 2 * s * mouthOpen, 0, 0, Math.PI);
        ctx.fill();
    }

    ctx.strokeStyle = lighten(lipColor, 0.3);
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(cx - 8 * s, cy - 1 * s);
    ctx.quadraticCurveTo(cx, cy - 3 * s, cx + 8 * s, cy - 1 * s);
    ctx.stroke();
    ctx.globalAlpha = 1;
}

function drawEars(cx, cy, s, char) {
    [-1, 1].forEach(function(side) {
        const ex = cx + side * 48 * s;
        ctx.fillStyle = char.skinTone;
        ctx.beginPath();
        ctx.ellipse(ex, cy, 6 * s, 12 * s, side * 0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = darken(char.skinTone, 0.15);
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(ex - side * 2 * s, cy - 6 * s);
        ctx.quadraticCurveTo(ex + side * 3 * s, cy, ex - side * 2 * s, cy + 6 * s);
        ctx.stroke();
    });
}

function drawHair(cx, cy, s, char) {
    const hairColor = char.hairColor;
    const hairLight = lighten(hairColor, 0.15);

    ctx.save();
    ctx.translate(cx, cy);

    if (config.gender === 'female') {
        ctx.fillStyle = hairColor;
        ctx.beginPath();
        ctx.moveTo(-50 * s, -40 * s);
        ctx.bezierCurveTo(-55 * s, -80 * s, -30 * s, -100 * s, 0, -100 * s);
        ctx.bezierCurveTo(30 * s, -100 * s, 55 * s, -80 * s, 50 * s, -40 * s);
        ctx.bezierCurveTo(52 * s, -20 * s, 48 * s, 0, 45 * s, 20 * s);
        ctx.lineTo(55 * s, 80 * s);
        ctx.lineTo(45 * s, 85 * s);
        ctx.lineTo(40 * s, 30 * s);
        ctx.lineTo(-40 * s, 30 * s);
        ctx.lineTo(-45 * s, 85 * s);
        ctx.lineTo(-55 * s, 80 * s);
        ctx.lineTo(-45 * s, 20 * s);
        ctx.bezierCurveTo(-48 * s, 0, -52 * s, -20 * s, -50 * s, -40 * s);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = hairLight;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.ellipse(-15 * s, -70 * s, 20 * s, 10 * s, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(15 * s, -65 * s, 18 * s, 8 * s, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.fillStyle = hairColor;
        ctx.beginPath();
        ctx.moveTo(-40 * s, -60 * s);
        ctx.quadraticCurveTo(-20 * s, -30 * s, 0, -35 * s);
        ctx.quadraticCurveTo(20 * s, -30 * s, 40 * s, -60 * s);
        ctx.lineTo(45 * s, -50 * s);
        ctx.quadraticCurveTo(20 * s, -20 * s, 0, -25 * s);
        ctx.quadraticCurveTo(-20 * s, -20 * s, -45 * s, -50 * s);
        ctx.closePath();
        ctx.fill();
    } else {
        ctx.fillStyle = hairColor;
        ctx.beginPath();
        ctx.moveTo(-48 * s, -30 * s);
        ctx.bezierCurveTo(-52 * s, -70 * s, -25 * s, -90 * s, 0, -90 * s);
        ctx.bezierCurveTo(25 * s, -90 * s, 52 * s, -70 * s, 48 * s, -30 * s);
        ctx.bezierCurveTo(50 * s, -10 * s, 45 * s, 5 * s, 40 * s, 15 * s);
        ctx.lineTo(35 * s, 10 * s);
        ctx.lineTo(30 * s, -10 * s);
        ctx.lineTo(-30 * s, -10 * s);
        ctx.lineTo(-35 * s, 10 * s);
        ctx.lineTo(-40 * s, 15 * s);
        ctx.bezierCurveTo(-45 * s, 5 * s, -50 * s, -10 * s, -48 * s, -30 * s);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = hairLight;
        ctx.lineWidth = 0.5;
        ctx.globalAlpha = 0.3;
        for (let i = -3; i <= 3; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 10 * s, -85 * s);
            ctx.lineTo(i * 8 * s, -50 * s);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

function drawBody(cx, cy, s, char) {
    ctx.save();
    ctx.translate(cx, cy);

    const suitColor = char.suitColor;
    const shirtColor = char.shirtColor;
    const tieColor = char.tieColor;

    ctx.fillStyle = suitColor;
    ctx.beginPath();
    ctx.moveTo(-70 * s, 50 * s);
    ctx.bezierCurveTo(-80 * s, 70 * s, -85 * s, 100 * s, -80 * s, 130 * s);
    ctx.lineTo(80 * s, 130 * s);
    ctx.bezierCurveTo(85 * s, 100 * s, 80 * s, 70 * s, 70 * s, 50 * s);
    ctx.bezierCurveTo(50 * s, 40 * s, 30 * s, 45 * s, 20 * s, 50 * s);
    ctx.lineTo(-20 * s, 50 * s);
    ctx.bezierCurveTo(-30 * s, 45 * s, -50 * s, 40 * s, -70 * s, 50 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = darken(suitColor, 0.15);
    ctx.beginPath();
    ctx.moveTo(-70 * s, 50 * s);
    ctx.bezierCurveTo(-80 * s, 70 * s, -85 * s, 100 * s, -80 * s, 130 * s);
    ctx.lineTo(-20 * s, 130 * s);
    ctx.lineTo(-20 * s, 50 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = shirtColor;
    ctx.beginPath();
    ctx.moveTo(-20 * s, 50 * s);
    ctx.lineTo(-25 * s, 75 * s);
    ctx.lineTo(-5 * s, 70 * s);
    ctx.lineTo(0, 55 * s);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(20 * s, 50 * s);
    ctx.lineTo(25 * s, 75 * s);
    ctx.lineTo(5 * s, 70 * s);
    ctx.lineTo(0, 55 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = darken(shirtColor, 0.1);
    ctx.beginPath();
    ctx.moveTo(-20 * s, 50 * s);
    ctx.lineTo(-15 * s, 65 * s);
    ctx.lineTo(-5 * s, 60 * s);
    ctx.lineTo(0, 55 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = tieColor;
    ctx.beginPath();
    ctx.moveTo(-6 * s, 55 * s);
    ctx.lineTo(6 * s, 55 * s);
    ctx.lineTo(4 * s, 70 * s);
    ctx.lineTo(8 * s, 110 * s);
    ctx.lineTo(0, 120 * s);
    ctx.lineTo(-8 * s, 110 * s);
    ctx.lineTo(-4 * s, 70 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = lighten(tieColor, 0.2);
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.moveTo(-2 * s, 60 * s);
    ctx.lineTo(2 * s, 60 * s);
    ctx.lineTo(1 * s, 100 * s);
    ctx.lineTo(-1 * s, 100 * s);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = darken(suitColor, 0.1);
    ctx.beginPath();
    ctx.moveTo(-20 * s, 50 * s);
    ctx.lineTo(-35 * s, 130 * s);
    ctx.lineTo(-10 * s, 130 * s);
    ctx.lineTo(-5 * s, 70 * s);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(20 * s, 50 * s);
    ctx.lineTo(35 * s, 130 * s);
    ctx.lineTo(10 * s, 130 * s);
    ctx.lineTo(5 * s, 70 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = lighten(suitColor, 0.3);
    ctx.beginPath();
    ctx.arc(-15 * s, 95 * s, 2 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-15 * s, 110 * s, 2 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawHands(cx, cy, s, char) {
    ctx.save();
    ctx.translate(cx, cy);

    const handY = 75 * s;
    const handGesture = animState.handGesture;

    ctx.fillStyle = char.skinTone;
    const leftHandX = -50 * s + Math.sin(animState.time * 0.8) * 3 * s;

    ctx.beginPath();
    ctx.ellipse(leftHandX, handY, 12 * s, 8 * s, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = darken(char.skinTone, 0.1);
    for (let i = 0; i < 4; i++) {
        const fx = leftHandX - 6 * s + i * 4 * s;
        const fy = handY - 5 * s + Math.sin(animState.time * 2 + i) * 1 * s;
        ctx.beginPath();
        ctx.ellipse(fx, fy, 1.5 * s, 4 * s, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = char.skinTone;
    const rightHandX = 50 * s + Math.sin(animState.time * 0.6 + 1) * 5 * s;
    const rightHandY = handY - handGesture * 10 * s;

    ctx.beginPath();
    ctx.ellipse(rightHandX, rightHandY, 12 * s, 8 * s, 0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = darken(char.skinTone, 0.1);
    for (let i = 0; i < 4; i++) {
        const fx = rightHandX - 6 * s + i * 4 * s;
        const fy = rightHandY - 5 * s + Math.sin(animState.time * 1.5 + i + 2) * 1.5 * s;
        ctx.beginPath();
        ctx.ellipse(fx, fy, 1.5 * s, 4 * s, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

// ============================================================
// MAIN RENDER LOOP
// ============================================================

function updateAnimation() {
    animState.time += 0.016;

    animState.breathPhase = Math.sin(animState.time * 1.5) * 0.5 + 0.5;
    animState.headTilt = Math.sin(animState.time * 0.4) * 0.03;
    animState.headNod = Math.sin(animState.time * 0.6) * 0.02;

    const lookTime = animState.time * 0.3;
    animState.eyeLookX = Math.sin(lookTime) * Math.cos(lookTime * 0.7);
    animState.eyeLookY = Math.sin(lookTime * 0.5) * 0.5;

    if (!animState.isBlinking && Math.random() < 0.003) {
        animState.isBlinking = true;
        animState.blinkDuration = 0.15 + Math.random() * 0.1;
        animState.blinkPhase = 0;
    }

    if (animState.isBlinking) {
        animState.blinkPhase += 0.016 / animState.blinkDuration;
        if (animState.blinkPhase >= 1) {
            animState.isBlinking = false;
            animState.blinkPhase = 0;
        }
    }

    animState.handGesture = sin01(animState.time * 0.5) * 0.3;

    if (animState.isSpeaking && animState.speechQueue.length > 0) {
        const ch = animState.speechQueue[animState.speechIndex] || ' ';
        const isVowel = /[aeiouAEIOUàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ]/.test(ch);
        const isConsonant = /[bcdfghjklmnpqrstvwxyzBCDFGHJKLMNPQRSTVWXYZ]/.test(ch);

        if (isVowel) {
            animState.mouthTarget = 0.7 + Math.sin(animState.time * 15) * 0.2;
        } else if (isConsonant) {
            animState.mouthTarget = 0.2 + Math.sin(animState.time * 20) * 0.1;
        } else {
            animState.mouthTarget = 0.05;
        }

        if (Math.floor(animState.time * 12) > animState.speechIndex) {
            animState.speechIndex++;
            if (animState.speechIndex >= animState.speechQueue.length) {
                animState.isSpeaking = false;
                animState.speechQueue = [];
                animState.speechIndex = 0;
            }
        }
    } else {
        animState.mouthTarget = 0;
    }

    animState.mouthOpen = lerp(animState.mouthOpen, animState.mouthTarget, 0.2);
}

function render() {
    const w = canvas.width, h = canvas.height;
    const char = characters[config.language + '-' + config.gender];

    ctx.clearRect(0, 0, w, h);

    drawStudioBackground();
    drawDesk();

    const anchorX = w / 2;
    const anchorY = h * 0.42;
    const scale = Math.min(w, h) / 500;

    const breathY = Math.sin(animState.time * 1.5) * 2;
    const renderY = anchorY + breathY;

    drawBody(anchorX, renderY + 30 * scale, scale, char);
    drawHair(anchorX, renderY - 20 * scale, scale, char);

    ctx.save();
    ctx.translate(anchorX, renderY);
    ctx.rotate(animState.headTilt);
    ctx.translate(-anchorX, -renderY);
    drawRealisticFace(anchorX, renderY, scale, char);
    ctx.restore();

    drawHands(anchorX, renderY + 60 * scale, scale, char);
    drawLaptop(anchorX, renderY + 70 * scale);

    updateAnimation();
    requestAnimationFrame(render);
}

// ============================================================
// SPEECH & TTS
// ============================================================

function speakText(text, lang) {
    if (!text) return;

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    const langMap = {
        'en': 'en-US',
        'ml': 'ml-IN',
        'hi': 'hi-IN',
        'ar': 'ar-SA'
    };

    utterance.lang = langMap[lang] || 'en-US';
    utterance.rate = 0.95;
    utterance.pitch = config.gender === 'female' ? 1.05 : 0.9;
    utterance.volume = 1;

    animState.speechQueue = text.split('');
    animState.speechIndex = 0;
    animState.isSpeaking = true;

    utterance.onend = function() {
        animState.isSpeaking = false;
        animState.speechQueue = [];
        animState.mouthTarget = 0;
    };

    utterance.onerror = function() {
        animState.isSpeaking = false;
        animState.speechQueue = [];
    };

    window.speechSynthesis.speak(utterance);
}

// ============================================================
// WORKER API - Matches your Cloudflare Worker exactly
// POST /news -> {text: "news content"}
// ============================================================

async function generateNews() {
    const workerUrl = document.getElementById('worker-url').value.trim();
    if (!workerUrl) {
        alert('Please add your Cloudflare Worker URL');
        return;
    }
    const btn = document.getElementById('btn-generate');
    btn.textContent = 'Generating...';
    btn.disabled = true;
    updateWorkerStatus('loading', 'Fetching news...');
    try {
        const response = await fetch(workerUrl + '?lang=' + config.language);
        if (!response.ok) throw new Error('Worker response: ' + response.status);
        const data = await response.json();
        const articles = data.articles || [];
        if (!articles.length) throw new Error('No articles');
        const newsText = articles.slice(0,3).map(a => a.title + '. ' + (a.description||'')).join(' | ');
        document.getElementById('ticker-text').textContent = newsText.replace(/
/g, ' - ');
        speakText(newsText, config.language);
        updateWorkerStatus('online', 'News loaded - ' + config.language.toUpperCase());
    } catch (error) {
        console.error('News error:', error);
        updateWorkerStatus('offline', 'Error: ' + error.message);
        const fallback = {
            'en': 'Welcome to DDOTT News. Your AI-powered news anchor is ready.',
            'ml': 'ഡോട്ട് ന്യൂസിലേക്ക് സ്വാഗതം.',
            'hi': 'डॉट न्यूज़ में आपका स्वागत है।',
            'ar': 'أهلاً بكم في قناة دوت نيوز.'
        };
        const text = fallback[config.language] || fallback['en'];
        document.getElementById('ticker-text').textContent = text;
        speakText(text, config.language);
    } finally {
        btn.textContent = 'Generate News';
        btn.disabled = false;
    }
}


function updateWorkerStatus(status, message) {
    const indicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('worker-status');

    indicator.className = 'status-' + status;
    statusText.textContent = message;
}

// Worker URL change listener
async function checkWorker() {
  const statusEl = document.getElementById('worker-status');
  try {
    const res = await fetch(config.workerUrl + '/news', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({language: 'en', gender: 'female'}),
      signal: AbortSignal.timeout(8000)
    });
    if (res.ok) {
      statusEl.textContent = 'Worker connected ✓';
      statusEl.style.color = '#00ff88';
    } else {
      statusEl.textContent = 'Worker error: ' + res.status;
      statusEl.style.color = '#ff4444';
    }
  } catch(e) {
    statusEl.textContent = 'Worker not connected';
    statusEl.style.color = '#ff4444';
  }
}
window.addEventListener('load', () => setTimeout(checkWorker, 1200));

document.getElementById('worker-url').addEventListener('change', function(e) {
    config.workerUrl = e.target.value;
});
