<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marriage Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/messaging/supabase-config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F1F8F4;color:#12332A;--accent:#F0D58C;padding-bottom:40px}
body.fem{--accent:#C2336B}
.th-def,.th-muslim,.th-mixed,.th-other{--brand:#0B5D46;--soft:#DDF3E8}
.th-hindu{--brand:#B45309;--soft:#FDEBD0}
.th-christian{--brand:#1E3A8A;--soft:#E3EBFF}
.head{background:#0B5D46;color:#fff;padding:14px 16px 12px;border-bottom:4px solid var(--accent);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.head h1{margin:0;font-size:19px;font-weight:700}
.head p{margin:2px 0 0;font-size:12px;color:#CFE8DD}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:22px;border-radius:12px}
.sec{margin:16px 16px 8px;font-size:15px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 4px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFE3D9;background:#fff;color:#12332A;font:600 13px inherit;cursor:pointer}
.chip.on{background:#0B5D46;border-color:#0B5D46;color:#fff}
body.fem .chip.on{background:#C2336B;border-color:#C2336B}
.card{background:#fff;border:1px solid #DCEBE3;border-top:4px solid var(--brand,#0B5D46);border-radius:16px;padding:14px;margin:0 16px 12px}
.row{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:var(--brand,#0B5D46);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.grow{flex:1;min-width:0}
.name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.sub{font-size:12px;color:#4C6A60;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{background:var(--soft,#DDF3E8);color:#12332A;font-size:12px;padding:4px 10px;border-radius:8px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft,#DDF3E8);color:#12332A}
.pill.off{background:#ECEFED;color:#4C6A60}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border:0;border-radius:12px;background:var(--brand,#0B5D46);color:#fff;font:600 14px inherit;cursor:pointer;padding:0 16px}
.btn.gold{background:#E3C268;color:#3A2A00}
.btn.ghost{background:#fff;color:var(--brand,#0B5D46);border:1px solid var(--brand,#0B5D46)}
.btn.sm{width:auto;min-height:44px}
.btn:disabled{opacity:.5}
.note{margin:0 16px 12px;font-size:12px;line-height:1.5;color:#4C6A60}
.msg{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:12px;background:var(--soft,#DDF3E8);margin-top:10px}
.top{padding:14px 16px 0}
.ov{position:fixed;inset:0;background:rgba(10,30,24,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px}
.sheet h2{margin:0 0 10px;font-size:17px}
label.f{display:block;font-size:12px;font-weight:600;margin:12px 0 4px;color:#4C6A60}
input[type=text],input[type=number],select,textarea{width:100%;min-height:44px;border:1px solid #CFE3D9;border-radius:12px;padding:10px 12px;font:14px inherit;background:#fff;color:#12332A}
textarea{min-height:80px}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;font-size:13px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--brand,#0B5D46)}
.rule{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #E6F0EA;font-size:13px;line-height:1.45}
.rule b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft,#DDF3E8);display:flex;align-items:center;justify-content:center;font-size:12px}
.toast{position:fixed;left:16px;right:16px;bottom:24px;background:#12332A;color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;z-index:30;display:none}
.req{padding:10px 0;border-top:1px solid #E6F0EA;font-size:13px}
.req .who{font-weight:700}
.req .meta{color:#4C6A60;font-size:12px;margin:2px 0 4px;line-height:1.45}
.req .acts{display:flex;gap:8px;margin-top:8px}
.center{text-align:center;padding:40px 24px;color:#4C6A60}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.bn{margin:-14px -14px 12px;height:110px;border-radius:12px 12px 0 0;background:var(--soft,#DDF3E8) center/cover no-repeat}
.bnp{height:90px;border-radius:12px;background:var(--soft,#DDF3E8) center/cover no-repeat;margin-top:4px}
.avp{width:64px;height:64px;border-radius:50%;background:var(--soft,#DDF3E8) center/cover no-repeat;margin-top:4px}
.exp{font-size:13px;line-height:1.5;margin:8px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.pickrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
input[type=file]{font-size:13px;max-width:100%}
.chatbox{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--soft,#DDF3E8);border-radius:12px;margin-top:8px}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap;background:#fff;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--brand,#0B5D46);color:#fff}
.chatin{display:flex;gap:8px;margin-top:10px}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mem{padding:12px 0;border-top:1px solid #E6F0EA;font-size:13px}
.mem .who{font-weight:700;font-size:14px}
.pgban{height:150px;background:linear-gradient(135deg,var(--brand,#0B5D46),var(--soft,#DDF3E8)) center/cover no-repeat}
.pghead{padding:0 16px;margin-top:-46px;position:relative}
.pgav{width:92px;height:92px;border-radius:50%;border:4px solid #F1F8F4;background:var(--brand,#0B5D46) center/cover no-repeat;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700}
.pgname{margin:10px 0 0;font-size:22px;font-weight:800;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 16px 0}
.stat{background:#fff;border:1px solid #DCEBE3;border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--brand,#0B5D46)}
.stat span{font-size:11px;color:#4C6A60}
.tabs{display:flex;gap:6px;margin:16px 16px 0;border-bottom:1px solid #DCEBE3}
.tab{flex:1;min-height:44px;border:0;background:none;font:600 14px inherit;color:#4C6A60;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--brand,#0B5D46);border-bottom-color:var(--brand,#0B5D46)}
.pgbody{margin:12px 16px 0}
.pgact{margin:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.backb{margin:8px 8px 0;min-height:44px;border:0;background:none;color:var(--brand,#0B5D46);font:600 14px inherit;cursor:pointer}
</style>
</head>
<body>
<div class="head">
  <a class="back" href="/" aria-label="Back to Home">&#8592;</a>
  <div><h1>Marriage Studio</h1><p>Find your match, guided by a Coordinator</p></div>
</div>
<div id="app"><div class="center">Loading...</div></div>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const RELIGIONS = { hindu:'Hindu', muslim:'Muslim', christian:'Christian', other:'Other', mixed:'Mixed religion' };
const REJECT_MSG = 'Verification coordinator busy or unavailable this moment, please try another community.';
let me = null, comms = [], myReqs = {}, myProfiles = {}, pending = [], filter = 'all', cur = null;
let pickAv = null, pickBn = null, rmAv = false, rmBn = false, busy = false;
let matches = [], profs = {}, chatTimer = null, chatCtx = null, chatCount = -1;
let viewing = null, ptab = 'about', stats = {};
const RULES = [
  'Check that this community\'s religion and caste match your details. This is your responsibility.',
  'Your profile details must be true and match your ID.',
  'Once the verification payment is completed there is no refund for your own mistakes. Any error on our side is refunded in full.',
  'Chat unrelated to marriage or flirting: first a warning, then a block.',
  '18+ only. Photos are shown to both sides only after the unlock payment.',
  'We never show or sell your details to anyone. They are used only for verification and matching.'
];
const BUCKET = 'marriage-community-media';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3500); }
function errText(e) { if (!e) return ''; if (e.code === '23505') return 'This is already done.'; return e.message || 'Something went wrong, please try again.'; }
function theme(c) { return 'th-' + (c && c.religion ? c.religion : 'def'); }
function avHtml(c) { return '<div class="av">' + (c.avatar_url ? '<img src="' + esc(c.avatar_url) + '" alt="">' : esc(c.name.charAt(0).toUpperCase())) + '</div>'; }
function bnHtml(c) { return c.banner_url ? '<div class="bn" style="background-image:url(\'' + esc(c.banner_url) + '\')"></div>' : ''; }
function coordLine(c) {
  let t = 'Coordinator' + (c.coord_name ? ' \u00b7 ' + c.coord_name : '');
  if (c.exp_years != null) t += ' \u00b7 ' + c.exp_years + (c.exp_years === 1 ? ' year' : ' years') + ' experience';
  return t;
}
function resizeImg(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(u);
      cv.toBlob(b => b ? res(b) : rej(new Error('Could not process this image.')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Could not read this image.')); };
    img.src = u;
  });
}
async function uploadImg(file, kind, max) {
  const blob = await resizeImg(file, max);
  const path = me.id + '/' + kind + '-' + Date.now() + '.jpg';
  const r = await db.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
  if (r.error) throw r.error;
  return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
function dropOld(url) {
  try { const i = url ? url.indexOf('/' + BUCKET + '/') : -1; if (i > -1) db.storage.from(BUCKET).remove([url.slice(i + BUCKET.length + 2)]); } catch (e) {}
}

function pName(m, uid) { const x = profs[m.community_id + ':' + uid]; return x ? x.display_name : 'Member'; }
function threadFor(m) { return m.user_a === me.id ? 'coord_a' : 'coord_b'; }

function userMatchHtml(m) {
  const iA = m.user_a === me.id, other = iA ? m.user_b : m.user_a, name = pName(m, other);
  const c = comms.find(x => x.id === m.community_id) || {};
  let h = '<div class="card ' + theme(c) + '"><div class="name">' + esc(name) + '</div><div class="sub">' + esc(c.name || '') + '</div>';
  if (!m.b_accepted) {
    if (iA) h += '<div class="msg">Interest sent. Waiting for ' + esc(name) + ' to accept.</div>';
    else h += '<div class="msg">' + esc(name) + ' is interested in you. Accept to start talking with the Coordinator.</div><div class="mrow"><button class="btn sm" data-act="macc" data-id="' + m.id + '">Accept</button></div>';
  } else if (!m.coordinator_approved) {
    const myOk = iA ? m.a_ok : m.b_ok;
    h += '<div class="mrow"><button class="btn sm" data-act="chat" data-id="' + m.id + '" data-t="' + threadFor(m) + '" data-n="Coordinator">Chat with Coordinator</button>';
    h += '<button class="btn ghost sm" data-act="mok" data-id="' + m.id + '">' + (myOk ? 'I am not ok now' : 'I am ok to go ahead') + '</button></div>';
    h += '<div class="sub" style="margin-top:8px">' + (m.a_ok && m.b_ok ? 'Both sides said ok. Waiting for the Coordinator to approve.' : (myOk ? 'You said ok. Waiting for the Coordinator.' : 'Talk to the Coordinator, then tell us if you are ok to go ahead.')) + '</div>';
  } else if (!m.unlocked_at) {
    h += '<div class="msg">Approved by the Coordinator. Unlocking direct chat and photos (50 Emo) will open in the next update.</div>';
  } else {
    h += '<div class="mrow"><button class="btn sm" data-act="chat" data-id="' + m.id + '" data-t="direct" data-n="' + esc(name) + '">Chat with ' + esc(name) + '</button></div>';
  }
  return h + '</div>';
}

function coordMatchHtml(m) {
  const a = pName(m, m.user_a), b = pName(m, m.user_b);
  let h = '<div class="req"><div class="who">' + esc(a) + ' &#8644; ' + esc(b) + '</div>';
  if (!m.b_accepted) { h += '<div class="meta">Waiting for ' + esc(b) + ' to accept the interest.</div></div>'; return h; }
  h += '<div class="meta">' + esc(a) + ' ok: ' + (m.a_ok ? 'yes' : 'no') + ' &middot; ' + esc(b) + ' ok: ' + (m.b_ok ? 'yes' : 'no') + '</div>';
  h += '<div class="mrow"><button class="btn ghost sm" data-act="chat" data-id="' + m.id + '" data-t="coord_a" data-n="' + esc(a) + '">Chat with ' + esc(a) + '</button>';
  h += '<button class="btn ghost sm" data-act="chat" data-id="' + m.id + '" data-t="coord_b" data-n="' + esc(b) + '">Chat with ' + esc(b) + '</button></div>';
  if (m.coordinator_approved) h += '<div class="msg">Approved' + (m.unlocked_at ? ' and unlocked.' : '. Waiting for the unlock.') + '</div>';
  else if (m.a_ok && m.b_ok) h += '<div class="mrow"><button class="btn sm" data-act="mappr" data-id="' + m.id + '">Approve this match</button></div>';
  return h + '</div>';
}

async function init() {
  if (typeof db === 'undefined') { $('app').innerHTML = '<div class="center">App connection not found. Please open Ddott.TV and try again.</div>'; return; }
  const { data } = await db.auth.getUser();
  if (!data || !data.user) { $('app').innerHTML = '<div class="center">Please log in to Ddott.TV to use Marriage Studio.<br><br><a class="btn sm" style="display:inline-flex" href="/">Go to Home</a></div>'; return; }
  me = data.user;
  await loadAll();
  const qc = new URLSearchParams(location.search).get('c');
  if (qc && comms.some(x => x.id === qc)) { viewing = qc; ptab = 'about'; loadStats(qc); }
  render();
}
window.addEventListener('popstate', () => {
  const qc = new URLSearchParams(location.search).get('c');
  viewing = qc && comms.some(x => x.id === qc) ? qc : null;
  if (viewing) { ptab = 'about'; loadStats(viewing); }
  if (me) render();
});
async function loadStats(id) {
  try {
    const r = await db.rpc('marriage_community_stats', { p_id: id });
    if (r && r.data) { stats[id] = r.data; if (viewing === id) render(); }
  } catch (e) {}
}
function openPage(id) {
  viewing = id; ptab = 'about';
  try { history.pushState({ c: id }, '', '?c=' + id); } catch (e) {}
  loadStats(id); render(); window.scrollTo(0, 0);
}
function backList() {
  if (history.state && history.state.c) { history.back(); return; }
  viewing = null;
  try { history.replaceState({}, '', location.pathname); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
async function shareLink(id) {
  const url = location.origin + '/marriage/?c=' + id;
  try { if (navigator.share) { await navigator.share({ title: 'Marriage Studio', url: url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast('Link copied.'); } catch (e) { toast(url); }
}

function actionHtml(c) {
  const rq = myReqs[c.id], hasProfile = !!myProfiles[c.id];
  if (!rq) return c.accepting ? '<button class="btn" data-act="join" data-id="' + c.id + '">Request to join</button>' : '<button class="btn" disabled>Not accepting right now</button>';
  if (rq.status === 'pending') return '<div class="msg">Request sent. Waiting for the Coordinator.</div>';
  if (rq.status === 'accepted') {
    if (!hasProfile) return '<button class="btn" data-act="mkprofile" data-id="' + c.id + '">Create your profile</button>';
    if (myProfiles[c.id].kyc_verified) return '<button class="btn" data-act="browse" data-id="' + c.id + '">Browse members</button>';
    return '<div class="msg">Your profile is created. Browsing members opens after your verification (ID and face), which will be added soon.</div>';
  }
  return '<div class="msg">' + esc(REJECT_MSG) + '</div>';
}

function pageHtml(c) {
  const st = stats[c.id], own = c.coordinator_id === me.id;
  let h = '<div class="' + theme(c) + '"><button class="backb" data-act="backlist">&#8592; Back</button>';
  h += '<div class="pgban"' + (c.banner_url ? ' style="background-image:url(\'' + esc(c.banner_url) + '\')"' : '') + '></div>';
  h += '<div class="pghead"><div class="pgav"' + (c.avatar_url ? ' style="background-image:url(\'' + esc(c.avatar_url) + '\')"' : '') + '>' + (c.avatar_url ? '' : esc(c.name.charAt(0).toUpperCase())) + '</div>';
  h += '<h1 class="pgname">' + esc(c.name) + '</h1><div class="sub">' + esc(coordLine(c)) + '</div>';
  h += '<div class="tags"><span class="pill' + (c.accepting ? '' : ' off') + '">' + (c.accepting ? 'Accepting' : 'Paused') + '</span><span class="tag">' + esc(RELIGIONS[c.religion]) + '</span><span class="tag">' + (c.caste_mode === 'fixed' ? esc(c.caste) + ' only' : 'Mixed caste') + '</span><span class="tag">Second marriage: ' + (c.second_marriage_allowed ? 'Yes' : 'No') + '</span></div></div>';
  h += '<div class="stats"><div class="stat"><b>' + (c.exp_years != null ? esc(c.exp_years) : '-') + '</b><span>Years experience</span></div>';
  h += '<div class="stat"><b>' + (st ? esc(st.members) : '-') + '</b><span>Members</span></div>';
  h += '<div class="stat"><b>' + (st ? esc(st.matches) : '-') + '</b><span>Matches</span></div></div>';
  h += '<div class="pgact">' + (own ? '<button class="btn ghost" data-act="editcomm" data-id="' + c.id + '">Edit Coordinator profile</button>' : actionHtml(c));
  h += '<button class="btn ghost" data-act="share" data-id="' + c.id + '">Share this page</button></div>';
  h += '<div class="tabs"><button class="tab' + (ptab === 'about' ? ' on' : '') + '" data-act="ptab" data-v="about">About</button><button class="tab' + (ptab === 'rules' ? ' on' : '') + '" data-act="ptab" data-v="rules">Rules</button></div><div class="pgbody">';
  if (ptab === 'about') h += c.exp_desc ? '<div class="exp" style="margin:0">' + esc(c.exp_desc) + '</div>' : '<div class="sub">The Coordinator has not added a description yet.</div>';
  else RULES.forEach((r, i) => h += '<div class="rule"><b>' + (i + 1) + '</b><div>' + esc(r) + '</div></div>');
  return h + '</div></div>';
}

async function loadAll() {
  const [c, r, p, mt] = await Promise.all([
    db.from('marriage_communities').select('*').order('created_at', { ascending: false }),
    db.from('marriage_join_requests').select('*').eq('user_id', me.id),
    db.from('marriage_profiles').select('community_id,gender,kyc_verified').eq('user_id', me.id),
    db.from('marriage_matches').select('*').order('created_at', { ascending: false })
  ]);
  matches = mt.data || [];
  profs = {};
  const ids = Array.from(new Set(matches.reduce((a, m) => a.concat([m.user_a, m.user_b]), [])));
  if (ids.length) {
    const pq = await db.from('marriage_profiles').select('user_id,community_id,display_name,age,caste,gender,is_second_marriage,intro').in('user_id', ids);
    (pq.data || []).forEach(x => profs[x.community_id + ':' + x.user_id] = x);
  }
  comms = c.data || [];
  myReqs = {}; (r.data || []).forEach(x => myReqs[x.community_id] = x);
  myProfiles = {}; (p.data || []).forEach(x => myProfiles[x.community_id] = x);
  const g = (p.data || [])[0] || (r.data || [])[0];
  const gender = g ? (g.gender || g.req_gender) : null;
  document.body.classList.toggle('fem', gender === 'female');
  const mine = comms.filter(x => x.coordinator_id === me.id).map(x => x.id);
  pending = [];
  if (mine.length) {
    const q = await db.from('marriage_join_requests').select('*').in('community_id', mine).eq('status', 'pending').order('created_at');
    pending = q.data || [];
  }
}

function render() {
  if (viewing) {
    const vc = comms.find(x => x.id === viewing);
    if (vc) { $('app').innerHTML = pageHtml(vc); return; }
    viewing = null;
  }
  const mine = comms.filter(c => c.coordinator_id === me.id);
  const list = comms.filter(c => c.coordinator_id !== me.id && (filter === 'all' || c.religion === filter));
  let h = '<div class="chips">';
  [['all','All'],['hindu','Hindu'],['muslim','Muslim'],['christian','Christian'],['mixed','Mixed']].forEach(f => {
    h += '<button class="chip' + (filter === f[0] ? ' on' : '') + '" data-act="filter" data-v="' + f[0] + '">' + f[1] + '</button>';
  });
  h += '</div><div class="top"><button class="btn gold" data-act="newcomm">Become a Coordinator</button></div>';

      h += '<div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="toggle" data-id="' + c.id + '">' + (c.accepting ? 'Pause' : 'Start') + '</button>';
      h += '<div class="grow"><label class="f" style="margin:0" for="lim' + c.id + '">User limit</label></div><input type="number" min="1" max="500" id="lim' + c.id + '" value="' + c.max_users + '" style="width:80px"><button class="btn sm" data-act="limit" data-id="' + c.id + '">Save</button></div>';
      h += '<div class="sub" style="margin-top:12px">Join requests waiting: ' + reqs.length + '</div>';
      reqs.forEach(q => {
        h += '<div class="req"><div class="who">' + esc(q.req_name) + ' · ' + esc(q.req_age) + ' · ' + (q.req_gender === 'female' ? 'Female' : 'Male') + '</div>';
        h += '<div class="meta">' + esc(RELIGIONS[q.req_religion]) + (q.req_caste ? ' · ' + esc(q.req_caste) : '') + (q.req_second_marriage ? ' · Second marriage' : '') + ' · ' + esc(new Date(q.created_at).toLocaleDateString()) + '</div>';
        if (q.req_intro) h += '<div>' + esc(q.req_intro) + '</div>';
        h += '<div class="acts"><button class="btn sm" data-act="accept" data-id="' + q.id + '">Accept</button><button class="btn ghost sm" data-act="reject" data-id="' + q.id + '">Reject</button></div></div>';
      });

      h += '</div>';
    });
  }

  const myM = matches.filter(m => m.user_a === me.id || m.user_b === me.id);
  if (myM.length) { h += '<div class="sec">My matches</div>'; myM.forEach(m => h += userMatchHtml(m)); }

  h += '<div class="sec">Communities</div>';
  if (!list.length) h += '<div class="center">No communities here yet.</div>';
  list.forEach(c => {
    h += '<div class="card ' + theme(c) + '">' + bnHtml(c) + '<div class="row" data-act="viewc" data-id="' + c.id + '" style="cursor:pointer">' + avHtml(c) + '<div class="grow"><div class="name">' + esc(c.name) + '</div><div class="sub">' + esc(coordLine(c)) + '</div></div>';
    h += '<span class="pill' + (c.accepting ? '' : ' off') + '">' + (c.accepting ? 'Accepting' : 'Paused') + '</span></div>';
    if (c.exp_desc) h += '<div class="exp">' + esc(c.exp_desc) + '</div>';
    h += '<div class="tags"><span class="tag">' + esc(RELIGIONS[c.religion]) + '</span><span class="tag">' + (c.caste_mode === 'fixed' ? esc(c.caste) + ' only' : 'Mixed caste') + '</span><span class="tag">Second marriage: ' + (c.second_marriage_allowed ? 'Yes' : 'No') + '</span></div>';
    h += actionHtml(c);
    h += '</div>';
  });
  h += '<p class="note">We never show or sell your details to anyone.</p>';
  $('app').innerHTML = h;
}

function chatSheet(mid, thread, title) {
  chatCtx = { mid: mid, thread: thread }; chatCount = -1;
  const m = matches.find(x => x.id === mid), c = m ? comms.find(x => x.id === m.community_id) : null;
  let h = '<h2>' + esc(title) + '</h2><div class="sub">Keep the chat about marriage only.</div>';
  h += '<div class="chatbox" id="chatbox"></div>';
  h += '<div class="chatin"><input type="text" id="chatmsg" maxlength="1000" placeholder="Type a message"><button class="btn sm" data-act="chatsend">Send</button></div>';
  h += '<button class="btn ghost" style="margin-top:10px" data-act="closesheet">Close</button>';
  openSheet(h, c);
  $('chatmsg').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); act('chatsend', null, e); } });
  loadChat();
  chatTimer = setInterval(loadChat, 4000);
}
async function loadChat() {
  if (!chatCtx) return;
  const ctx = chatCtx;
  const r = await db.from('marriage_messages').select('id,sender_id,body').eq('match_id', ctx.mid).eq('thread', ctx.thread).order('created_at', { ascending: true });
  if (!chatCtx || chatCtx !== ctx || r.error) return;
  const list = r.data || [];
  if (list.length === chatCount) return;
  chatCount = list.length;
  const box = $('chatbox'); if (!box) return;
  box.innerHTML = list.length ? list.map(x => '<div class="bub' + (x.sender_id === me.id ? ' me' : '') + '">' + esc(x.body) + '</div>').join('') : '<div class="sub" style="text-align:center">No messages yet. Say hello.</div>';
  box.scrollTop = box.scrollHeight;
}

function bindMedia(c) {
  pickAv = null; pickBn = null; rmAv = false; rmBn = false;
  if (c) {
    $('kn').value = c.coord_name || ''; $('ky').value = c.exp_years != null ? c.exp_years : ''; $('kd').value = c.exp_desc || '';
    if (c.avatar_url) $('avp').style.backgroundImage = 'url(\'' + c.avatar_url + '\')';
    if (c.banner_url) $('bnp').style.backgroundImage = 'url(\'' + c.banner_url + '\')';
  }
  $('avf').addEventListener('change', () => { const f = $('avf').files[0]; if (!f) return; pickAv = f; rmAv = false; $('avp').style.backgroundImage = 'url(\'' + URL.createObjectURL(f) + '\')'; });
  $('bnf').addEventListener('change', () => { const f = $('bnf').files[0]; if (!f) return; pickBn = f; rmBn = false; $('bnp').style.backgroundImage = 'url(\'' + URL.createObjectURL(f) + '\')'; });
}
function readCoord() {
  const name = $('kn').value.trim(), yv = $('ky').value.trim(), years = yv === '' ? null : parseInt(yv, 10), desc = $('kd').value.trim();
  if (name.length < 2) { toast('Please enter your display name.'); return null; }
  if (years !== null && (isNaN(years) || years < 0 || years > 60)) { toast('Experience should be between 0 and 60 years.'); return null; }
  return { coord_name: name, exp_years: years, exp_desc: desc || null };
}

async function act(a, el, ev) {
  const id = el && el.dataset ? el.dataset.id : null;
  if (a === 'filter') { filter = el.dataset.v; render(); }
  else if (a === 'newcomm') newCommSheet();
  else if (a === 'editcomm') { cur = comms.find(x => x.id === id); editCommSheet(cur); }
  else if (a === 'rmav') { pickAv = null; rmAv = true; $('avf').value = ''; $('avp').style.backgroundImage = ''; }
  else if (a === 'rmbn') { pickBn = null; rmBn = true; $('bnf').value = ''; $('bnp').style.backgroundImage = ''; }
  else if (a === 'closebg') { if (ev.target === el) closeSheet(); }
  else if (a === 'closesheet') closeSheet();
  else if (a === 'viewc') openPage(id);
  else if (a === 'backlist') backList();
  else if (a === 'ptab') { ptab = el.dataset.v; render(); }
  else if (a === 'share') shareLink(id);
  else if (a === 'browse') { browseSheet(comms.find(x => x.id === id)); }
  else if (a === 'interest') {
    const r = await db.from('marriage_matches').insert({ community_id: id, user_b: el.dataset.u });
    if (r.error) { toast(errText(r.error)); return; }
    closeSheet(); await loadAll(); render(); toast('Interest sent.');
  }
  else if (a === 'macc') {
    const r = await db.from('marriage_matches').update({ b_accepted: true }).eq('id', id);
    if (r.error) { toast(errText(r.error)); return; }
    await loadAll(); render(); toast('Accepted.');
  }
  else if (a === 'mok') {
    const m = matches.find(x => x.id === id), iA = m.user_a === me.id;
    const r = await db.from('marriage_matches').update(iA ? { a_ok: !m.a_ok } : { b_ok: !m.b_ok }).eq('id', id);
    if (r.error) { toast(errText(r.error)); return; }
    await loadAll(); render();
  }
  else if (a === 'mappr') {
    const r = await db.from('marriage_matches').update({ coordinator_approved: true }).eq('id', id);
    if (r.error) { toast(errText(r.error)); return; }
    await loadAll(); render(); toast('Match approved.');
  }
  else if (a === 'chat') { chatSheet(id, el.dataset.t, el.dataset.n === 'Coordinator' ? 'Coordinator chat' : 'Chat with ' + el.dataset.n); }
  else if (a === 'chatsend') {
    const inp = $('chatmsg'); if (!inp || !chatCtx) return;
    const body = inp.value.trim(); if (!body) return;
    inp.value = '';
    const r = await db.from('marriage_messages').insert({ match_id: chatCtx.mid, thread: chatCtx.thread, body: body });
    if (r.error) { toast(errText(r.error)); inp.value = body; return; }
    chatCount = -1; loadChat();
  }
  else if (a === 'join') { cur = comms.find(x => x.id === id); rulesSheet(cur); }
  else if (a === 'mkprofile') { cur = comms.find(x => x.id === id); profileSheet(cur); }
  else if (a === 'sendreq') {
    const name = $('rn').value.trim(), age = parseInt($('ra').value, 10), rel = $('rr').value, caste = cur.caste_mode === 'fixed' ? String(cur.caste).trim() : $('rc').value.trim(), second = $('rs').checked;
    if (name.length < 2) { toast('Please enter your name.'); return; }
    if (!age || age < 18 || age > 90) { toast('You must be 18 or above.'); return; }
    if (cur.religion !== 'mixed' && rel !== cur.religion) { toast('This community is only for ' + RELIGIONS[cur.religion] + '. Please choose another community.'); return; }
    if (cur.caste_mode === 'fixed' && !$('rcc').checked) { toast('Please confirm that you belong to ' + cur.caste + ', or choose another community.'); return; }
    if (second && !cur.second_marriage_allowed) { toast('Second marriage is not allowed in this community.'); return; }
    if (!$('acc').checked) { toast('Please accept the rules first.'); return; }
    const r = await db.from('marriage_join_requests').insert({ community_id: cur.id, rules_accepted_at: new Date().toISOString(), req_name: name, req_gender: $('rg').value, req_age: age, req_religion: rel, req_caste: caste || null, req_second_marriage: second, req_intro: $('ri').value.trim() || null });
    if (r.error) { toast(errText(r.error)); return; }
    closeSheet(); await loadAll(); render(); toast('Request sent.');
  }
  else if (a === 'savecomm') {
    if (busy) return;
    const name = $('cn').value.trim(), fixed = $('cm').value === 'fixed', caste = $('cc').value.trim();
    if (name.length < 3) { toast('Please enter a community name.'); return; }
    if (fixed && !caste) { toast('Please enter the caste name.'); return; }
    const co = readCoord(); if (!co) return;
    busy = true; $('savebtn').disabled = true; $('savebtn').textContent = 'Saving...';
    try {
      const row = { name: name, religion: $('cr').value, caste_mode: fixed ? 'fixed' : 'mixed', caste: fixed ? caste : null, second_marriage_allowed: $('cs').checked, max_users: Math.max(1, parseInt($('cl').value, 10) || 25), coord_name: co.coord_name, exp_years: co.exp_years, exp_desc: co.exp_desc };
      if (pickAv) row.avatar_url = await uploadImg(pickAv, 'avatar', 400);
      if (pickBn) row.banner_url = await uploadImg(pickBn, 'banner', 1200);
      const r = await db.from('marriage_communities').insert(row);
      if (r.error) throw r.error;
      closeSheet(); await loadAll(); render(); toast('Community created.');
    } catch (e) { toast(errText(e)); if ($('savebtn')) { $('savebtn').disabled = false; $('savebtn').textContent = 'Create community'; } }
    busy = false;
  }
  else if (a === 'saveedit') {
    if (busy) return;
    const co = readCoord(); if (!co) return;
    const c = comms.find(x => x.id === id);
    busy = true; $('savebtn').disabled = true; $('savebtn').textContent = 'Saving...';
    try {
      const upd = { coord_name: co.coord_name, exp_years: co.exp_years, exp_desc: co.exp_desc };
      const oldAv = c.avatar_url, oldBn = c.banner_url;
      if (pickAv) upd.avatar_url = await uploadImg(pickAv, 'avatar', 400); else if (rmAv) upd.avatar_url = null;
      if (pickBn) upd.banner_url = await uploadImg(pickBn, 'banner', 1200); else if (rmBn) upd.banner_url = null;
      const r = await db.from('marriage_communities').update(upd).eq('id', id);
      if (r.error) throw r.error;
      if ('avatar_url' in upd) dropOld(oldAv);
      if ('banner_url' in upd) dropOld(oldBn);
      closeSheet(); await loadAll(); render(); toast('Saved.');
    } catch (e) { toast(errText(e)); if ($('savebtn')) { $('savebtn').disabled = false; $('savebtn').textContent = 'Save'; } }
    busy = false;
  }
  else if (a === 'toggle') {
    const c = comms.find(x => x.id === id);
    const r = await db.from('marriage_communities').update({ accepting: !c.accepting }).eq('id', id);
    if (r.error) { toast(errText(r.error)); return; }
    await loadAll(); render();
  }
  else if (a === 'limit') {
    const v = Math.max(1, parseInt($('lim' + id).value, 10) || 1);
    const r = await db.from('marriage_communities').update({ max_users: v }).eq('id', id);
    if (r.error) { toast(errText(r.error)); return; }
    await loadAll(); render(); toast('Saved.');
  }
  else if (a === 'accept' || a === 'reject') {
    const r = await db.from('marriage_join_requests').update({ status: a === 'accept' ? 'accepted' : 'rejected' }).eq('id', id);
    if (r.error) { toast(errText(r.error)); return; }
    await loadAll(); render(); toast(a === 'accept' ? 'Accepted.' : 'Rejected.');
  }
  else if (a === 'saveprofile') {
    const name = $('pn').value.trim(), age = parseInt($('pa').value, 10);
    if (name.length < 2) { toast('Please enter your name.'); return; }
    if (!age || age < 18) { toast('You must be 18 or above.'); return; }
    const r = await db.from('marriage_profiles').insert({ community_id: cur.id, display_name: name, gender: $('pg').value, age: age, religion: $('pr').value, caste: $('pc').value.trim() || null, is_second_marriage: $('ps').checked, intro: $('pi').value.trim() || null });
    if (r.error) { toast(errText(r.error)); return; }
    closeSheet(); await loadAll(); render(); toast('Profile saved.');
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  act(el.dataset.act, el, e);
});
init();
</script>
</body>
