<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Music Mixer - Ddott TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: #1a1a3e;
            --bg-card-hover: #222250;
            --accent-cyan: #00d4ff;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-gold: #fbbf24;
            --accent-green: #22c55e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --text-muted: #6b6b8a;
            --border-color: rgba(255,255,255,0.08);
            --gradient-primary: linear-gradient(135deg, #a855f7, #ec4899);
            --shadow-glow: 0 0 30px rgba(168,85,247,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-particles { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
        .particle { position:absolute; width:3px; height:3px; background:var(--accent-purple); border-radius:50%; opacity:0.3; animation: float 15s infinite ease-in-out; }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity:0.3; }
            50% { transform: translateY(-20px) translateX(-15px); opacity:0.2; }
        }

        .header {
            position: fixed; top:0; left:0; right:0; z-index:100;
            background: rgba(10,10,26,0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-left { display:flex; align-items:center; gap:12px; }
        .back-btn {
            width:36px; height:36px; border-radius:10px;
            background: var(--bg-card); border:1px solid var(--border-color);
            display:flex; align-items:center; justify-content:center;
            color: var(--text-primary); font-size:18px; cursor:pointer;
        }
        .header-title {
            font-family:'Orbitron', sans-serif; font-size:16px; font-weight:700;
            background: var(--gradient-primary);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .header-subtitle { font-size:10px; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase; }
        .status-badge {
            display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px;
            background: rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3);
            font-size:11px; font-weight:600; color: var(--accent-green);
        }
        .status-dot { width:6px; height:6px; background:var(--accent-green); border-radius:50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(1.2); } }

        .main-content { padding-top:70px; padding-bottom:20px; position:relative; z-index:1; }

        /* Landing (no room yet) */
        .landing-section { padding: 20px 16px; text-align:center; }
        .mixer-avatar {
            width:90px; height:90px; margin:0 auto 16px; border-radius:50%;
            background: var(--gradient-primary); display:flex; align-items:center; justify-content:center;
            font-size:38px; box-shadow: var(--shadow-glow);
        }
        .landing-title { font-family:'Orbitron', sans-serif; font-size:22px; font-weight:700; margin-bottom:4px; }
        .landing-subtitle { color:var(--text-secondary); font-size:13px; margin-bottom:16px; }
        .beta-badge {
            display:inline-flex; align-items:center; gap:6px; padding:6px 16px; border-radius:20px;
            background: rgba(168,85,247,0.15); border:1px solid rgba(168,85,247,0.3);
            color: var(--accent-purple); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
            margin-bottom: 20px;
        }

        .login-prompt-card {
            background: var(--bg-card); border:1px solid var(--border-color); border-radius:18px;
            padding: 24px 18px; margin: 0 16px; text-align:center;
        }
        .login-prompt-card p { font-size:13px; color: var(--text-secondary); margin-bottom:16px; }
        .login-btn {
            display:inline-block; padding:12px 24px; border-radius:12px;
            background: var(--gradient-primary); color:#fff; font-weight:700; font-size:13px;
            text-decoration:none;
        }

        .action-cards { padding: 0 16px; display:flex; flex-direction:column; gap:12px; }
        .action-card {
            background: var(--bg-card); border:1px solid var(--border-color); border-radius:18px;
            padding: 18px;
        }
        .action-card h3 { font-size:14px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
        .action-input {
            width:100%; background: var(--bg-secondary); border:1px solid var(--border-color); border-radius:12px;
            padding:12px 14px; color:var(--text-primary); font-size:14px; outline:none; margin-bottom:10px;
            font-family:'Inter', sans-serif;
        }
        .action-input:focus { border-color: var(--accent-purple); }
        .action-btn {
            width:100%; padding:13px; border-radius:12px; border:none;
            background: var(--gradient-primary); color:#fff; font-size:14px; font-weight:700; cursor:pointer;
        }
        .action-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .action-btn.secondary {
            background: var(--bg-secondary); border:1px solid var(--border-color); color:var(--text-primary);
        }

        /* Room view */
        .room-section { display:none; }
        .room-section.active { display:block; }

        .room-header-bar {
            padding: 0 16px 12px; display:flex; align-items:center; justify-content:space-between;
        }
        .room-code-display {
            font-family:'Orbitron', sans-serif; font-size:13px; font-weight:700; color: var(--accent-purple);
            background: rgba(168,85,247,0.1); padding:6px 12px; border-radius:10px;
            border: 1px solid rgba(168,85,247,0.25);
        }
        .room-members { font-size:11px; color: var(--text-muted); }

        .chat-container {
            background: var(--bg-card); border:1px solid var(--border-color); border-radius:20px;
            margin: 0 16px; overflow:hidden; display:flex; flex-direction:column; height: 60vh;
        }
        .chat-messages { flex:1; padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }

        .msg { max-width:85%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.5; }
        .msg.mine { align-self:flex-end; background: var(--gradient-primary); color:#fff; border-bottom-right-radius:4px; }
        .msg.theirs { align-self:flex-start; background: var(--bg-secondary); border:1px solid var(--border-color); border-bottom-left-radius:4px; }
        .msg-name { font-size:10px; font-weight:700; opacity:0.7; margin-bottom:3px; }

        .msg.ai-idea {
            align-self:center; max-width:95%; width:95%;
            background: rgba(168,85,247,0.08); border:1px solid rgba(168,85,247,0.3); border-radius:16px;
            padding:14px;
        }
        .ai-idea-title { font-size:13px; font-weight:700; color: var(--accent-purple); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
        .ai-idea-content { font-size:12px; color: var(--text-secondary); line-height:1.7; white-space:pre-wrap; }

        .chat-input-area {
            padding: 12px 16px; border-top:1px solid var(--border-color);
            display:flex; gap:8px; align-items:center;
        }
        .chat-input {
            flex:1; background: var(--bg-secondary); border:1px solid var(--border-color); border-radius:22px;
            padding:11px 16px; color:var(--text-primary); font-size:13px; outline:none;
        }
        .send-btn {
            width:40px; height:40px; border-radius:50%; border:none;
            background: var(--gradient-primary); color:#fff; font-size:16px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }

        .generate-bar {
            margin: 12px 16px 0; display:flex; gap:8px;
        }
        .generate-select {
            flex:1; background: var(--bg-card); border:1px solid var(--border-color); border-radius:12px;
            padding:11px; color:var(--text-primary); font-size:12px; appearance:none; -webkit-appearance:none;
        }
        .generate-btn {
            padding: 11px 16px; border-radius:12px; border:none;
            background: var(--gradient-primary); color:#fff; font-size:12px; font-weight:700; cursor:pointer;
            white-space:nowrap;
        }
        .generate-btn:disabled { opacity:0.5; }

        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--accent-purple); border-radius:2px; }

        @media (min-width: 768px) {
            .main-content { max-width: 600px; margin:0 auto; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="leaveOrBack()">←</button>
            <div>
                <div class="header-title">AI MUSIC MIXER</div>
                <div class="header-subtitle">Ddott TV Studio</div>
            </div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>ONLINE</span>
        </div>
    </header>

    <main class="main-content">
        <!-- Landing: login check / create or join room -->
        <section id="landingSection">
            <div class="landing-section">
                <div class="mixer-avatar">🎵</div>
                <h1 class="landing-title">AI Music Mixer</h1>
                <p class="landing-subtitle">Jam with friends in real time — AI turns your chat into music ideas</p>
                <div class="beta-badge">🧪 BETA</div>
            </div>

            <div id="loginPrompt" class="login-prompt-card" style="display:none;">
                <p>Log in to create or join a jam room with friends.</p>
                <a href="/auth/login.html" class="login-btn">Log In</a>
            </div>

            <div id="actionCards" class="action-cards" style="display:none;">
                <div class="action-card">
                    <h3>🎤 Create a Room</h3>
                    <input type="text" class="action-input" id="roomNameInput" placeholder="Name your jam (optional)" maxlength="60">
                    <button class="action-btn" id="createRoomBtn" onclick="createRoom()">Create Room</button>
                </div>
                <div class="action-card">
                    <h3>🔑 Join a Room</h3>
                    <input type="text" class="action-input" id="joinCodeInput" placeholder="Enter room code e.g. MIX-7K2P" maxlength="20" style="text-transform:uppercase;">
                    <button class="action-btn secondary" id="joinRoomBtn" onclick="joinRoomByCode()">Join Room</button>
                </div>
            </div>
        </section>

        <!-- Room view -->
        <section class="room-section" id="roomSection">
            <div class="room-header-bar">
                <div class="room-code-display" id="roomCodeDisplay">MIX-XXXX</div>
                <div class="room-members" id="roomMembersDisplay">1 member</div>
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Say something…" onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendChatMessage()">➤</button>
                </div>
            </div>

            <div class="generate-bar">
                <select class="generate-select" id="ideaTypeSelect">
                    <option value="full_idea">🎶 Full Idea</option>
                    <option value="lyrics">✍️ Lyrics</option>
                    <option value="melody_idea">🎼 Melody</option>
                    <option value="chord_progression">🎹 Chords</option>
                </select>
                <button class="generate-btn" id="generateIdeaBtn" onclick="generateIdea()">✨ Generate</button>
            </div>
        </section>
    </main>

    <script src="../../supabase-config.js"></script>
    <script>
        const MUSIC_MIXER_WORKER_URL = "https://ddott-music-mixer.meradivin.workers.dev";

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 16; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        let currentUser = null;
        let currentRoom = null;
        let chatChannel = null;
        let recentMessages = []; // local cache for AI context

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return `MIX-${code}`;
        }

        // ============================================
        // Auth check
        // ============================================
        async function init() {
            try {
                const { data: { user } } = await window.db.auth.getUser();
                if (!user) {
                    document.getElementById('loginPrompt').style.display = 'block';
                    return;
                }
                currentUser = user;
                document.getElementById('actionCards').style.display = 'flex';
            } catch (e) {
                console.error('Auth check failed:', e);
                document.getElementById('loginPrompt').style.display = 'block';
            }
        }
        init();

        // ============================================
        // Room creation / joining
        // ============================================
        async function createRoom() {
            if (!currentUser) return;
            const btn = document.getElementById('createRoomBtn');
            btn.disabled = true;
            btn.textContent = 'Creating…';

            const name = document.getElementById('roomNameInput').value.trim() || 'Untitled Jam';
            const roomCode = generateRoomCode();

            try {
                const { data, error } = await window.db
                    .from('music_rooms')
                    .insert({ room_code: roomCode, name, created_by: currentUser.id })
                    .select()
                    .single();

                if (error) throw error;

                await joinRoomRecord(data);
            } catch (err) {
                console.error('Create room failed:', err);
                alert(`Could not create room: ${err.message || err}`);
                btn.disabled = false;
                btn.textContent = 'Create Room';
            }
        }

        async function joinRoomByCode() {
            if (!currentUser) return;
            const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
            if (!code) {
                alert('Enter a room code first.');
                return;
            }
            const btn = document.getElementById('joinRoomBtn');
            btn.disabled = true;
            btn.textContent = 'Joining…';

            try {
                const { data, error } = await window.db
                    .from('music_rooms')
                    .select('*')
                    .eq('room_code', code)
                    .eq('is_active', true)
                    .single();

                if (error || !data) throw new Error('Room not found. Check the code and try again.');

                await joinRoomRecord(data);
            } catch (err) {
                console.error('Join room failed:', err);
                alert(err.message || 'Could not join room.');
                btn.disabled = false;
                btn.textContent = 'Join Room';
            }
        }

        async function joinRoomRecord(room) {
            currentRoom = room;

            // Register membership (ignore if already a member)
            try {
                await window.db.from('music_room_members').insert({
                    room_id: room.id,
                    user_id: currentUser.id,
                    display_name: currentUser.email ? currentUser.email.split('@')[0] : 'Member',
                });
            } catch (e) {
                // likely already a member, fine to ignore
            }

            enterRoom(room);
        }

        // ============================================
        // Enter room UI + load history + subscribe realtime
        // ============================================
        async function enterRoom(room) {
            document.getElementById('landingSection').style.display = 'none';
            document.getElementById('roomSection').classList.add('active');
            document.getElementById('roomCodeDisplay').textContent = room.room_code;

            await loadMessages(room.id);
            await loadMemberCount(room.id);
            subscribeToRoom(room.id);
        }

        async function loadMessages(roomId) {
            const { data, error } = await window.db
                .from('music_room_messages')
                .select('*')
                .eq('room_id', roomId)
                .order('created_at', { ascending: true })
                .limit(50);

            if (error) {
                console.error('Load messages failed:', error);
                return;
            }

            recentMessages = data || [];
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            recentMessages.forEach(renderMessage);
            container.scrollTop = container.scrollHeight;
        }

        async function loadMemberCount(roomId) {
            const { count } = await window.db
                .from('music_room_members')
                .select('*', { count: 'exact', head: true })
                .eq('room_id', roomId);
            document.getElementById('roomMembersDisplay').textContent = `${count || 1} member${count === 1 ? '' : 's'}`;
        }

        function subscribeToRoom(roomId) {
            if (chatChannel) window.db.removeChannel(chatChannel);

            chatChannel = window.db
                .channel(`room-${roomId}`)
                .on('postgres_changes', {
                    event: 'INSERT', schema: 'public', table: 'music_room_messages', filter: `room_id=eq.${roomId}`
                }, (payload) => {
                    const msg = payload.new;
                    // Avoid double-render if we already optimistically rendered our own message
                    if (msg.user_id === currentUser.id && recentMessages.some(m => m.id === msg.id)) return;
                    recentMessages.push(msg);
                    renderMessage(msg);
                    scrollChatToBottom();
                })
                .on('postgres_changes', {
                    event: 'INSERT', schema: 'public', table: 'music_room_members', filter: `room_id=eq.${roomId}`
                }, () => {
                    loadMemberCount(roomId);
                })
                .subscribe();
        }

        function renderMessage(msg) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');

            if (msg.message_type === 'ai_generated') {
                div.className = 'msg ai-idea';
                let title = 'AI Music Idea';
                let content = msg.content;
                try {
                    const parsed = JSON.parse(msg.content);
                    title = parsed.title || title;
                    content = parsed.content || msg.content;
                } catch (e) { /* content wasn't JSON, show as-is */ }
                div.innerHTML = `
                    <div class="ai-idea-title">✨ ${escapeHtml(title)}</div>
                    <div class="ai-idea-content">${escapeHtml(content)}</div>
                `;
            } else {
                const isMine = msg.user_id === currentUser.id;
                div.className = `msg ${isMine ? 'mine' : 'theirs'}`;
                div.innerHTML = `
                    ${!isMine ? `<div class="msg-name">${escapeHtml(msg.display_name || 'Member')}</div>` : ''}
                    <div>${escapeHtml(msg.content)}</div>
                `;
            }
            container.appendChild(div);
        }

        function scrollChatToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        // ============================================
        // Sending chat messages
        // ============================================
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentRoom) return;
            input.value = '';

            const displayName = currentUser.email ? currentUser.email.split('@')[0] : 'Member';

            try {
                const { data, error } = await window.db
                    .from('music_room_messages')
                    .insert({
                        room_id: currentRoom.id,
                        user_id: currentUser.id,
                        display_name: displayName,
                        message_type: 'chat',
                        content: text,
                    })
                    .select()
                    .single();

                if (error) throw error;

                recentMessages.push(data);
                renderMessage(data);
                scrollChatToBottom();
            } catch (err) {
                console.error('Send message failed:', err);
                alert('Could not send message.');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        // ============================================
        // AI idea generation
        // ============================================
        async function generateIdea() {
            if (!currentRoom) return;
            const btn = document.getElementById('generateIdeaBtn');
            const type = document.getElementById('ideaTypeSelect').value;

            const chatOnly = recentMessages.filter(m => m.message_type !== 'ai_generated');
            if (chatOnly.length === 0) {
                alert('Chat a bit first so the AI has something to work with!');
                return;
            }

            btn.disabled = true;
            btn.textContent = '✨ Thinking…';

            try {
                const res = await fetch(MUSIC_MIXER_WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        recent_messages: chatOnly.slice(-20).map(m => ({ display_name: m.display_name, content: m.content })),
                        request_type: type,
                    }),
                });

                const data = await res.json();
                if (!res.ok || !data.idea) throw new Error(data.error || 'Could not generate idea');

                // Post the idea into the shared room feed so everyone sees it via Realtime
                const { data: inserted, error } = await window.db
                    .from('music_room_messages')
                    .insert({
                        room_id: currentRoom.id,
                        user_id: currentUser.id,
                        display_name: 'AI',
                        message_type: 'ai_generated',
                        content: JSON.stringify({ title: data.idea.title, content: data.idea.content }),
                    })
                    .select()
                    .single();

                if (error) throw error;

                recentMessages.push(inserted);
                renderMessage(inserted);
                scrollChatToBottom();
            } catch (err) {
                console.error('Generate idea failed:', err);
                alert(`Could not generate idea: ${err.message || err}`);
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ Generate';
            }
        }

        // ============================================
        // Navigation
        // ============================================
        function leaveOrBack() {
            if (chatChannel) window.db.removeChannel(chatChannel);
            if (currentRoom) {
                currentRoom = null;
                document.getElementById('roomSection').classList.remove('active');
                document.getElementById('landingSection').style.display = 'block';
            } else {
                history.back();
            }
        }
    </script>
</body>
</html>
