<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ddott TV — Player V2</title>
<style>
:root {
    --neon-cyan: #00f3ff;
    --neon-pink: #ff00ff;
    --neon-purple: #b300ff;
    --dark-bg: #0a0a0f;
    --card-bg: rgba(20, 20, 35, 0.85);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--dark-bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
}
.player-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
}
video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.loading-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    z-index: 10;
    transition: opacity 0.3s;
}
.loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}
.spinner {
    width: 60px;
    height: 60px;
    border: 3px solid rgba(0, 243, 255, 0.2);
    border-top-color: var(--neon-cyan);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
    color: var(--neon-cyan);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 1px;
}
.tap-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
    z-index: 9;
    cursor: pointer;
}
.tap-overlay.visible { display: flex; }
.tap-icon {
    width: 80px;
    height: 80px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.3);
}
.controls-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s;
}
.player-container:hover .controls-bar,
.player-container.touched .controls-bar {
    opacity: 1;
}
.ctrl-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    opacity: 0.9;
}
.ctrl-btn:active { opacity: 0.6; }
.time-display {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.9);
    min-width: 80px;
}
.progress-container {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
}
.progress-fill {
    height: 100%;
    background: var(--neon-cyan);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
}
.quality-badge {
    background: rgba(255,255,255,0.15);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
}
.info-section { padding: 16px; }
.video-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.3;
}
.video-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    margin-bottom: 16px;
}
.meta-dot { width: 3px; height: 3px; background: rgba(255,255,255,0.4); border-radius: 50%; }
.actions-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    overflow-x: auto;
    padding-bottom: 4px;
}
.action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
}
.action-btn:active { background: rgba(255,255,255,0.1); transform: scale(0.95); }
.action-btn.primary {
    background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
    border: none;
    font-weight: 600;
}
.coins-bar {
    background: linear-gradient(135deg, rgba(179, 0, 255, 0.2), rgba(255, 0, 255, 0.2));
    border: 1px solid rgba(179, 0, 255, 0.3);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}
.coins-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--neon-pink);
    font-weight: 700;
}
.coins-value {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.tip-btn {
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    border: none;
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
}
.creator-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: var(--card-bg);
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.08);
}
.creator-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}
.creator-info { flex: 1; }
.creator-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.creator-handle { font-size: 13px; color: rgba(255,255,255,0.5); }
.follow-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 6px 16px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}
.description {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(255,255,255,0.85);
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.hashtags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}
.hashtag { color: var(--neon-cyan); font-size: 14px; font-weight: 500; }
.show-more { color: rgba(255,255,255,0.5); font-size: 13px; cursor: pointer; margin-bottom: 20px; }
.section-header {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.comment-box {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.08);
}
.comment-input {
    width: 100%;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 14px;
    outline: none;
}
.comment-input::placeholder { color: rgba(255,255,255,0.4); }
.tabs-row {
    display: flex;
    gap: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 16px;
}
.tab {
    padding: 8px 0;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
}
.tab.active { color: #fff; border-bottom-color: var(--neon-cyan); }
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(10, 10, 15, 0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    z-index: 100;
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: rgba(255,255,255,0.5);
    font-size: 10px;
    text-decoration: none;
    padding: 4px 12px;
}
.nav-item.active { color: var(--neon-cyan); }
.nav-icon { font-size: 20px; }
.safe-bottom { height: 70px; }
.error-state {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.8);
    z-index: 11;
}
.error-state.visible { display: flex; }
.error-text { color: #ff4444; margin-bottom: 12px; font-size: 14px; }
.retry-btn {
    background: var(--neon-cyan);
    border: none;
    color: #000;
    padding: 8px 20px;
    border-radius: 20px;
    font-weight: 700;
    cursor: pointer;
}
</style>
<base target="_blank">
</head>
<body>

<div class="player-container" id="playerContainer">
    <video id="mainVideo" playsinline webkit-playsinline preload="metadata">
        Your browser does not support the video tag.
    </video>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Loading video...</div>
    </div>
    <div class="tap-overlay" id="tapOverlay">
        <div class="tap-icon">▶</div>
    </div>
    <div class="error-state" id="errorState">
        <div class="error-text" id="errorText">Video failed to load</div>
        <button class="retry-btn" onclick="loadVideo()">Retry</button>
    </div>
    <div class="controls-bar" id="controlsBar">
        <button class="ctrl-btn" id="playBtn">▶</button>
        <button class="ctrl-btn">⏮</button>
        <button class="ctrl-btn">⏭</button>
        <div class="progress-container" id="progressContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
        <button class="ctrl-btn">🔊</button>
        <span class="quality-badge">4K</span>
    </div>
</div>

<div class="info-section">
    <h1 class="video-title" id="videoTitle">—</h1>
    <div class="video-meta">
        <span id="viewCount">—</span>
        <span class="meta-dot"></span>
        <span id="uploadTime">—</span>
        <span class="meta-dot"></span>
        <span id="videoDuration">0:00</span>
    </div>
    <div class="actions-row">
        <button class="action-btn primary" id="likeBtn" onclick="toggleLike()">👍 <span id="likeCount">—</span></button>
        <button class="action-btn">👎</button>
        <button class="action-btn" onclick="shareVideo()">↗ Share</button>
        <button class="action-btn">+ Save</button>
        <button class="action-btn">✂ Clip</button>
    </div>
    <div class="coins-bar">
        <div>
            <div class="coins-label">EMO COINS</div>
            <div class="coins-value" id="emoCoins">🪙 —</div>
        </div>
        <button class="tip-btn" onclick="tipCreator()">TIP CREATOR</button>
    </div>
    <div class="creator-card">
        <div class="creator-avatar" id="creatorAvatar">🦋</div>
        <div class="creator-info">
            <div class="creator-name" id="creatorName">—</div>
            <div class="creator-handle" id="creatorHandle">—</div>
        </div>
        <button class="follow-btn" id="followBtn" onclick="toggleFollow()">FOLLOW</button>
    </div>
    <div class="description" id="videoDescription">—</div>
    <div class="hashtags" id="hashtags"></div>
    <div class="show-more" onclick="toggleDescription()" id="showMoreBtn">▼ Show more</div>
    <div class="section-header">💬 Comments (<span id="commentCount">—</span>)</div>
    <div class="comment-box">
        <input type="text" class="comment-input" id="commentInput" placeholder="Add a comment..." onkeypress="if(event.key==='Enter') postComment()">
    </div>
    <div class="tabs-row">
        <div class="tab active" onclick="switchTab(this, 'upnext')">📺 Up Next</div>
        <div class="tab" onclick="switchTab(this, 'livechat')">⚡ Live Chat</div>
    </div>
    <div id="upnextPanel"></div>
    <div id="livechatPanel" style="display:none"></div>
</div>

<div class="safe-bottom"></div>

<<nav class="bottom-nav">
    <a href="ddott-home.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>HOME</span>
    </a>

    </a>

        <span class="nav-icon">🌐</span>
        <span>COMMUNITY</span>
    </a>

        <span class="nav-icon">🪙</span>
        <span>COINS</span>
    </a>

        <span class="nav-icon">🎬</span>
        <span>STUDIO</span>
    </a>
</nav>

<script>
const FALLBACK_VIDEO = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
const video = document.getElementById('mainVideo');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');
const tapOverlay = document.getElementById('tapOverlay');
const errorState = document.getElementById('errorState');
const errorText = document.getElementById('errorText');
const playBtn = document.getElementById('playBtn');
const progressFill = document.getElementById('progressFill');
const progressContainer = document.getElementById('progressContainer');
const timeDisplay = document.getElementById('timeDisplay');
const playerContainer = document.getElementById('playerContainer');

let isPlaying = false;
let currentVideoUrl = '';
let currentVideoId = null;
let isLiked = false;
let isFollowing = false;
let descExpanded = false;

// ===== URL PARSER =====
function getVideoUrl() {
    const params = new URLSearchParams(window.location.search);
    const directUrl = params.get('url');
    if (directUrl && directUrl.trim() !== '' && directUrl !== 'undefined' && directUrl !== 'null') {
        try { return decodeURIComponent(directUrl); } catch(e) { return directUrl; }
    }
    const videoId = params.get('id') || params.get('v');
    if (videoId) {
        currentVideoId = videoId;
        return null;
    }
    return FALLBACK_VIDEO;
}

// ===== LOAD VIDEO =====
function loadVideo() {
    errorState.classList.remove('visible');
    loadingOverlay.classList.remove('hidden');
    loadingText.textContent = 'Loading video...';

    const url = getVideoUrl();
    if (url) {
        currentVideoUrl = url;
        setVideoSource(url);
    } else if (currentVideoId) {
        loadVideoFromDB(currentVideoId);
    } else {
        currentVideoUrl = FALLBACK_VIDEO;
        setVideoSource(FALLBACK_VIDEO);
    }
}

function setVideoSource(url) {
    video.pause();
    video.removeAttribute('src');
    video.load();
    video.src = url;
    video.load();
    attemptPlay();
}

// ===== DB LOADER (Supabase) =====
async function loadVideoFromDB(id) {
    try {
        const { data, error } = await db.from('videos')
            .select('*, profiles:user_id(username, display_name, avatar_url, is_creator, subscriber_count)')
            .eq('id', id)
            .single();

        if (error || !data) {
            console.error('DB load failed:', error);
            setVideoSource(FALLBACK_VIDEO);
            return;
        }

        currentVideoUrl = data.video_url || FALLBACK_VIDEO;
        setVideoSource(currentVideoUrl);

        document.getElementById('videoTitle').textContent = data.title || 'Untitled';
        document.getElementById('viewCount').textContent = formatNumber(data.views) + ' views';
        document.getElementById('uploadTime').textContent = timeAgo(data.created_at);
        document.getElementById('likeCount').textContent = formatNumber(data.likes);
        document.getElementById('videoDescription').textContent = data.description || '';
        document.getElementById('commentCount').textContent = formatNumber(data.comments_count);

        const creator = data.profiles || {};
        document.getElementById('creatorName').textContent = creator.display_name || creator.username || 'Creator';
        document.getElementById('creatorHandle').textContent = `@${creator.username || 'unknown'} · ${formatNumber(creator.subscriber_count)} subscribers`;
        if (creator.avatar_url) {
            document.getElementById('creatorAvatar').style.backgroundImage = `url(${creator.avatar_url})`;
            document.getElementById('creatorAvatar').textContent = '';
        }

        if (data.category) {
            document.getElementById('hashtags').innerHTML = `<span class="hashtag">#${escapeHtml(data.category)}</span>`;
        }

        loadComments(id);
    } catch (err) {
        console.error('loadVideoFromDB error:', err);
        setVideoSource(FALLBACK_VIDEO);
    }
}

// ===== PLAYBACK =====
async function attemptPlay() {
    try {
        await video.play();
        isPlaying = true;
        playBtn.textContent = '⏸';
        tapOverlay.classList.remove('visible');
    } catch (err) {
        console.log('Autoplay blocked:', err.name);
        isPlaying = false;
        playBtn.textContent = '▶';
        if (err.name === 'NotAllowedError') {
            tapOverlay.classList.add('visible');
        }
    }
}

// ===== EVENT LISTENERS =====
video.addEventListener('loadeddata', () => {
    loadingOverlay.classList.add('hidden');
    errorState.classList.remove('visible');
    document.getElementById('videoDuration').textContent = formatTime(video.duration || 0);
    updateTimeDisplay();
});

video.addEventListener('error', () => {
    loadingOverlay.classList.add('hidden');
    errorText.textContent = video.error ? `Error ${video.error.code}` : 'Video failed';
    errorState.classList.add('visible');
    if (currentVideoUrl !== FALLBACK_VIDEO) {
        setTimeout(() => { setVideoSource(FALLBACK_VIDEO); }, 1500);
    }
});

video.addEventListener('timeupdate', () => {
    updateTimeDisplay();
    updateProgress();
});

video.addEventListener('ended', () => {
    isPlaying = false;
    playBtn.textContent = '▶';
});

playBtn.addEventListener('click', () => {
    if (video.paused) { video.play(); isPlaying = true; playBtn.textContent = '⏸'; tapOverlay.classList.remove('visible'); }
    else { video.pause(); isPlaying = false; playBtn.textContent = '▶'; }
});

tapOverlay.addEventListener('click', () => {
    video.play(); isPlaying = true; playBtn.textContent = '⏸'; tapOverlay.classList.remove('visible');
});

playerContainer.addEventListener('click', (e) => {
    if (e.target === playerContainer || e.target === video || e.target === tapOverlay) {
        playerContainer.classList.toggle('touched');
    }
});

progressContainer.addEventListener('click', (e) => {
    const rect = progressContainer.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    video.currentTime = pos * video.duration;
});

// ===== HELPERS =====
function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function updateTimeDisplay() {
    timeDisplay.textContent = `${formatTime(video.currentTime || 0)} / ${formatTime(video.duration || 0)}`;
}

function updateProgress() {
    if (video.duration) progressFill.style.width = (video.currentTime / video.duration * 100) + '%';
}

function formatNumber(n) {
    if (!n) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return n.toString();
}

function timeAgo(dateStr) {
    if (!dateStr) return 'recently';
    const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return new Date(dateStr).toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== ACTIONS =====
function toggleLike() {
    isLiked = !isLiked;
    const btn = document.getElementById('likeBtn');
    if (isLiked) {
        btn.style.background = 'linear-gradient(135deg, #ff6b35, #ff00ff)';
    } else {
        btn.style.background = '';
    }
}

function toggleFollow() {
    isFollowing = !isFollowing;
    const btn = document.getElementById('followBtn');
    btn.textContent = isFollowing ? '✓ FOLLOWING' : 'FOLLOW';
    btn.style.background = isFollowing ? 'rgba(0,243,255,0.2)' : '';
    btn.style.borderColor = isFollowing ? '#00f3ff' : '';
}

function toggleDescription() {
    descExpanded = !descExpanded;
    const desc = document.getElementById('videoDescription');
    const btn = document.getElementById('showMoreBtn');
    if (descExpanded) {
        desc.style.webkitLineClamp = 'unset';
        desc.style.display = 'block';
        btn.textContent = '▲ Show less';
    } else {
        desc.style.webkitLineClamp = '3';
        desc.style.display = '-webkit-box';
        btn.textContent = '▼ Show more';
    }
}

function shareVideo() {
    const url = window.location.href;
    const title = document.getElementById('videoTitle').textContent;
    if (navigator.share) {
        navigator.share({ title: title, url: url });
    } else {
        navigator.clipboard.writeText(url);
        alert('Link copied to clipboard!');
    }
}

function tipCreator() {
    alert('Tip feature coming soon! Connect your Web3 wallet.');
}

function postComment() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    console.log('Comment:', text);
}

async function loadComments(videoId) {
    console.log('Loading comments for:', videoId);
}

function switchTab(el, panel) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('upnextPanel').style.display = panel === 'upnext' ? 'block' : 'none';
    document.getElementById('livechatPanel').style.display = panel === 'livechat' ? 'block' : 'none';
}

// ===== URL PARAMS TO UI =====
function populateFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title');
    if (title) document.getElementById('videoTitle').textContent = decodeURIComponent(title);
    const creator = params.get('creator');
    if (creator) document.getElementById('creatorName').textContent = decodeURIComponent(creator);
    const desc = params.get('desc');
    if (desc) document.getElementById('videoDescription').textContent = decodeURIComponent(desc);
    const views = params.get('views');
    if (views) document.getElementById('viewCount').textContent = views + ' views';
    const likes = params.get('likes');
    if (likes) document.getElementById('likeCount').textContent = likes;
}

  // ============================
  // SMART LOAD (Fixed - no double overlays)

  async function smartLoad() {
    console.log('DEBUG videoUrl:', videoUrl);
    console.log('DEBUG videoId:', videoId);
    console.log('DEBUG search:', window.location.search);
    console.log('DEBUG href:', window.location.href);
    
    // Create single tap overlay
    createTapOverlay();
    
    // Setup retry button
    retryBtn.addEventListener('click', () => {
      showStatus('loading', 'Retrying...', false);
      initVideo();
    });
    
    // Load video
    await initVideo();
    
    // Load comments and likes
    loadComments();
    loadLikes();
  }

  // ============================
  // INIT
  // ============================
  window.db = db;
  
  document.addEventListener('DOMContentLoaded', () => {
    if (!dbReady) {
      let attempts = 0;
      const waitForDB = setInterval(() => {
        attempts++;
        initSupabase();
        if (dbReady || attempts > 20) {
          clearInterval(waitForDB);
          smartLoad();
        }
      }, 100);
    } else {
      smartLoad();
    }
  });
</script>
