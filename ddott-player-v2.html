<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ddott TV — Player V2</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f5ff;
    --purple: #b400ff;
    --pink: #ff00c8;
    --dark: #04000f;
    --darker: #020008;
    --surface: #0a0020;
    --surface2: #110030;
    --text: #e8d5ff;
    --muted: #6b4d8a;
    --glow-cyan: 0 0 20px #00f5ff88, 0 0 40px #00f5ff44;
    --glow-purple: 0 0 20px #b400ff88, 0 0 40px #b400ff44;
    --glow-pink: 0 0 20px #ff00c888, 0 0 40px #ff00c844;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--darker);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    animation: gridShift 20s linear infinite;
  }
  @keyframes gridShift {
    0% { transform: translateY(0); }
    100% { transform: translateY(40px); }
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(180,0,255,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0,245,255,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(4,0,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0,245,255,0.15);
  }
  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 900;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .logo span { color: var(--pink); -webkit-text-fill-color: var(--pink); }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface2); border: 1px solid rgba(0,245,255,0.2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; transition: all 0.3s;
  }
  .nav-icon:hover { border-color: var(--cyan); box-shadow: var(--glow-cyan); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; cursor: pointer;
    border: 2px solid var(--cyan); box-shadow: var(--glow-cyan);
  }
  .main {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: 20px 16px 40px;
  }
  .video-container {
    position: relative; width: 100%;
    border-radius: 16px; overflow: hidden;
    background: #000;
    border: 1px solid rgba(0,245,255,0.2);
    box-shadow: 0 0 60px rgba(0,245,255,0.1), 0 0 120px rgba(180,0,255,0.08);
    margin-bottom: 20px;
  }
  .video-wrap {
    position: relative;
    padding-top: 56.25%;
    background: linear-gradient(135deg, #000510, #0a0020);
  }
  #realVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    background: #000;
    object-fit: contain;
  }
  .video-placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: linear-gradient(135deg, #000510 0%, #080020 50%, #000510 100%);
  }
  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px 14px;
    background: linear-gradient(transparent, rgba(4,0,15,0.95));
    z-index: 10;
  }
  .progress-wrap {
    position: relative; height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px; margin-bottom: 10px;
    cursor: pointer; overflow: visible;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    border-radius: 4px; box-shadow: var(--glow-cyan);
    position: relative; transition: width 0.1s;
  }
  .progress-thumb {
    position: absolute; right: -6px; top: 50%;
    transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--cyan); box-shadow: var(--glow-cyan);
    transition: transform 0.2s;
  }
  .progress-wrap:hover .progress-thumb { transform: translateY(-50%) scale(1.4); }
  .chapter-dot {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--purple); box-shadow: var(--glow-purple); cursor: pointer;
  }
  .ctrl-row { display: flex; align-items: center; gap: 12px; }
  .ctrl-btn {
    background: none; border: none; color: var(--text);
    cursor: pointer; font-size: 18px; padding: 4px;
    line-height: 1; transition: all 0.2s;
    display: flex; align-items: center;
  }
  .ctrl-btn:hover { color: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
  .time {
    font-family: 'Orbitron', monospace; font-size: 11px;
    color: var(--muted); letter-spacing: 1px; white-space: nowrap;
  }
  .time span { color: var(--cyan); }
  .vol-wrap { display: flex; align-items: center; gap: 8px; }
  .vol-slider {
    width: 70px; height: 3px;
    background: rgba(255,255,255,0.1); border-radius: 3px;
    position: relative; cursor: pointer;
  }
  .vol-fill { height: 100%; width: 75%; background: linear-gradient(90deg, var(--purple), var(--cyan)); border-radius: 3px; }
  .ctrl-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 10px;
  }
  .quality-badge {
    font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700;
    padding: 3px 7px; border-radius: 4px;
    border: 1px solid var(--cyan); color: var(--cyan);
    letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
  }
  .quality-badge:hover {
    background: var(--cyan); color: var(--dark); box-shadow: var(--glow-cyan);
  }
  .info-section {
    display: grid; grid-template-columns: 1fr auto;
    gap: 16px; align-items: start; margin-bottom: 20px;
  }
  .video-info h1 {
    font-family: 'Orbitron', monospace; font-size: 18px;
    font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.3;
  }
  .video-meta {
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .meta-chip { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .meta-chip.hot { color: var(--pink); }
  .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .act-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid rgba(0,245,255,0.2);
    background: var(--surface); color: var(--text);
    font-family: 'Rajdhani', sans-serif; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .act-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: var(--glow-cyan); }
  .act-btn.primary {
    background: linear-gradient(135deg, rgba(0,245,255,0.15), rgba(180,0,255,0.15));
    border-color: var(--purple); color: var(--cyan);
  }
  .act-btn.primary:hover {
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    color: var(--dark); border-color: transparent;
  }
  .emo-tip {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px; background: var(--surface); border-radius: 12px;
    border: 1px solid rgba(180,0,255,0.3); min-width: 120px;
  }
  .emo-coins-label {
    font-family: 'Orbitron', monospace; font-size: 9px;
    color: var(--purple); letter-spacing: 2px;
  }
  .emo-coin-val {
    font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 900;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tip-btn {
    padding: 6px 14px; border-radius: 6px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border: none; color: #fff; font-family: 'Orbitron', monospace;
    font-size: 9px; letter-spacing: 1px; cursor: pointer;
    box-shadow: var(--glow-purple); transition: all 0.2s; font-weight: 700;
  }
  .tip-btn:hover { transform: scale(1.05); }
  @media (max-width: 640px) {
    .info-section { grid-template-columns: 1fr; }
    .emo-tip { flex-direction: row; min-width: unset; width: 100%; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<nav style="display:none">
  <div class="logo">DDOTT<span>.</span>TV</div>
  <div class="nav-right">
    <div class="nav-icon">🔍</div>
    <div class="nav-icon">🔔</div>
    <div class="avatar">D</div>
  </div>
</nav>

<div class="main">

  <!-- VIDEO PLAYER -->
  <div class="video-container">
    <div class="video-wrap">
      <video id="realVideo" preload="metadata" playsinline controlsList="nodownload" crossorigin="anonymous">
        <source src="" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill">
          <div class="progress-thumb"></div>
        </div>
        <div class="chapter-dot" style="left:25%"></div>
        <div class="chapter-dot" style="left:60%"></div>
        <div class="chapter-dot" style="left:82%"></div>
      </div>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="playPauseBtn" title="Play/Pause">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="skipBackBtn" title="Skip -10s">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="ctrl-btn" id="skipFwdBtn" title="Skip +10s">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
        </button>
        <div class="vol-wrap">
          <button class="ctrl-btn" id="muteBtn">🔊</button>
          <div class="vol-slider" id="volSlider"><div class="vol-fill" id="volFill"></div></div>
        </div>
        <div class="time"><span id="currentTime">0:00</span> / <span id="totalTime">0:00</span></div>
        <div class="ctrl-right">
          <div class="quality-badge" id="qualityBtn">4K</div>
          <button class="ctrl-btn" title="Picture in Picture" id="pipBtn">⧉</button>
          <button class="ctrl-btn" title="Fullscreen" id="fsBtn">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- VIDEO INFO -->
  <div class="info-section">
    <div class="video-info">
      <h1 id="videoTitle">Video Title</h1>
      <div class="video-meta">
        <div class="meta-chip" id="viewCount">👁 0 views</div>
        <div class="meta-chip">📅 2 hours ago</div>
        <div class="meta-chip" id="durationBadge">⏱ 0:00</div>
      </div>
      <div class="action-btns">
        <button class="act-btn primary" id="likeBtn">👍 <span id="likeCount">0</span></button>
        <button class="act-btn">👎</button>
        <button class="act-btn">↗ Share</button>
        <button class="act-btn">+ Save</button>
      </div>
    </div>
    <div class="emo-tip">
      <div class="emo-coins-label">EMO COINS</div>
      <div class="emo-coin-val">🪙 450</div>
      <button class="tip-btn">TIP CREATOR</button>
    </div>
  </div>

</div>

<script>
  // ============================
  // VIDEO PLAYER LOGIC
  // ============================
  const video = document.getElementById('realVideo');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const skipBackBtn = document.getElementById('skipBackBtn');
  const skipFwdBtn = document.getElementById('skipFwdBtn');
  const muteBtn = document.getElementById('muteBtn');
  const volSlider = document.getElementById('volSlider');
  const volFill = document.getElementById('volFill');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const currentTimeEl = document.getElementById('currentTime');
  const totalTimeEl = document.getElementById('totalTime');
  const durationBadge = document.getElementById('durationBadge');
  const qualityBtn = document.getElementById('qualityBtn');
  const fsBtn = document.getElementById('fsBtn');
  const pipBtn = document.getElementById('pipBtn');

  const urlParams = new URLSearchParams(window.location.search);
  const videoUrl = urlParams.get('url') || '';
  const videoId = urlParams.get('id') || '';
  const videoTitle = urlParams.get('title') || 'Ddott TV Video';

  const titleEl = document.getElementById('videoTitle');
  if (titleEl) titleEl.textContent = videoTitle;

  console.log('[DDOTT-TV-PLAYER] Initialized');
  console.log('[DDOTT-TV-PLAYER] Video URL:', videoUrl);
  console.log('[DDOTT-TV-PLAYER] Video ID:', videoId);

  function setVideoSource(src) {
    if (!src) {
      console.warn('[DDOTT-TV-PLAYER] No video source provided');
      return;
    }
    
    console.log('[DDOTT-TV-PLAYER] Setting video source:', src);
    
    // Find the source element
    let sourceElement = video.querySelector('source[type="video/mp4"]');
    
    if (!sourceElement) {
      console.log('[DDOTT-TV-PLAYER] Creating new source element');
      sourceElement = document.createElement('source');
      sourceElement.type = 'video/mp4';
      video.appendChild(sourceElement);
    }
    
    // Set the source URL
    sourceElement.src = src;
    console.log('[DDOTT-TV-PLAYER] Source element set:', src);
    
    // Reset and load video
    video.load();
    console.log('[DDOTT-TV-PLAYER] Video.load() called');
    
    // Mute for autoplay
    video.muted = true;
    
    // Try to autoplay
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        console.log('[DDOTT-TV-PLAYER] Autoplay succeeded, unmuting');
        video.muted = false;
      }).catch(e => {
        console.warn('[DDOTT-TV-PLAYER] Autoplay blocked:', e.message);
      });
    }
  }

  // Add event listeners
  video.addEventListener('error', (e) => {
    console.error('[DDOTT-TV-PLAYER] Video error:', e.target.error?.message);
  });

  video.addEventListener('loadstart', () => {
    console.log('[DDOTT-TV-PLAYER] Video loadstart');
  });

  video.addEventListener('loadeddata', () => {
    console.log('[DDOTT-TV-PLAYER] Video loadeddata');
  });

  async function initVideo() {
    console.log('[DDOTT-TV-PLAYER] initVideo() called with ID:', videoId, 'URL:', videoUrl);
    
    if (videoId) {
      try {
        console.log('[DDOTT-TV-PLAYER] Fetching from DB with ID:', videoId);
        // Try to load from Supabase if available
        if (typeof db !== 'undefined' && db) {
          const { data: v, error } = await db.from('videos').select('*').eq('id', videoId).single();
          if (v && v.video_url) {
            console.log('[DDOTT-TV-PLAYER] Found video in DB:', v.video_url);
            setVideoSource(v.video_url);
            if (v.title) titleEl.textContent = v.title;
            return;
          }
        }
      } catch (e) {
        console.warn('[DDOTT-TV-PLAYER] DB video load failed:', e);
      }
    }
    
    if (videoUrl) {
      console.log('[DDOTT-TV-PLAYER] Loading video from URL param');
      setVideoSource(videoUrl);
    } else {
      console.warn('[DDOTT-TV-PLAYER] No video URL or ID provided');
    }
  }

  playPauseBtn.addEventListener('click', () => {
    if (video.paused) video.play(); else video.pause();
  });

  video.addEventListener('play', () => {
    playPauseBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  });
  video.addEventListener('pause', () => {
    playPauseBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  });

  skipBackBtn.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
  skipFwdBtn.addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); });

  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇' : '🔊';
  });

  volSlider.addEventListener('click', (e) => {
    const rect = volSlider.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    video.volume = pct / 100;
    volFill.style.width = pct + '%';
  });

  video.addEventListener('timeupdate', () => {
    if (!video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    progressFill.style.width = pct + '%';
    const m = Math.floor(video.currentTime / 60);
    const s = Math.floor(video.currentTime % 60);
    currentTimeEl.textContent = m + ':' + s.toString().padStart(2,'0');
  });

  video.addEventListener('loadedmetadata', () => {
    if (!video.duration) return;
    const m = Math.floor(video.duration / 60);
    const s = Math.floor(video.duration % 60);
    totalTimeEl.textContent = m + ':' + s.toString().padStart(2,'0');
    durationBadge.textContent = '⏱ ' + m + ':' + s.toString().padStart(2,'0');
    console.log('[DDOTT-TV-PLAYER] Video metadata loaded - duration:', m + ':' + s.toString().padStart(2,'0'));
  });

  progressWrap.addEventListener('click', (e) => {
    if (!video.duration) return;
    const rect = progressWrap.getBoundingClientRect();
    video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
  });

  fsBtn.addEventListener('click', () => {
    const container = document.querySelector('.video-container');
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (container.requestFullscreen) {
      container.requestFullscreen();
    } else if (video.requestFullscreen) {
      video.requestFullscreen();
    }
  });

  pipBtn.addEventListener('click', async () => {
    try {
      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
      } else {
        await video.requestPictureInPicture();
      }
    } catch (e) { console.warn('[DDOTT-TV-PLAYER] PiP not supported'); }
  });

  const qualities = ['4K', '1080p', '720p', '480p'];
  let qi = 0;
  qualityBtn.addEventListener('click', () => {
    qi = (qi + 1) % qualities.length;
    qualityBtn.textContent = qualities[qi];
  });

  // ============================
  // INITIALIZE ON PAGE LOAD
  // ============================
  window.addEventListener('DOMContentLoaded', () => {
    console.log('[DDOTT-TV-PLAYER] DOMContentLoaded fired, calling initVideo');
    initVideo();
  });

  // Also try immediately in case DOMContentLoaded already fired
  if (document.readyState === 'loading') {
    console.log('[DDOTT-TV-PLAYER] Document still loading');
  } else {
    console.log('[DDOTT-TV-PLAYER] Document already loaded, calling initVideo immediately');
    setTimeout(() => initVideo(), 100);
  }
</script>
</body>
</html>
