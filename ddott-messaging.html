<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - DDOTT.TV</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; }
.header { padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1a1a1a; }
.logo { font-size: 1rem; font-weight: bold; background: linear-gradient(90deg, #00f5ff, #bf00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.search-bar { margin: 12px 15px; background: #0d0d0d; border: 1px solid #222; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; color: #666; }
.search-bar input { background: none; border: none; outline: none; color: #fff; width: 100%; font-size: 0.95rem; }
.tabs { display: flex; padding: 0 15px; gap: 5px; margin-bottom: 5px; }
.tab { padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; color: #666; }
.tab.active { color: #00f5ff; border-bottom: 2px solid #00f5ff; }
.chat-list { padding: 0 15px; }
.chat-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #0d0d0d; cursor: pointer; }
.avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; flex-shrink: 0; position: relative; }
.online-dot { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; background: #00ff88; border-radius: 50%; border: 2px solid #000; }
.chat-info { flex: 1; min-width: 0; }
.chat-name { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
.creator-badge { background: #ff6b35; color: #fff; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; }
.chat-preview { color: #666; font-size: 0.82rem; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.chat-time { color: #555; font-size: 0.75rem; }
.unread-badge { background: #00f5ff; color: #000; font-size: 0.7rem; font-weight: bold; padding: 2px 7px; border-radius: 10px; }
.new-chat-btn { position: fixed; bottom: 90px; right: 20px; width: 52px; height: 52px; background: linear-gradient(135deg, #00f5ff, #bf00ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 20px rgba(0,245,255,0.3); }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a0a; border-top: 1px solid #1a1a1a; display: flex; padding: 10px 0; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #666; font-size: 0.65rem; cursor: pointer; text-decoration: none; }
.nav-item.active { color: #00f5ff; }
.nav-icon { font-size: 1.3rem; }

/* Chat Window */
.chat-window { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 100; flex-direction: column; }
.chat-window.open { display: flex; }
.chat-header { padding: 16px 20px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 12px; }
.back-btn { font-size: 1.3rem; cursor: pointer; color: #00f5ff; }
.chat-header-info { flex: 1; }
.chat-header-name { font-weight: bold; }
.chat-header-status { color: #00ff88; font-size: 0.75rem; }
.messages-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; }
.msg-bubble.sent { background: linear-gradient(135deg, #00f5ff22, #bf00ff22); border: 1px solid #00f5ff33; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg-bubble.received { background: #0d0d0d; border: 1px solid #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg-time { font-size: 0.7rem; color: #555; margin-top: 4px; }
.msg-input-bar { padding: 12px 15px; border-top: 1px solid #1a1a1a; display: flex; align-items: center; gap: 10px; }
.msg-input { flex: 1; background: #0d0d0d; border: 1px solid #222; border-radius: 24px; padding: 12px 18px; color: #fff; font-size: 0.9rem; outline: none; }
.send-btn { width: 44px; height: 44px; background: linear-gradient(135deg, #00f5ff, #bf00ff); border-radius: 50%; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.empty-state { text-align: center; padding: 40px 20px; color: #444; }
</style>
</head>
<body>

<div class="header">
  <span class="logo">DDOTT.TV</span>
  <span style="color:#fff; font-weight:bold; font-size:1.1rem;">Messages</span>
</div>

<div class="search-bar">
  <span>🔍</span>
  <input type="text" placeholder="Search messages..." id="searchInput" oninput="filterChats()">
</div>

<div class="tabs">
  <div class="tab active">All</div>
  <div class="tab">Creators</div>
  <div class="tab">Fans</div>
</div>

<div class="chat-list" id="chatList">
  <div class="empty-state">Loading conversations...</div>
</div>

<div class="new-chat-btn" onclick="showNewChat()">✏️</div>

<!-- Chat Window -->
<div class="chat-window" id="chatWindow">
  <div class="chat-header">
    <span class="back-btn" onclick="closeChat()">←</span>
    <div class="avatar" id="chatAvatar" style="background:#1a1a2e; width:36px; height:36px; font-size:0.9rem;"></div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="chatName"></div>
      <div class="chat-header-status">● Online</div>
    </div>
  </div>
  <div class="messages-container" id="messagesContainer"></div>
  <div class="msg-input-bar">
    <input class="msg-input" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="ddott-tv-app.html" class="nav-item"><span class="nav-icon">🏠</span>HOME</a>
  <a href="ddott-home-v2.html" class="nav-item"><span class="nav-icon">📺</span>FEED</a>
  <a href="ddott-messaging.html" class="nav-item active"><span class="nav-icon">💬</span>CHAT</a>
  <a href="ddott-emo-coins.html" class="nav-item"><span class="nav-icon">🪙</span>COINS</a>
  <a href="ddott-creator-studio.html" class="nav-item"><span class="nav-icon">🎬</span>STUDIO</a>
</div>

<script>
let currentUser = null
let currentChatUser = null
let realtimeChannel = null
let allChats = []

const COLORS = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffd93d','#6c5ce7','#fd79a8','#00b894']

function getColor(str) {
  let hash = 0
  for (let c of (str||'')) hash = c.charCodeAt(0) + ((hash << 5) - hash)
  return COLORS[Math.abs(hash) % COLORS.length]
}

async function init() {
  const { data: { user } } = await db.auth.getUser()
  if (!user) { window.location.href = 'ddott-login.html'; return }
  currentUser = user
  loadConversations()
}

async function loadConversations() {
  const { data } = await db.from('messages')
    .select('*')
    .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
    .order('created_at', { ascending: false })

  if (!data || data.length === 0) {
    document.getElementById('chatList').innerHTML = `
      <div class="empty-state">
        <div style="font-size:2rem; margin-bottom:10px;">💬</div>
        <div>No messages yet</div>
        <div style="font-size:0.8rem; margin-top:5px; color:#333;">Tap ✏️ to start a conversation</div>
      </div>`
    return
  }

  const seen = new Set()
  const convos = []
  for (const msg of data) {
    const otherId = msg.sender_id === currentUser.id ? msg.receiver_id : msg.sender_id
    if (!seen.has(otherId)) {
      seen.add(otherId)
      convos.push({ otherId, lastMsg: msg })
    }
  }

  allChats = convos
  renderChatList(convos)
}

async function renderChatList(convos) {
  const list = document.getElementById('chatList')
  if (convos.length === 0) {
    list.innerHTML = '<div class="empty-state">No conversations found</div>'
    return
  }

  const profileIds = convos.map(c => c.otherId)
  const { data: profiles } = await db.from('profiles').select('*').in('id', profileIds)
  const profileMap = {}
  for (const p of (profiles || [])) profileMap[p.id] = p

  list.innerHTML = convos.map(c => {
    const p = profileMap[c.otherId] || {}
    const name = p.username || 'User'
    const initial = name[0].toUpperCase()
    const color = getColor(name)
    const isSent = c.lastMsg.sender_id === currentUser.id
    const preview = (isSent ? 'You: ' : '') + (c.lastMsg.content || '').slice(0, 40)
    const time = new Date(c.lastMsg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    return `
      <div class="chat-item" onclick="openChat('${c.otherId}', '${name}')">
        <div class="avatar" style="background:${color}">
          ${initial}
          <div class="online-dot"></div>
        </div>
        <div class="chat-info">
          <div class="chat-name">@${name}</div>
          <div class="chat-preview">${preview}</div>
        </div>
        <div class="chat-meta">
          <div class="chat-time">${time}</div>
        </div>
      </div>`
  }).join('')
}

async function openChat(userId, username) {
  currentChatUser = { id: userId, username }
  document.getElementById('chatName').textContent = '@' + username
  document.getElementById('chatAvatar').textContent = username[0].toUpperCase()
  document.getElementById('chatAvatar').style.background = getColor(username)
  document.getElementById('chatWindow').classList.add('open')
  await loadMessages()
  subscribeRealtime()
}

function closeChat() {
  document.getElementById('chatWindow').classList.remove('open')
  if (realtimeChannel) { db.removeChannel(realtimeChannel); realtimeChannel = null }
  loadConversations()
}

async function loadMessages() {
  const container = document.getElementById('messagesContainer')
  container.innerHTML = '<div style="color:#444; text-align:center; padding:20px;">Loading...</div>'

  const { data } = await db.from('messages')
    .select('*')
    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`)
    .order('created_at', { ascending: true })

  renderMessages(data || [])
}

function renderMessages(msgs) {
  const container = document.getElementById('messagesContainer')
  if (msgs.length === 0) {
    container.innerHTML = '<div style="color:#444; text-align:center; padding:40px;">Say hello! 👋</div>'
    return
  }
  container.innerHTML = msgs.map(m => {
    const isSent = m.sender_id === currentUser.id
    const time = new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    return `
      <div>
        <div class="msg-bubble ${isSent ? 'sent' : 'received'}">${m.content}</div>
        <div class="msg-time" style="text-align:${isSent ? 'right' : 'left'}">${time}</div>
      </div>`
  }).join('')
  container.scrollTop = container.scrollHeight
}

async function sendMessage() {
  const input = document.getElementById('msgInput')
  const content = input.value.trim()
  if (!content || !currentChatUser) return
  input.value = ''

  await db.from('messages').insert({
    sender_id: currentUser.id,
    receiver_id: currentChatUser.id,
    content
  })
  await loadMessages()
}

function subscribeRealtime() {
  if (realtimeChannel) db.removeChannel(realtimeChannel)
  realtimeChannel = db.channel('messages-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
      loadMessages()
    })
    .subscribe()
}

function filterChats() {
  const q = document.getElementById('searchInput').value.toLowerCase()
  if (!q) { renderChatList(allChats); return }
  const filtered = allChats.filter(c => c.otherId.toLowerCase().includes(q))
  renderChatList(filtered)
}

async function showNewChat() {
  const username = prompt('Enter username to message:')
  if (!username) return
  const { data } = await db.from('profiles').select('*').eq('username', username).single()
  if (!data) { alert('User not found'); return }
  openChat(data.id, data.username)
}

init()
</script>
</body>
</html>
