<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ddott Shorts Player</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --accent-purple: #7c3aed;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --accent-gold: #fbbf24;
            --accent-red: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255,255,255,0.08);
            --gradient-like: linear-gradient(135deg, #7c3aed, #ec4899);
            --gradient-super: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
        }

        /* ===== APP CONTAINER ===== */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: linear-gradient(to bottom, rgba(10,10,15,0.9), transparent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #06b6d4, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .coin-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .coin-icon {
            width: 16px;
            height: 16px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #000;
        }

        .view-toggle {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-toggle:active { transform: scale(0.95); }

        /* ===== MODE INDICATOR ===== */
        .mode-indicator {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(124, 58, 237, 0.9);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
        }

        .mode-indicator.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== FULL SCROLL MODE ===== */
        .full-scroll-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .full-scroll-container::-webkit-scrollbar { display: none; }

        .short-item {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: start;
            position: relative;
            flex-shrink: 0;
            background: #000;
        }

        .short-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== SPLIT SCREEN MODE ===== */
        .split-container {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        .split-container.active { display: flex; }

        .split-player {
            height: 50%;
            position: relative;
            background: #000;
            border-bottom: 2px solid var(--accent-purple);
        }

        .split-player .short-video {
            position: absolute;
            top: 0;
            left: 0;
        }

        .split-grid {
            height: 50%;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg-secondary);
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            scroll-behavior: smooth;
        }

        .grid-item {
            aspect-ratio: 9/16;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .grid-item.active {
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
        }

        .grid-item img, .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-item .grid-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            font-size: 11px;
            font-weight: 600;
        }

        .grid-item .grid-views {
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--text-secondary);
            font-size: 10px;
            margin-top: 2px;
        }

        /* Swipe hint for split mode */
        .swipe-hint {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(124, 58, 237, 0.8);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: swipePulse 2s infinite;
            z-index: 10;
        }

        @keyframes swipePulse {
            0%, 100% { opacity: 0.6; transform: translateY(-50%) translateX(0); }
            50% { opacity: 1; transform: translateY(-50%) translateX(-5px); }
        }

        /* ===== OVERLAY UI ===== */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 80px 16px 100px;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 40%, rgba(0,0,0,0.3) 100%);
        }

        .video-info {
            max-width: 75%;
        }

        .video-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .author-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .author-name {
            font-weight: 600;
            font-size: 15px;
        }

        .video-title {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-stats {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== SIDE ACTIONS ===== */
        .side-actions {
            position: absolute;
            right: 12px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            pointer-events: auto;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            position: relative;
        }

        .action-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .action-btn:active .action-icon { transform: scale(0.9); }

        .action-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Like states */
        .like-btn .action-icon { transition: all 0.3s ease; }
        .like-btn.liked .action-icon {
            background: rgba(124, 58, 237, 0.3);
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
        }
        .like-btn.liked .action-label { color: var(--accent-purple); }

        .like-btn.heart-burst .action-icon {
            background: rgba(239, 68, 68, 0.3);
            border-color: var(--accent-red);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            animation: heartBurst 0.5s ease;
        }
        .like-btn.heart-burst .action-label { color: var(--accent-red); }

        .like-btn.super-liked .action-icon {
            background: rgba(251, 191, 36, 0.3);
            border-color: var(--accent-gold);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.6);
            animation: superLikePulse 0.6s ease;
        }
        .like-btn.super-liked .action-label { color: var(--accent-gold); }

        @keyframes heartBurst {
            0% { transform: scale(1); }
            30% { transform: scale(1.4); }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes superLikePulse {
            0% { transform: scale(1); }
            25% { transform: scale(1.5); }
            50% { transform: scale(0.8); }
            75% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* ===== ANIMATIONS ===== */
        .floating-heart {
            position: absolute;
            font-size: 40px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
            filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.6));
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-150px) scale(1.5); }
        }

        .haptic-ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid var(--accent-gold);
            pointer-events: none;
            z-index: 100;
            animation: hapticExpand 0.8s ease-out forwards;
        }

        @keyframes hapticExpand {
            0% { width: 40px; height: 40px; opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { width: 200px; height: 200px; opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .super-like-text {
            position: absolute;
            font-size: 18px;
            font-weight: 800;
            background: var(--gradient-super);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            pointer-events: none;
            z-index: 101;
            animation: superTextFloat 1.2s ease-out forwards;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
        }

        @keyframes superTextFloat {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            30% { transform: translateY(-30px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1); }
        }

        .coin-pop {
            position: absolute;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-gold);
            pointer-events: none;
            z-index: 101;
            animation: coinPop 1s ease-out forwards;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        @keyframes coinPop {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }

        /* Progress bar */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--accent-purple);
            transition: width 0.1s linear;
            z-index: 50;
            box-shadow: 0 0 10px var(--accent-purple);
        }

        /* Play/Pause indicator */
        .play-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 20;
            pointer-events: none;
        }

        .play-indicator.show { opacity: 1; }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 8px 12px;
        }

        .nav-item.active { color: var(--accent-purple); }
        .nav-item svg { width: 24px; height: 24px; }

        /* ===== LOADING / EMPTY STATES ===== */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(124, 58, 237, 0.2);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        body.embedded .bottom-nav { display: none !important; }
body.embedded .header { display: none !important; }

/* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .side-actions { right: 24px; bottom: 120px; }
            .video-overlay { padding: 80px 24px 120px; }
        }
    </style>

                likes: 95,
                comments: 18,
                thumbnail: "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=400&h=700&fit=crop",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"
            }
        ];

        // ===== STATE =====
        let currentMode = 'full'; // 'full' or 'split'
        let currentIndex = 0;
        let emoCoins = 1240;
        const likeStates = new Map(); // id -> { count, state: 'none'|'liked'|'heart'|'super' }
        let pressTimer = null;
        let isPressing = false;
        let lastTapTime = 0;
        let tapCount = 0;
        const SUPER_LIKE_HOLD_MS = 600;

        // ===== DOM REFS =====
        const fullContainer = document.getElementById('fullScrollContainer');
        const splitContainer = document.getElementById('splitContainer');
        const splitVideo = document.getElementById('splitVideo');
        const splitGrid = document.getElementById('splitGrid');
        const viewToggle = document.getElementById('viewToggle');
        const modeIndicator = document.getElementById('modeIndicator');
        const coinCount = document.getElementById('coinCount');
        const loadingScreen = document.getElementById('loadingScreen');

        // ===== INIT =====
        function init() {
    if (new URLSearchParams(location.search).get('embed') === 'true') document.body.classList.add('embedded');
            renderFullScrollShorts();
            renderSplitGrid();
            setupIntersectionObserver();
            setupViewToggle();

            // Hide loading after 1.5s
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 1500);
        }

        // ===== RENDER FULL SCROLL =====
        function renderFullScrollShorts() {
            fullContainer.innerHTML = shortsData.map((short, idx) => `
                <div class="short-item" data-index="${idx}" data-id="${short.id}">
                    <video class="short-video" src="${short.videoUrl}" loop playsinline muted preload="metadata"></video>
                    <div class="video-overlay">
                        <div class="video-info">
                            <div class="video-author">
                                <div class="author-avatar">${short.avatar}</div>
                                <span class="author-name">@${short.author}</span>
                            </div>
                            <div class="video-title">${short.title}</div>
                            <div class="video-stats">
                                <span>${short.views} views</span>
                                <span>•</span>
                                <span>${short.duration}</span>
                            </div>
                        </div>
                    </div>
                    <div class="side-actions">
                        <button class="action-btn like-btn" data-id="${short.id}">
                            <div class="action-icon">🤍</div>
                            <span class="action-label like-count">${short.likes}</span>
                        </button>
                        <button class="action-btn">
                            <div class="action-icon">💬</div>
                            <span class="action-label">${short.comments}</span>
                        </button>
                        <button class="action-btn">
                            <div class="action-icon">↗️</div>
                            <span class="action-label">Share</span>
                        </button>
                    </div>
                    <div class="progress-bar" style="width: 0%"></div>
                    <div class="play-indicator">▶️</div>
                </div>
            `).join('');

            // Attach gesture handlers to each short
            document.querySelectorAll('.short-item').forEach(item => {
                attachGestureHandlers(item);
            });
        }

        // ===== RENDER SPLIT GRID =====
        function renderSplitGrid() {
            splitGrid.innerHTML = shortsData.map((short, idx) => `
                <div class="grid-item ${idx === 0 ? 'active' : ''}" data-index="${idx}" onclick="playSplitShort(${idx})">
                    <img src="${short.thumbnail}" alt="${short.title}" loading="lazy">
                    <div class="grid-overlay">
                        <div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${short.title}</div>
                        <div class="grid-views">
                            <span>▶</span> ${short.views}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ===== GESTURE HANDLERS (DWIN LIKE SYSTEM) =====
        function attachGestureHandlers(element) {
            let pressStartTime = 0;
            let pressStartX = 0;
            let pressStartY = 0;
            let hasTriggeredSuper = false;
            let hasTriggeredHeart = false;

            const startHandler = (e) => {
    if (e.target.closest('.action-btn')) return;
                const touch = e.touches ? e.touches[0] : e;
                pressStartTime = Date.now();
                pressStartX = touch.clientX;
                pressStartY = touch.clientY;
                isPressing = true;
                hasTriggeredSuper = false;
                hasTriggeredHeart = false;

                pressTimer = setTimeout(() => {
                    if (isPressing && !hasTriggeredHeart) {
                        hasTriggeredSuper = true;
                        triggerSuperLike(element, pressStartX, pressStartY);
                    }
                }, SUPER_LIKE_HOLD_MS);
            };

            const endHandler = (e) => {
                const pressDuration = Date.now() - pressStartTime;
                isPressing = false;
                clearTimeout(pressTimer);

                if (hasTriggeredSuper) return; // Super like already handled

                const touch = e.changedTouches ? e.changedTouches[0] : e;
                const dx = Math.abs((touch.clientX || touch.pageX) - pressStartX);
                const dy = Math.abs((touch.clientY || touch.pageY) - pressStartY);

                // Ignore if dragged too much
                if (dx > 10 || dy > 10) return;

                if (pressDuration < SUPER_LIKE_HOLD_MS) {
                    handleTap(element, touch.clientX || touch.pageX, touch.clientY || touch.pageY);
                }
            };

            const moveHandler = (e) => {
                if (!isPressing) return;
                const touch = e.touches ? e.touches[0] : e;
                const dx = Math.abs(touch.clientX - pressStartX);
                const dy = Math.abs(touch.clientY - pressStartY);
                if (dx > 20 || dy > 20) {
                    isPressing = false;
                    clearTimeout(pressTimer);
                }
            };

            element.addEventListener('touchstart', startHandler, { passive: true });
            element.addEventListener('touchend', endHandler, { passive: true });
            element.addEventListener('touchmove', moveHandler, { passive: true });
            element.addEventListener('mousedown', startHandler);
            element.addEventListener('mouseup', endHandler);
            element.addEventListener('mousemove', moveHandler);
        }

        // ===== TAP LOGIC (Single vs Double) =====
        function handleTap(element, x, y) {
            const now = Date.now();
            const id = parseInt(element.dataset.id);
            const video = element.querySelector('video');

            if (now - lastTapTime < 300) {
                // Double tap detected
                tapCount++;
                if (tapCount === 2) {
                    triggerHeartBurst(element, id, x, y);
                    tapCount = 0;
                }
            } else {
                tapCount = 1;
                setTimeout(() => {
                    if (tapCount === 1) {
                        // Single tap - toggle like + play/pause
                        triggerSingleLike(element, id);
                        togglePlayPause(video, element.querySelector('.play-indicator'));
                    }
                    tapCount = 0;
                }, 300);
            }
            lastTapTime = now;
        }

        // ===== SINGLE LIKE (1 Coin) =====
        function triggerSingleLike(element, id) {
            const btn = element.querySelector('.like-btn');
            const countEl = btn.querySelector('.like-count');
            let state = likeStates.get(id) || { count: shortsData.find(s => s.id === id)?.likes || 0, state: 'none' };

            if (state.state === 'none') {
                state.count++;
                state.state = 'liked';
                btn.classList.add('liked');
                btn.querySelector('.action-icon').textContent = '💜';
                createFloatingHeart(element, '💜');
            } else if (state.state === 'liked') {
                state.count--;
                state.state = 'none';
                btn.classList.remove('liked');
                btn.querySelector('.action-icon').textContent = '🤍';
            } else {
                // Already heart/super - downgrade to liked
                state.state = 'liked';
                btn.classList.remove('heart-burst', 'super-liked');
                btn.classList.add('liked');
                btn.querySelector('.action-icon').textContent = '💜';
            }

            countEl.textContent = state.count;
            likeStates.set(id, state);
        }

        // ===== HEART BURST (2 Likes) =====
        function triggerHeartBurst(element, id, x, y) {
            const btn = element.querySelector('.like-btn');
            const countEl = btn.querySelector('.like-count');
            let state = likeStates.get(id) || { count: shortsData.find(s => s.id === id)?.likes || 0, state: 'none' };

            if (state.state !== 'heart') {
                state.count += 2;
                state.state = 'heart';
            }

            btn.classList.remove('liked', 'super-liked');
            btn.classList.add('heart-burst');
            btn.querySelector('.action-icon').textContent = '❤️';
            countEl.textContent = state.count;
            likeStates.set(id, state);

            // Multiple floating hearts
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createFloatingHeart(element, '❤️', x + (Math.random() - 0.5) * 60, y + (Math.random() - 0.5) * 60);
                }, i * 80);
            }

            // Remove animation class after
            setTimeout(() => btn.classList.remove('heart-burst'), 500);
        }

        // ===== SUPER LIKE (1 Emo Coin + Haptic Ring) =====
        function triggerSuperLike(element, x, y) {
            const id = parseInt(element.dataset.id);
            const btn = element.querySelector('.like-btn');
            const countEl = btn.querySelector('.like-count');
            let state = likeStates.get(id) || { count: shortsData.find(s => s.id === id)?.likes || 0, state: 'none' };

            if (state.state !== 'super') {
                state.count += 5;
                state.state = 'super';
            }

            btn.classList.remove('liked', 'heart-burst');
            btn.classList.add('super-liked');
            btn.querySelector('.action-icon').textContent = '💛';
            countEl.textContent = state.count;
            likeStates.set(id, state);

            // Haptic charge ring
            const ring = document.createElement('div');
            ring.className = 'haptic-ring';
            ring.style.left = x + 'px';
            ring.style.top = y + 'px';
            element.appendChild(ring);
            setTimeout(() => ring.remove(), 800);

            // Super like text
            const text = document.createElement('div');
            text.className = 'super-like-text';
            text.textContent = 'SUPER LIKE!';
            text.style.left = (x - 50) + 'px';
            text.style.top = (y - 50) + 'px';
            element.appendChild(text);
            setTimeout(() => text.remove(), 1200);

            // Coin pop
            const coin = document.createElement('div');
            coin.className = 'coin-pop';
            coin.innerHTML = '<span style="font-size:16px">🪙</span> +1 Emo Coin';
            coin.style.left = (x + 20) + 'px';
            coin.style.top = (y - 30) + 'px';
            element.appendChild(coin);
            setTimeout(() => coin.remove(), 1000);

            // Update coin balance
            emoCoins += 1;
            updateCoinDisplay();

            // Vibrate if supported
            if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 100]);

            setTimeout(() => btn.classList.remove('super-liked'), 600);
        }

        // ===== FLOATING HEART =====
        function createFloatingHeart(container, emoji, x, y) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = emoji;
            const rect = container.getBoundingClientRect();
            const posX = x ? (x - rect.left) : (rect.width / 2 + (Math.random() - 0.5) * 100);
            const posY = y ? (y - rect.top) : (rect.height / 2 + (Math.random() - 0.5) * 50);
            heart.style.left = posX + 'px';
            heart.style.top = posY + 'px';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        }

        // ===== PLAY / PAUSE =====
        function togglePlayPause(video, indicator) {
            if (video.paused) {
                video.play();
                //video.muted = false;
                indicator.textContent = '▶️';
                indicator.classList.remove('show');
            } else {
                video.pause();
                indicator.textContent = '⏸️';
                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 800);
            }
        }

        // ===== INTERSECTION OBSERVER (Auto-play) =====
        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const progressBar = entry.target.querySelector('.progress-bar');
                    if (entry.isIntersecting && entry.intersectionRatio >= 0.7) {
                        video.play();
                        //video.muted = false;
                        currentIndex = parseInt(entry.target.dataset.index);
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: [0.7] });

            document.querySelectorAll('.short-item').forEach(item => observer.observe(item));

            // Progress bar update
            setInterval(() => {
                document.querySelectorAll('.short-item').forEach(item => {
                    const video = item.querySelector('video');
                    const progress = item.querySelector('.progress-bar');
                    if (video && progress && !video.paused) {
                        const pct = (video.currentTime / video.duration) * 100;
                        progress.style.width = pct + '%';
                    }
                });
                // Split mode progress
                if (splitVideo && !splitVideo.paused) {
                    const pct = (splitVideo.currentTime / splitVideo.duration) * 100;
                    document.getElementById('splitProgress').style.width = pct + '%';
                }
            }, 100);
        }

        // ===== VIEW TOGGLE =====
        function setupViewToggle() {
            viewToggle.addEventListener('click', () => {
                if (currentMode === 'full') {
                    switchToSplitMode();
                } else {
                    switchToFullMode();
                }
            });
        }

        function switchToSplitMode() {
            currentMode = 'split';
            fullContainer.style.display = 'none';
            splitContainer.classList.add('active');
            modeIndicator.textContent = 'Split Screen Mode';
            showModeIndicator();

            // Pause all full-scroll videos
            document.querySelectorAll('.short-item video').forEach(v => v.pause());

            // Play current in split
            playSplitShort(currentIndex);
        }

        function switchToFullMode() {
            currentMode = 'full';
            fullContainer.style.display = 'block';
            splitContainer.classList.remove('active');
            modeIndicator.textContent = 'Full Scroll Mode';
            showModeIndicator();

            // Pause split video
            splitVideo.pause();

            // Resume current full-scroll video
            const items = document.querySelectorAll('.short-item');
            if (items[currentIndex]) {
                const video = items[currentIndex].querySelector('video');
                video.play();
                //video.muted = false;
                items[currentIndex].scrollIntoView({ behavior: 'instant', block: 'start' });
            }
        }

        function showModeIndicator() {
            modeIndicator.classList.add('show');
            setTimeout(() => modeIndicator.classList.remove('show'), 2000);
        }

        // ===== SPLIT MODE PLAY =====
        function playSplitShort(index) {
            currentIndex = index;
            const short = shortsData[index];

            splitVideo.src = short.videoUrl;
            splitVideo.play();
            splitVideo.muted = false;

            document.getElementById('splitAuthor').textContent = '@' + short.author;
            document.getElementById('splitAvatar').textContent = short.avatar;
            document.getElementById('splitTitle').textContent = short.title;
            document.getElementById('splitViews').textContent = short.views + ' views';
            document.getElementById('splitDuration').textContent = short.duration;

            // Update like button state
            const state = likeStates.get(short.id) || { count: short.likes, state: 'none' };
            const btn = document.getElementById('splitLikeBtn');
            const countEl = document.getElementById('splitLikeCount');
            countEl.textContent = state.count;
            btn.classList.remove('liked', 'heart-burst', 'super-liked');

            if (state.state === 'liked') {
                btn.classList.add('liked');
                btn.querySelector('.action-icon').textContent = '💜';
            } else if (state.state === 'heart') {
                btn.classList.add('heart-burst');
                btn.querySelector('.action-icon').textContent = '❤️';
            } else if (state.state === 'super') {
                btn.classList.add('super-liked');
                btn.querySelector('.action-icon').textContent = '💛';
            } else {
                btn.querySelector('.action-icon').textContent = '🤍';
            }

            // Highlight grid item
            document.querySelectorAll('.grid-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });

            // Attach gesture to split player
            attachGestureHandlers(document.getElementById('splitPlayer'));
        }

        // Split like button handler
        document.getElementById('splitLikeBtn').addEventListener('click', function() {
            const short = shortsData[currentIndex];
            const id = short.id;
            let state = likeStates.get(id) || { count: short.likes, state: 'none' };

            if (state.state === 'none') {
                state.count++;
                state.state = 'liked';
                this.classList.add('liked');
                this.querySelector('.action-icon').textContent = '💜';
            } else {
                state.count--;
                state.state = 'none';
                this.classList.remove('liked');
                this.querySelector('.action-icon').textContent = '🤍';
            }

            document.getElementById('splitLikeCount').textContent = state.count;
            likeStates.set(id, state);
        });

        // ===== COIN DISPLAY =====
        function updateCoinDisplay() {
            coinCount.textContent = emoCoins.toLocaleString();
        }

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                if (currentMode === 'full' && currentIndex < shortsData.length - 1) {
                    currentIndex++;
                    document.querySelectorAll('.short-item')[currentIndex]?.scrollIntoView({ behavior: 'smooth' });
                }
            } else if (e.key === 'ArrowUp') {
                if (currentMode === 'full' && currentIndex > 0) {
                    currentIndex--;
                    document.querySelectorAll('.short-item')[currentIndex]?.scrollIntoView({ behavior: 'smooth' });
                }
            } else if (e.key === 'v' || e.key === 'V') {
                viewToggle.click();
            }
        });

        // ===== SWIPE LEFT ON GRID (Load more simulation) =====
        let gridTouchStartX = 0;
        splitGrid.addEventListener('touchstart', (e) => {
            gridTouchStartX = e.touches[0].clientX;
        }, { passive: true });

        splitGrid.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - gridTouchStartX;
            if (dx < -50) {
                // Swipe left - simulate loading more
                const hint = document.querySelector('.swipe-hint');
                hint.textContent = '↻';
                hint.style.animation = 'none';
                setTimeout(() => {
                    hint.textContent = '←';
                    hint.style.animation = '';
                }, 1000);
            }
        }, { passive: true });

        // ===== START =====
        init();
    </script>
</body>
</html>
