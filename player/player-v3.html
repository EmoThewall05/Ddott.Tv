<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ddott TV - Split Player</title>
    <style>
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #0f0f1a;
            --bg-card: #16162a;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --accent-gold: #fbbf24;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255,255,255,0.06);
            --gradient-bar: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== TOP BAR (Browser style) ===== */
        .top-bar {
            height: 48px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-icon {
            width: 28px;
            height: 28px;
            color: var(--text-primary);
        }

        .url-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .url-bar .secure-icon {
            font-size: 12px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .top-bar-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
        }

        /* ===== HEADER ===== */
        .header {
            height: 56px;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
            max-width: 300px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 8px 16px;
            border-radius: 24px;
            color: var(--text-muted);
            font-size: 14px;
            width: 100%;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            position: relative;
        }

        .header-icon-btn.gold {
            background: rgba(251, 191, 36, 0.1);
            border-color: rgba(251, 191, 36, 0.3);
        }

        .header-icon-btn.notif::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: var(--accent-pink);
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
        }

        .avatar-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
        }

        /* ===== SUB HEADER ===== */
        .sub-header {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            flex-shrink: 0;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 18px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .coin-display {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .coin-display .coin-icon {
            width: 20px;
            height: 20px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000;
        }

        /* ===== MAIN VIDEO PLAYER (TOP) ===== */
        .main-player {
            position: relative;
            height: 55%;
            min-height: 320px;
            background: #000;
            flex-shrink: 0;
            overflow: hidden;
        }

        .main-player video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 30%, rgba(0,0,0,0.2) 100%);
        }

        /* Progress bar */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            pointer-events: auto;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-bar);
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.8);
        }

        .time-display {
            position: absolute;
            bottom: 10px;
            right: 50px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .mute-btn {
            position: absolute;
            bottom: 8px;
            right: 12px;
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            pointer-events: auto;
        }

        /* Video info overlay */
        .video-meta {
            margin-bottom: 8px;
        }

        .video-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .play-mini {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .video-title-main {
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .creator-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .creator-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .creator-badge {
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .view-count {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Side actions */
        .side-actions {
            position: absolute;
            right: 10px;
            bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
        }

        .action-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.3s ease;
        }

        .action-btn:active .action-circle { transform: scale(0.92); }

        .action-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Like states */
        .like-btn.liked .action-circle {
            background: rgba(139, 92, 246, 0.25);
            border-color: var(--accent-purple);
        }
        .like-btn.liked .action-label { color: var(--accent-purple); }

        .like-btn.heart-burst .action-circle {
            background: rgba(239, 68, 68, 0.25);
            border-color: #ef4444;
            animation: heartBurst 0.5s ease;
        }

        .like-btn.super-liked .action-circle {
            background: rgba(251, 191, 36, 0.25);
            border-color: var(--accent-gold);
            animation: superPulse 0.6s ease;
        }
        .like-btn.super-liked .action-label { color: var(--accent-gold); }

        @keyframes heartBurst {
            0% { transform: scale(1); }
            30% { transform: scale(1.35); }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes superPulse {
            0% { transform: scale(1); }
            25% { transform: scale(1.45); }
            50% { transform: scale(0.85); }
            75% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* ===== VIDEO SELECTOR (Route) ===== */
        .video-selector {
            position: absolute;
            top: 56px;
            left: 14px;
            z-index: 100;
            pointer-events: auto;
        }

        .selector-trigger {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            cursor: pointer;
        }

        .selector-dropdown {
            position: absolute;
            top: 40px;
            left: 0;
            width: 220px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 101;
            max-height: 300px;
            overflow-y: auto;
        }

        .selector-dropdown.open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .selector-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .selector-item:hover { background: rgba(255,255,255,0.05); }
        .selector-item.active { background: rgba(139, 92, 246, 0.15); }

        .selector-thumb {
            width: 48px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
            background: #333;
        }

        .selector-info {
            flex: 1;
            min-width: 0;
        }

        .selector-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selector-author {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===== SHORTS SECTION (BOTTOM) ===== */
        .shorts-section {
            flex: 1;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .shorts-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            flex-shrink: 0;
        }

        .shorts-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-purple);
        }

        .shorts-title .dot {
            width: 8px;
            height: 8px;
            background: var(--accent-pink);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .shorts-title .bolt {
            font-size: 16px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .shorts-count {
            font-size: 13px;
            color: var(--text-muted);
        }

        .shorts-grid {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            gap: 10px;
            padding: 0 14px 10px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .shorts-grid::-webkit-scrollbar { display: none; }

        .short-card {
            flex: 0 0 160px;
            height: 100%;
            max-height: 280px;
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            scroll-snap-align: start;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .short-card:hover { border-color: rgba(139, 92, 246, 0.3); }
        .short-card.active {
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .short-card .thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .short-card .short-video-inline {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 2;
        }

        .short-card.playing .short-video-inline { display: block; }
        .short-card.playing .thumb { opacity: 0; }

        /* Card overlays */
        .card-badge-new {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(139, 92, 246, 0.9);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 3;
        }

        .card-mute {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            background: rgba(239, 68, 68, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 3;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        .card-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 3;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
        }

        .card-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 3;
        }

        .card-action-row {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .card-action-row .icon { font-size: 14px; }

        .card-info {
            position: absolute;
            bottom: -40px;
            left: 0;
            right: 0;
            padding: 6px 0;
        }

        .card-username {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .card-desc {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Inline player overlay when short is playing */
        .inline-player-controls {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 4;
        }

        .short-card.playing .inline-player-controls { display: flex; }

        .inline-progress {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .inline-progress-fill {
            height: 100%;
            background: var(--gradient-bar);
            width: 0%;
        }

        .inline-time {
            font-size: 10px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            height: 64px;
            background: rgba(10, 10, 18, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 6px 10px;
        }

        .nav-item.active { color: var(--accent-purple); }
        .nav-item svg { width: 24px; height: 24px; }

        /* ===== ANIMATIONS ===== */
        .floating-heart {
            position: absolute;
            font-size: 36px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
            filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.5));
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.3); }
        }

        .haptic-ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid var(--accent-gold);
            pointer-events: none;
            z-index: 100;
            animation: ringExpand 0.8s ease-out forwards;
        }

        @keyframes ringExpand {
            0% { width: 30px; height: 30px; opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { width: 180px; height: 180px; opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .super-text {
            position: absolute;
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            pointer-events: none;
            z-index: 101;
            animation: superFloat 1.2s ease-out forwards;
        }

        @keyframes superFloat {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            30% { transform: translateY(-25px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-90px) scale(1); }
        }

        .coin-pop {
            position: absolute;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-gold);
            pointer-events: none;
            z-index: 101;
            animation: coinUp 1s ease-out forwards;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        @keyframes coinUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-70px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .short-card { flex: 0 0 200px; }
            .side-actions { right: 20px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div id="app">
        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="top-bar-left">
                <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <div class="url-bar">
                    <span class="secure-icon">🔒</span>
                    <span>ddott.live</span>
                </div>

        const shortsData = [

                thumb: 'https://images.unsplash.com/photo-1634017839464-5c339ez0c7a6?w=300&h=500&fit=crop',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'

                isNew: false,
                thumb: 'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=300&h=500&fit=crop',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4'
            },
            {
                id: 5,
                author: 'dwinofficial',
                avatar: 'D',
                title: 'DWIN Like System',
                views: '3.4K',
                likes: 156,
                comments: 28,
                isNew: false,
                thumb: 'https://images.unsplash.com/photo-1490750967868-88aa9f00c4f8?w=300&h=500&fit=crop',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4'
            }
        ];

        // ===== STATE =====
        let currentMainIndex = 0;
        let currentShortId = null;
        let emoCoins = 527;
        const mainLikeStates = new Map();
        const shortLikeStates = new Map();
        let pressTimer = null;
        let isPressing = false;
        let lastTapTime = 0;
        let tapCount = 0;
        const SUPER_LIKE_HOLD_MS = 600;

        // ===== DOM REFS =====
        const mainVideo = document.getElementById('mainVideo');
        const mainProgress = document.getElementById('mainProgress');
        const mainTime = document.getElementById('mainTime');
        const shortsGrid = document.getElementById('shortsGrid');
        const selectorDropdown = document.getElementById('selectorDropdown');

        // ===== INIT =====
        function init() {
            renderSelector();
            renderShorts();
            setupMainVideo();
            updateMainVideoUI();
            mainVideo.play();
        }

        // ===== MAIN VIDEO SETUP =====
        function setupMainVideo() {
            mainVideo.addEventListener('timeupdate', () => {
                const pct = (mainVideo.currentTime / mainVideo.duration) * 100;
                mainProgress.style.width = pct + '%';
                mainTime.textContent = formatTime(mainVideo.currentTime) + ' / ' + formatTime(mainVideo.duration || 0);
            });

            // Click to play/pause
            mainVideo.addEventListener('click', () => {
                if (mainVideo.paused) mainVideo.play();
                else mainVideo.pause();
            });

            // Progress bar seek
            document.getElementById('progressContainer').addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                mainVideo.currentTime = pct * mainVideo.duration;
            });
        }

        function formatTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        function toggleMainMute() {
            mainVideo.muted = !mainVideo.muted;
            document.getElementById('mainMute').textContent = mainVideo.muted ? '🔇' : '🔊';
        }

        // ===== VIDEO SELECTOR (ROUTE) =====
        function renderSelector() {
            selectorDropdown.innerHTML = mainVideos.map((v, i) => `
                <div class="selector-item ${i === currentMainIndex ? 'active' : ''}" onclick="selectMainVideo(${i})">
                    <img class="selector-thumb" src="${v.thumb}" alt="">
                    <div class="selector-info">
                        <div class="selector-title">${v.title}</div>
                        <div class="selector-author">@${v.creator}</div>
                    </div>
                </div>
            `).join('');
        }

        function toggleSelector() {
            selectorDropdown.classList.toggle('open');
        }

        function selectMainVideo(index) {
            currentMainIndex = index;
            const v = mainVideos[index];
            mainVideo.src = v.url;
            mainVideo.play();
            updateMainVideoUI();
            renderSelector();
            toggleSelector();
        }

        function updateMainVideoUI() {
            const v = mainVideos[currentMainIndex];
            document.getElementById('mainTitle').textContent = v.title;
            document.getElementById('mainCreator').textContent = v.creator;
            document.getElementById('mainAvatar').textContent = v.avatar;
            document.getElementById('mainViews').textContent = v.views + ' views';

            const state = mainLikeStates.get(v.id) || { count: v.likes, state: 'none' };
            document.getElementById('mainLikeCount').textContent = state.count;
            const btn = document.getElementById('mainLikeBtn');
            const icon = document.getElementById('mainLikeIcon');
            btn.classList.remove('liked', 'heart-burst', 'super-liked');

            if (state.state === 'liked') { btn.classList.add('liked'); icon.textContent = '💜'; }
            else if (state.state === 'heart') { btn.classList.add('heart-burst'); icon.textContent = '❤️'; }
            else if (state.state === 'super') { btn.classList.add('super-liked'); icon.textContent = '💛'; }
            else { icon.textContent = '🤍'; }
        }

        // ===== MAIN LIKE (DWIN SYSTEM) =====
        function handleMainLike() {
            const id = mainVideos[currentMainIndex].id;
            let state = mainLikeStates.get(id) || { count: mainVideos[currentMainIndex].likes, state: 'none' };

            if (state.state === 'none') {
                state.count++;
                state.state = 'liked';
            } else {
                state.count--;
                state.state = 'none';
            }
            mainLikeStates.set(id, state);
            updateMainVideoUI();
            createFloatingHeart(document.getElementById('mainPlayer'), state.state === 'liked' ? '💜' : '🤍');
        }

        // ===== SHORTS RENDER =====
        function renderShorts() {
            document.getElementById('shortsCount').textContent = shortsData.length + ' shorts';
            shortsGrid.innerHTML = shortsData.map(short => `
                <div class="short-card" data-id="${short.id}" id="short-${short.id}">
                    <img class="thumb" src="${short.thumb}" alt="${short.title}">
                    <video class="short-video-inline" loop playsinline muted preload="metadata"></video>

                    ${short.isNew ? '<div class="card-badge-new">NEW</div>' : ''}
                    <button class="card-mute" onclick="toggleShortMute(event, ${short.id})">🔇</button>
                    <button class="card-play" onclick="playShort(event, ${short.id})">▶</button>

                    <div class="card-actions">
                        <div class="card-action-row">
                            <span class="icon">🤍</span>
                            <span class="short-like-count-${short.id}">${short.likes}</span>
                        </div>
                        <div class="card-action-row">
                            <span class="icon">💬</span>
                            <span>${short.comments}</span>
                        </div>
                        <div class="card-action-row">
                            <span class="icon">↗️</span>
                            <span>Share</span>
                        </div>
                    </div>

                    <div class="inline-player-controls">
                        <div class="inline-progress">
                            <div class="inline-progress-fill" id="short-progress-${short.id}"></div>
                        </div>
                        <span class="inline-time" id="short-time-${short.id}">0:00</span>
                    </div>

                    <div class="card-info">
                        <div class="card-username">@${short.author}</div>
                        <div class="card-desc">${short.title}</div>
                    </div>
                </div>
            `).join('');

            // Attach gesture handlers to each short card
            shortsData.forEach(short => {
                const card = document.getElementById(`short-${short.id}`);
                attachShortGestures(card, short.id);
            });
        }

        // ===== SHORT INLINE PLAY =====
        function playShort(e, id) {
            e.stopPropagation();
            const short = shortsData.find(s => s.id === id);
            const card = document.getElementById(`short-${id}`);
            const video = card.querySelector('.short-video-inline');

            // Stop any other playing short
            if (currentShortId && currentShortId !== id) {
                const prevCard = document.getElementById(`short-${currentShortId}`);
                if (prevCard) {
                    prevCard.classList.remove('active', 'playing');
                    const prevVideo = prevCard.querySelector('.short-video-inline');
                    prevVideo.pause();
                    prevVideo.currentTime = 0;
                    prevVideo.src = '';
                }
            }

            currentShortId = id;
            card.classList.add('active', 'playing');
            video.src = short.url;
            video.muted = false;
            video.play();

            // Update progress
            video.ontimeupdate = () => {
                const pct = (video.currentTime / video.duration) * 100;
                document.getElementById(`short-progress-${id}`).style.width = pct + '%';
                document.getElementById(`short-time-${id}`).textContent = formatTime(video.currentTime);
            };

            video.onended = () => {
                card.classList.remove('playing', 'active');
                video.src = '';
                currentShortId = null;
            };
        }

        function toggleShortMute(e, id) {
            e.stopPropagation();
            const card = document.getElementById(`short-${id}`);
            const video = card.querySelector('.short-video-inline');
            const btn = card.querySelector('.card-mute');
            if (video) {
                video.muted = !video.muted;
                btn.textContent = video.muted ? '🔇' : '🔊';
            }
        }

        // ===== SHORT GESTURES (DWIN LIKE SYSTEM) =====
        function attachShortGestures(card, id) {
            let pressStartTime = 0;
            let pressX = 0;
            let pressY = 0;
            let hasSuper = false;

            const start = (e) => {
                const t = e.touches ? e.touches[0] : e;
                pressStartTime = Date.now();
                pressX = t.clientX;
                pressY = t.clientY;
                isPressing = true;
                hasSuper = false;

                pressTimer = setTimeout(() => {
                    if (isPressing) {
                        hasSuper = true;
                        triggerShortSuperLike(card, id, pressX, pressY);
                    }
                }, SUPER_LIKE_HOLD_MS);
            };

            const end = (e) => {
                const duration = Date.now() - pressStartTime;
                isPressing = false;
                clearTimeout(pressTimer);
                if (hasSuper) return;

                const t = e.changedTouches ? e.changedTouches[0] : e;
                const dx = Math.abs((t.clientX || t.pageX) - pressX);
                const dy = Math.abs((t.clientY || t.pageY) - pressY);
                if (dx > 10 || dy > 10) return;

                if (duration < SUPER_LIKE_HOLD_MS) {
                    handleShortTap(card, id, t.clientX || t.pageX, t.clientY || t.pageY);
                }
            };

            const move = (e) => {
                if (!isPressing) return;
                const t = e.touches ? e.touches[0] : e;
                if (Math.abs(t.clientX - pressX) > 20 || Math.abs(t.clientY - pressY) > 20) {
                    isPressing = false;
                    clearTimeout(pressTimer);
                }
            };

            card.addEventListener('touchstart', start, { passive: true });
            card.addEventListener('touchend', end, { passive: true });
            card.addEventListener('touchmove', move, { passive: true });
            card.addEventListener('mousedown', start);
            card.addEventListener('mouseup', end);
        }

        function handleShortTap(card, id, x, y) {
            const now = Date.now();
            if (now - lastTapTime < 300) {
                tapCount++;
                if (tapCount === 2) {
                    triggerShortHeartBurst(card, id);
                    tapCount = 0;
                }
            } else {
                tapCount = 1;
                setTimeout(() => {
                    if (tapCount === 1) {
                        triggerShortSingleLike(card, id);
                        // Also play the short if not playing
                        if (currentShortId !== id) {
                            const playBtn = card.querySelector('.card-play');
                            if (playBtn) playBtn.click();
                        }
                    }
                    tapCount = 0;
                }, 300);
            }
            lastTapTime = now;
        }

        function triggerShortSingleLike(card, id) {
            const short = shortsData.find(s => s.id === id);
            let state = shortLikeStates.get(id) || { count: short.likes, state: 'none' };
            const countEl = card.querySelector(`.short-like-count-${id}`);
            const iconRow = card.querySelector('.card-action-row .icon');

            if (state.state === 'none') {
                state.count++;
                state.state = 'liked';
                if (iconRow) iconRow.textContent = '💜';
            } else {
                state.count = Math.max(0, state.count - 1);
                state.state = 'none';
                if (iconRow) iconRow.textContent = '🤍';
            }

            if (countEl) countEl.textContent = state.count;
            shortLikeStates.set(id, state);
            createFloatingHeart(card, state.state === 'liked' ? '💜' : '🤍');
        }

        function triggerShortHeartBurst(card, id) {
            const short = shortsData.find(s => s.id === id);
            let state = shortLikeStates.get(id) || { count: short.likes, state: 'none' };
            if (state.state !== 'heart') {
                state.count += 2;
                state.state = 'heart';
            }
            const countEl = card.querySelector(`.short-like-count-${id}`);
            if (countEl) countEl.textContent = state.count;
            shortLikeStates.set(id, state);

            const iconRow = card.querySelector('.card-action-row .icon');
            if (iconRow) iconRow.textContent = '❤️';

            for (let i = 0; i < 4; i++) {
                setTimeout(() => createFloatingHeart(card, '❤️'), i * 80);
            }
            setTimeout(() => { if (iconRow) iconRow.textContent = '💜'; }, 500);
        }

        function triggerShortSuperLike(card, id, x, y) {
            const short = shortsData.find(s => s.id === id);
            let state = shortLikeStates.get(id) || { count: short.likes, state: 'none' };
            if (state.state !== 'super') {
                state.count += 5;
                state.state = 'super';
            }
            const countEl = card.querySelector(`.short-like-count-${id}`);
            if (countEl) countEl.textContent = state.count;
            shortLikeStates.set(id, state);

            const iconRow = card.querySelector('.card-action-row .icon');
            if (iconRow) iconRow.textContent = '💛';

            // Haptic ring
            const ring = document.createElement('div');
            ring.className = 'haptic-ring';
            const rect = card.getBoundingClientRect();
            ring.style.left = (x - rect.left) + 'px';
            ring.style.top = (y - rect.top) + 'px';
            card.appendChild(ring);
            setTimeout(() => ring.remove(), 800);

            // Super text
            const text = document.createElement('div');
            text.className = 'super-text';
            text.textContent = 'SUPER LIKE!';
            text.style.left = '20px';
            text.style.top = '40px';
            card.appendChild(text);
            setTimeout(() => text.remove(), 1200);

            // Coin pop
            const coin = document.createElement('div');
            coin.className = 'coin-pop';
            coin.innerHTML = '🪙 +1';
            coin.style.left = '20px';
            coin.style.top = '60px';
            card.appendChild(coin);
            setTimeout(() => coin.remove(), 1000);

            emoCoins += 1;
            document.getElementById('coinCount').textContent = emoCoins;
            if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 100]);

            setTimeout(() => { if (iconRow) iconRow.textContent = '💛'; }, 600);
        }

        // ===== FLOATING HEART =====
        function createFloatingHeart(container, emoji) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = emoji;
            const rect = container.getBoundingClientRect();
            heart.style.left = (rect.width / 2 + (Math.random() - 0.5) * 60) + 'px';
            heart.style.top = (rect.height / 2 + (Math.random() - 0.5) * 40) + 'px';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        }

        // ===== CHAT & SHARE =====
        function openChat() {
            alert('💬 Chat opened for: ' + mainVideos[currentMainIndex].title);
        }

        function shareVideo() {
            const v = mainVideos[currentMainIndex];
            if (navigator.share) {
                navigator.share({ title: v.title, text: 'Check out ' + v.title + ' on Ddott TV!' });
            } else {
                alert('🔗 Link copied: ddott.live/video/' + v.id);
            }
        }

        // ===== NAV ACTIVE STATE =====
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Close selector on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.video-selector')) {
                selectorDropdown.classList.remove('open');
            }
        });

        // ===== START =====
        init();
    </script>
</body>
</html>
