<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ddott TV</title>
    <style>
        :root {
            --bg: #0a0a14;
            --bg-elevated: #12121e;
            --bg-card: #1a1a2e;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --gold: #fbbf24;
            --text: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255,255,255,0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
        }

        #app {
            width: 100%;
            height: calc(100dvh - 64px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== MAIN PLAYER (60%) ===== */
        .main-player {
            height: 53dvh;
            flex-shrink: 0;
            min-height: 0;
            position: relative;
            background: #000;
            flex-shrink: 0;
            overflow: hidden;
        }

        .main-player video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Select Video Dropdown */
        .video-select {
            position: absolute;
            top: 12px;
            left: 14px;
            z-index: 20;
        }

        .select-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 7px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .select-dropdown {
            position: absolute;
            top: 44px;
            left: 0;
            width: 240px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 30;
            max-height: 280px;
            overflow-y: auto;
        }

        .select-dropdown.open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .select-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .select-item:hover, .select-item.active { background: rgba(139, 92, 246, 0.12); }

        .select-thumb {
            width: 52px;
            height: 38px;
            border-radius: 8px;
            object-fit: cover;
            background: #333;
        }

        .select-title { font-size: 13px; font-weight: 600; }
        .select-author { font-size: 11px; color: var(--text-muted); }

        /* Side Actions */
        .side-actions {
            position: absolute;
            right: 10px;
            bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 10;
        }

        .s-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
        }

        .s-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(20, 20, 35, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.3s ease;
        }

        .s-btn:active .s-circle { transform: scale(0.92); }
        .s-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); }

        /* Simple like state */
        .s-btn.liked .s-circle {
            background: rgba(139, 92, 246, 0.25);
            border-color: var(--purple);
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.3);
        }
        .s-btn.liked .s-label { color: var(--purple); }

        /* Bottom Info Overlay */
        .main-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 14px 36px;
            background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
            pointer-events: none;
            z-index: 5;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .play-dot {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        Kpx;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .creator-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .c-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            border: 2px solid rgba(255,255,255,0.15);
        }

        .c-badge {
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
        }

        .c-views {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Progress */
        .progress-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 50px;
            height: 4px;
            background: rgba(255,255,255,0.08);
            cursor: pointer;
            z-index: 10;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
            width: 0%;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.6);
        }

        .time-display {
            position: absolute;
            bottom: 10px;
            right: 46px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .mute-btn {
            position: absolute;
            bottom: 8px;
            right: 10px;
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            z-index: 10;
        }

        /* ===== SHORTS SECTION (40%) ===== */
        .shorts-section {
            height: 40dvh;
            flex-shrink: 0;
            min-height: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .shorts-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            flex-shrink: 0;
        }

        .sh-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--purple);
        }

        .sh-dot {
            width: 8px;
            height: 8px;
            background: var(--pink);
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        .sh-bolt { font-size: 16px; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .sh-count {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Shorts Grid - BIGGER CARDS */
        .shorts-grid {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            gap: 10px;
            padding: 0 10px 8px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            min-height: 0;
            align-items: stretch;
        }

        .shorts-grid::-webkit-scrollbar { display: none; }

        .short-card {
            flex: 0 0 140px;
            height: 100%;
            min-height: 0;
            position: relative;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
        }

        .card-visual {
            flex: 1;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: var(--bg-card);
            border: 2px solid transparent;
            transition: border-color 0.3s;
            min-height: 0;
        }

        .card-visual.active {
            border-color: var(--purple);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
        }

        .card-visual img, .card-visual video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-visual video {
            position: absolute;
            inset: 0;
            display: none;
        }

        .card-visual.playing video { display: block; }
        .card-visual.playing img { opacity: 0; }

        /* Card overlays */
        .badge-new {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(139, 92, 246, 0.9);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .badge-new::before {
            content: '';
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
        }

        .card-mute {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            background: rgba(239, 68, 68, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border: none;
            color: #fff;
            cursor: pointer;
            z-index: 3;
        }

        .card-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            cursor: pointer;
            z-index: 3;
        }

        .card-actions {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 3;
        }

        .ca-row {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .ca-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }

        .card-info {
            padding: 6px 2px 2px;
        }

        .card-user {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 1px;
        }

        .card-desc {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            height: 64px;
            background: rgba(10, 10, 20, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            transition: color 0.2s;
            padding: 4px 8px;
        }

        .nav-item.active { color: var(--purple); }
        .nav-item svg { width: 26px; height: 26px; }

        /* ===== ANIMATIONS ===== */
        .float-heart {
            position: absolute;
            font-size: 32px;
            pointer-events: none;
            animation: fu 0.9s ease-out forwards;
            z-index: 100;
            filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.5));
        }

        @keyframes fu {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.3); }
        }
    
        /* === COMPACT UI === */
        .s-circle{width:34px!important;height:34px!important;font-size:13px!important;background:rgba(10,10,20,0.2)!important;border-color:rgba(255,255,255,0.03)!important}
        .s-label{font-size:8px!important;color:rgba(255,255,255,0.2)!important}
        .main-overlay{opacity:0.5!important}
        .info-title{font-size:11px!important;font-weight:600!important}
        .c-avatar{width:18px!important;height:18px!important;font-size:8px!important}
        .c-badge{font-size:9px!important;padding:1px 6px!important;background:rgba(255,255,255,0.06)!important}
        .c-views{font-size:9px!important}
        .play-dot{display:none!important}
        .side-actions{gap:10px!important}
</style>

                    <circle cx="12" cy="12" r="0.8" fill="currentColor" stroke="none"></circle>

    <script>
        // ===== DATA =====
        let mainVideos = [];
        let drottsData = [];

        // ===== STATE =====
        let mainIndex = 0;
        let activeShortId = null;
        const mainLikes = new Map();
        const shortLikes = new Map();

        // ===== SUPABASE FETCH =====
        async function loadAllData() {
            try {
                // Fetch main videos (is_short = false)
                const { data: videos, error: vErr } = await window.db
                    .from('videos')
                    .select('id, title, creator_name, views, likes, video_url, thumbnail_url, created_at')
                    .eq('is_short', false)
                    .order('created_at', { ascending: false })
                    .limit(20);

                if (vErr) throw vErr;

                mainVideos = (videos || []).map(v => ({
                    id: v.id,
                    title: v.title || 'Untitled',
                    creator: v.creator_name || 'Creator',
                    avatar: (v.creator_name || 'C')[0].toUpperCase(),
                    views: formatViews(v.views || 0),
                    likes: v.likes || 0,
                    url: v.video_url,
                    thumb: v.thumbnail_url ? v.thumbnail_url.replace(/\.mp4$/, '.jpg') : ''
                }));

                // Fetch drotts/shorts (is_short = true)
                const { data: shorts, error: sErr } = await window.db
                    .from('videos')
                    .select('id, title, creator_name, views, likes, video_url, thumbnail_url, created_at')
                    .eq('is_short', true)
                    .order('created_at', { ascending: false })
                    .limit(30);

                if (sErr) throw sErr;

                const now = new Date();
                drottsData = (shorts || []).map(s => {
                    const created = new Date(s.created_at);
                    const diffHrs = (now - created) / 36e5;
                    return {
                        id: s.id,
                        author: s.creator_name || 'creator',
                        title: s.title || 'Untitled',
                        views: formatViews(s.views || 0),
                        likes: s.likes || 0,
                        comments: 0,
                        isNew: diffHrs < 48,
                        thumb: s.thumbnail_url ? s.thumbnail_url.replace(/\.mp4$/, '.jpg') : '',
                        url: s.video_url
                    };
                });

            } catch (err) {
                console.error('Supabase fetch error:', err);
                mainVideos = [];
                drottsData = [];
            }
        }

        function formatViews(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return String(n);
        }

        // ===== DOM =====
        const mainVideo = document.getElementById('mainVideo');
        const selectDropdown = document.getElementById('selectDropdown');
        const drottsGrid = document.getElementById('shortsGrid');

        // ===== INIT =====
        async function init() {
            await loadAllData();
            renderSelector();
            renderShorts();
            setupMainVideo();
            updateMainUI();
            mainVideo.play();
            mainVideo.muted = true;
        }

        // ===== MAIN VIDEO =====
        function setupMainVideo() {
            mainVideo.ontimeupdate = () => {
                const pct = (mainVideo.currentTime / mainVideo.duration) * 100;
                document.getElementById('mainProgress').style.width = pct + '%';
                document.getElementById('mainTime').textContent = fmt(mainVideo.currentTime) + ' / ' + fmt(mainVideo.duration || 0);
            };
            mainVideo.onclick = () => { mainVideo.paused ? mainVideo.play() : mainVideo.pause(); };
            document.getElementById('progressWrap').onclick = (e) => {
                const r = e.currentTarget.getBoundingClientRect();
                mainVideo.currentTime = ((e.clientX - r.left) / r.width) * mainVideo.duration;
            };
        }

        function fmt(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        function toggleMute() {
            mainVideo.muted = !mainVideo.muted;
            document.getElementById('mainMute').textContent = mainVideo.muted ? '🔇' : '🔊';
        }

        function updateMainUI() {
            const v = mainVideos[mainIndex];
            document.getElementById('mainTitle').textContent = v.title;
            document.getElementById('mainCreator').textContent = v.creator;
            document.getElementById('mainAvatar').textContent = v.avatar;
            document.getElementById('mainViews').textContent = v.views + ' views';

            const st = mainLikes.get(v.id) || { count: v.likes, liked: false };
            document.getElementById('mainLikeCount').textContent = st.count;
            const btn = document.getElementById('mainLikeBtn');
            const icon = document.getElementById('mainLikeIcon');
            btn.classList.toggle('liked', st.liked);
            icon.textContent = st.liked ? '💜' : '🤍';
        }

        // Simple like main video
        function likeMain() {
            const id = mainVideos[mainIndex].id;
            let st = mainLikes.get(id) || { count: mainVideos[mainIndex].likes, liked: false };
            st.liked = !st.liked;
            st.count += st.liked ? 1 : -1;
            mainLikes.set(id, st);
            updateMainUI();
        }

        // ===== VIDEO SELECTOR =====
        function renderSelector() {
            selectDropdown.innerHTML = mainVideos.map((v, i) => `
                <div class="select-item ${i===mainIndex?'active':''}" onclick="selectMain(${i})">
                    <img class="select-thumb" src="${v.thumb}">
                    <div>
                        <div class="select-title">${v.title}</div>
                        <div class="select-author">@${v.creator}</div>
                    </div>
                </div>
            `).join('');
        }

        function toggleSelect() {
            selectDropdown.classList.toggle('open');
        }

        function selectMain(i) {
            mainIndex = i;
            const v = mainVideos[i];
            mainVideo.src = v.url;
            mainVideo.play();
            mainVideo.muted = false;
            updateMainUI();
            renderSelector();
            toggleSelect();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.video-select')) selectDropdown.classList.remove('open');
        });

        function shareMain() {
            const v = mainVideos[mainIndex];
            if (navigator.share) navigator.share({ title: v.title, text: 'Check out ' + v.title + ' on Ddott TV!' });
            else alert('🔗 Link copied: ddott.live/video/' + v.id);
        }

        // ===== SHORTS =====
        function renderShorts() {
            document.getElementById('shortsCount').textContent = drottsData.length + ' drotts';
            drottsGrid.innerHTML = drottsData.map(s => `
                <div class="short-card" id="sc-${s.id}">
                    <div class="card-visual" id="cv-${s.id}">
                        <img src="${s.thumb}" alt="${s.title}">
                        <video loop playsinline muted preload="metadata"></video>

                        ${s.isNew ? '<div class="badge-new">NEW</div>' : ''}
                        <button class="card-mute" onclick="event.stopPropagation();toggleShortMute(${s.id})">🔇</button>
                        <button class="card-play" onclick="event.stopPropagation();playShort(${s.id})">▶</button>

                        <div class="card-actions">
                            <div class="ca-row">
                                <button class="ca-btn" onclick="event.stopPropagation();likeShort(${s.id})">🤍</button>
                                <span id="sl-${s.id}">${s.likes}</span>
                            </div>
                            <div class="ca-row">
                                <button class="ca-btn" onclick="event.stopPropagation();alert('💬 Comment')">💬</button>
                                <span>${s.comments}</span>
                            </div>
                            <div class="ca-row">
                                <button class="ca-btn" onclick="event.stopPropagation();alert('↗️ Share')">↗️</button>
                                <span>Share</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="card-user">@${s.author}</div>
                        <div class="card-desc">${s.title}</div>
                    </div>
                </div>
            `).join('');
        }

        function playShort(id) {
            const s = drottsData.find(x => x.id === id);
            const cv = document.getElementById(`cv-${id}`);
            const vid = cv.querySelector('video');

            // Stop previous
            if (activeShortId && activeShortId !== id) {
                const prev = document.getElementById(`cv-${activeShortId}`);
                if (prev) {
                    prev.classList.remove('playing', 'active');
                    const pv = prev.querySelector('video');
                    pv.pause(); pv.currentTime = 0; pv.src = '';
                }
            }

            activeShortId = id;
            cv.classList.add('playing', 'active');
            vid.src = s.url;
            vid.muted = true;
            vid.play();

            vid.onended = () => {
                cv.classList.remove('playing', 'active');
                vid.src = '';
                activeShortId = null;
            };
        }

        function toggleShortMute(id) {
            const cv = document.getElementById(`cv-${id}`);
            const vid = cv.querySelector('video');
            const btn = cv.querySelector('.card-mute');
            if (vid.src) {
                vid.muted = !vid.muted;
                btn.textContent = vid.muted ? '🔇' : '🔊';
            }
        }

        // Simple like short
        function likeShort(id) {
            const s = drottsData.find(x => x.id === id);
            let st = shortLikes.get(id) || { count: s.likes, liked: false };
            st.liked = !st.liked;
            st.count += st.liked ? 1 : -1;
            shortLikes.set(id, st);
            document.getElementById(`sl-${id}`).textContent = st.count;

            const btn = document.querySelector(`#sc-${id} .ca-btn`);
            if (btn) btn.textContent = st.liked ? '💜' : '🤍';
        }

        // ===== NAV =====
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // ===== START =====
        init();
    </script>
</body>
</html>
