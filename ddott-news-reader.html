<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ddott News</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000;color:#fff;font-family:'Rajdhani',sans-serif;overflow:hidden;}

/* CHANNEL HEADER */
.channel-bar{position:fixed;top:0;left:0;right:0;height:48px;z-index:100;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);border-bottom:2px solid #ff0040;}
.back-btn{font-size:18px;cursor:pointer;opacity:0.7;}
.channel-logo{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;color:#ff0040;letter-spacing:2px;}
.live-tag{display:flex;align-items:center;gap:4px;padding:3px 8px;background:#ff0040;border-radius:3px;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;letter-spacing:1px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 0.8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.lang-strip{display:flex;gap:6px;margin-left:auto;}
.lang-btn{padding:4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#fff;font-size:11px;cursor:pointer;font-family:'Rajdhani',sans-serif;}
.lang-btn.active{background:#ff0040;border-color:#ff0040;font-weight:700;}

/* MAIN VIDEO AREA */
.news-screen{position:fixed;top:48px;left:0;right:0;bottom:0;background:#000;}

/* BG IMAGE */
.news-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 0.8s ease;}
.news-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.1) 40%,rgba(0,0,0,0.85) 70%,rgba(0,0,0,0.97) 100%);}

/* BREAKING TICKER */
.ticker-wrap{position:absolute;top:0;left:0;right:0;height:32px;background:rgba(255,0,64,0.9);display:flex;align-items:center;overflow:hidden;z-index:10;}
.ticker-label{padding:0 12px;font-family:'Orbitron',monospace;font-size:9px;font-weight:900;letter-spacing:1px;background:#fff;color:#ff0040;height:100%;display:flex;align-items:center;flex-shrink:0;}
.ticker-text{white-space:nowrap;animation:ticker 40s linear infinite;font-size:12px;font-weight:600;padding-left:20px;}
@keyframes ticker{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}

/* NEWS CONTENT */
.news-content{position:absolute;bottom:0;left:0;right:0;padding:16px 14px 20px;z-index:10;}
.news-source-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:rgba(255,0,64,0.8);border-radius:3px;font-size:10px;font-weight:700;letter-spacing:0.5px;margin-bottom:8px;}
.news-counter{position:absolute;top:40px;right:14px;font-family:'Orbitron',monospace;font-size:10px;color:rgba(255,255,255,0.6);}
.news-headline{font-size:18px;font-weight:700;line-height:1.3;margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,0.8);}
.news-body{font-size:13px;line-height:1.5;color:rgba(255,255,255,0.85);max-height:80px;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,0.8);}

/* TELEPROMPTER HIGHLIGHT */
.word{display:inline;transition:all 0.1s;}
.word.active{background:rgba(255,0,64,0.4);border-radius:2px;padding:0 2px;}

/* CONTROLS */
.controls-bar{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(to top,rgba(0,0,0,0.9),transparent);display:flex;align-items:center;gap:10px;z-index:20;}
.ctrl-btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.play-btn{width:50px;height:50px;background:#ff0040;border:none;box-shadow:0 0 20px rgba(255,0,64,0.5);}
.progress{flex:1;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden;cursor:pointer;}
.progress-fill{height:100%;background:#ff0040;width:0%;transition:width 0.3s;border-radius:2px;}
.speed-btn{padding:5px 10px;border-radius:8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-family:'Orbitron',monospace;font-size:10px;cursor:pointer;}
.vol-btn{font-size:18px;cursor:pointer;opacity:0.7;}

/* NEWS SWIPE DOTS */
.story-dots{position:absolute;top:40px;left:14px;display:flex;gap:5px;z-index:10;}
.dot{width:20px;height:3px;border-radius:2px;background:rgba(255,255,255,0.3);transition:all 0.3s;cursor:pointer;}
.dot.active{background:#ff0040;width:30px;}

/* AUTO NEXT */
.auto-bar{position:absolute;top:32px;left:0;right:0;height:4px;background:rgba(255,255,255,0.1);}
.auto-fill{height:100%;background:rgba(255,0,64,0.6);width:0%;transition:width linear;}

/* LOADING */
.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:50;}
.loader-icon{font-size:50px;animation:spin 2s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.loader-text{font-family:'Orbitron',monospace;font-size:11px;color:#ff0040;letter-spacing:2px;margin-top:12px;}

/* NEWS ANCHOR AVATAR */
.anchor-wrap{position:absolute;top:36px;right:14px;z-index:15;display:flex;flex-direction:column;align-items:center;gap:4px;}
.anchor-avatar{width:70px;height:70px;border-radius:50%;border:2px solid #ff0040;overflow:hidden;position:relative;background:linear-gradient(135deg,#1a0820,#000d1a);box-shadow:0 0 20px rgba(255,0,64,0.4);}
.anchor-face{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.anchor-head{width:38px;height:44px;background:linear-gradient(180deg,#f5c5a3,#e8a882);border-radius:50% 50% 45% 45%;position:relative;margin-top:8px;}
.anchor-hair{position:absolute;top:-4px;left:-2px;right:-2px;height:22px;background:#2c1810;border-radius:50% 50% 0 0;}
.anchor-eyes{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;}
.anchor-eye{width:5px;height:5px;background:#2c1810;border-radius:50%;animation:blink-eye 4s infinite;}
@keyframes blink-eye{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
.anchor-mouth{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:12px;height:5px;background:#c0705a;border-radius:0 0 8px 8px;transition:all 0.1s;}
.anchor-mouth.talking{animation:talk 0.15s infinite alternate;}
@keyframes talk{0%{height:3px;width:10px;border-radius:0 0 8px 8px;}100%{height:8px;width:14px;border-radius:4px;}}
.anchor-suit{position:absolute;bottom:0;left:0;right:0;height:22px;background:linear-gradient(180deg,#1a237e,#0d1757);border-radius:0 0 50% 50%;}
.anchor-tie{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:6px;height:14px;background:#ff0040;clip-path:polygon(50% 0%,100% 30%,70% 100%,30% 100%,0% 30%);}
.anchor-label{font-family:'Orbitron',monospace;font-size:7px;color:#ff0040;letter-spacing:1px;background:rgba(0,0,0,0.7);padding:2px 6px;border-radius:3px;border:1px solid rgba(255,0,64,0.3);}
.anchor-signal{display:flex;gap:2px;align-items:flex-end;height:12px;}
.anchor-bar{width:3px;background:#ff0040;border-radius:1px;opacity:0.3;}
.anchor-bar.active{opacity:1;animation:soundbar 0.4s infinite alternate;}
.anchor-bar:nth-child(1){height:4px;animation-delay:0s;}
.anchor-bar:nth-child(2){height:8px;animation-delay:0.1s;}
.anchor-bar:nth-child(3){height:12px;animation-delay:0.2s;}
.anchor-bar:nth-child(4){height:8px;animation-delay:0.3s;}
.anchor-bar:nth-child(5){height:4px;animation-delay:0.4s;}
@keyframes soundbar{0%{transform:scaleY(0.3)}100%{transform:scaleY(1)}}
</style>
</head>
<body>

<div class="channel-bar">
  <div class="back-btn" onclick="history.back()">←</div>
  <div class="channel-logo">📺 DDOTT NEWS</div>
  <div class="live-tag"><div class="live-dot"></div>LIVE</div>
  <div class="lang-strip">
    <button class="lang-btn active" onclick="loadNews('en',this)">EN</button>
    <button class="lang-btn" onclick="loadNews('ml',this)">ML</button>
    <button class="lang-btn" onclick="loadNews('hi',this)">HI</button>
    <button class="lang-btn" onclick="loadNews('ar',this)">AR</button>
  </div>
</div>

<div class="news-screen">
  <div class="loader" id="loader">
    <div class="loader-icon">📡</div>
    <div class="loader-text">LOADING NEWS...</div>
  </div>

  <div class="news-bg" id="newsBg"></div>
  <div class="auto-bar"><div class="auto-fill" id="autoFill"></div></div>
  <div class="ticker-wrap"><div class="ticker-label">BREAKING</div><div class="ticker-text" id="tickerText">Loading latest news...</div></div>
  
  <div class="story-dots" id="storyDots"></div>
  <div class="news-counter" id="newsCounter"></div>
  <div class="anchor-wrap">
    <div class="anchor-avatar">
      <div class="anchor-face">
        <div class="anchor-head">
          <div class="anchor-hair"></div>
          <div class="anchor-eyes">
            <div class="anchor-eye"></div>
            <div class="anchor-eye"></div>
          </div>
          <div class="anchor-mouth" id="anchorMouth"></div>
        </div>
        <div class="anchor-suit">
          <div class="anchor-tie"></div>
        </div>
      </div>
    </div>
    <div class="anchor-label">ON AIR</div>
    <div class="anchor-signal" id="anchorSignal">
      <div class="anchor-bar"></div>
      <div class="anchor-bar"></div>
      <div class="anchor-bar"></div>
      <div class="anchor-bar"></div>
      <div class="anchor-bar"></div>
    </div>
  </div>


  <div class="news-content">
    <div class="news-source-tag" id="newsSource">DDOTT NEWS</div>
    <div class="news-headline" id="newsHeadline">Loading...</div>
    <div class="news-body" id="newsBody"></div>
  </div>

  <div class="controls-bar">
    <button class="ctrl-btn" onclick="prevNews()">⏮</button>
    <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" onclick="nextNews()">⏭</button>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <button class="speed-btn" onclick="cycleSpeed()" id="speedBtn">1x</button>
    <div class="vol-btn" onclick="toggleMute()" id="volBtn">🔊</div>
  </div>
</div>

<script>
const WORKER = 'https://ddott-news.meradivin.workers.dev/news';
const VOICES = {en:'en-US',ml:'ml-IN',hi:'hi-IN',ar:'ar-SA'};
let news=[], idx=0, playing=false, speed=1, muted=false, lang='en';
let synth=window.speechSynthesis, autoTimer=null, progressTimer=null, speaking=false;

async function loadNews(l, btn) {
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  hardStop();
  document.getElementById('loader').style.display='flex';
  try {
    const res = await fetch(WORKER+'?lang='+lang);
    const data = await res.json();
    news = data.articles || [];
    idx=0;
    document.getElementById('loader').style.display='none';
    buildDots();
    renderNews(0);
    document.getElementById('tickerText').textContent = news.map(n=>n.title).join('   •   ');
  } catch(e) {
    document.getElementById('loader').style.display='none';
    document.getElementById('newsHeadline').textContent='Failed to load news';
  }
}

function buildDots() {
  document.getElementById('storyDots').innerHTML = news.slice(0,10).map((_,i)=>
    `<div class="dot ${i===0?'active':''}" onclick="jumpTo(${i})"></div>`).join('');
}

function renderNews(i) {
  if(i < 0 || i >= news.length) return;
  idx = i;
  const n = news[idx];
  const bgImg = (n.image && n.image.startsWith('http')) 
    ? `url(${n.image})` 
    : 'linear-gradient(135deg,#1a0010,#000820)';
  document.getElementById('newsBg').style.backgroundImage = bgImg;
  document.getElementById('newsSource').textContent = n.source?.name || 'News';
  document.getElementById('newsHeadline').textContent = n.title;
  document.getElementById('newsBody').textContent = n.description || '';
  document.getElementById('newsCounter').textContent = (idx+1)+' / '+news.length;
  document.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('active',j===idx));
  document.getElementById('progressFill').style.width='0%';
}

function speakCurrent() {
  if(speaking) return;
  const n = news[idx];
  if(!n) return;
  if(muted) { scheduleNext(); return; }
  speaking = true;
  const utt = new SpeechSynthesisUtterance(n.title + '. ' + (n.description||''));
  utt.lang = VOICES[lang]||'en-US';
  utt.rate = speed;
  utt.onstart = () => { 
    animateProgress(); 
    startTalking(); 
  };
  utt.onend = () => {
    stopTalking();
    speaking = false;
    if(playing) scheduleNext();
  };
  utt.onerror = () => {
    stopTalking();
    speaking = false;
    if(playing) scheduleNext();
  };
  synth.speak(utt);
}

function scheduleNext() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    if(!playing) return;
    if(idx < news.length-1) {
      renderNews(idx+1);
      speakCurrent();
    } else {
      playing=false;
      document.getElementById('playBtn').textContent='▶';
    }
  }, 1500);
}

function animateProgress() {
  let w=0;
  clearInterval(progressTimer);
  progressTimer = setInterval(()=>{
    if(!playing){ clearInterval(progressTimer); return; }
    w = Math.min(w+0.5, 95);
    document.getElementById('progressFill').style.width=w+'%';
  }, 200);
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  if(playing) { speakCurrent(); }
  else { hardStop(); }
}

function jumpTo(i) {
  hardStop();
  renderNews(i);
  if(playing) { playing=true; speakCurrent(); }
}

function nextNews() {
  hardStop();
  if(idx < news.length-1) { renderNews(idx+1); if(playing) speakCurrent(); }
}

function prevNews() {
  hardStop();
  if(idx > 0) { renderNews(idx-1); if(playing) speakCurrent(); }
}

function hardStop() {
  stopTalking();
  speaking = false;
  synth.cancel();
  clearTimeout(autoTimer);
  clearInterval(progressTimer);
}

function cycleSpeed() {
  const s=[0.75,1,1.25,1.5,2];
  const i=s.indexOf(speed);
  speed=s[(i+1)%s.length];
  document.getElementById('speedBtn').textContent=speed+'x';
}

function toggleMute() {
  muted=!muted;
  document.getElementById('volBtn').textContent=muted?'🔇':'🔊';
}

// Swipe
let tx=0;
document.querySelector('.news-screen').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;});
document.querySelector('.news-screen').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){ if(dx<0) nextNews(); else prevNews(); }
});

function startTalking() {
  document.getElementById('anchorMouth').classList.add('talking');
  document.querySelectorAll('.anchor-bar').forEach(b=>b.classList.add('active'));
}
function stopTalking() {
  document.getElementById('anchorMouth').classList.remove('talking');
  document.querySelectorAll('.anchor-bar').forEach(b=>b.classList.remove('active'));
}

window.onload=()=>loadNews('en',document.querySelector('.lang-btn'));
</script>
</body>
</html>
