<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ddott News</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000;color:#fff;font-family:'Rajdhani',sans-serif;overflow:hidden;}

/* CHANNEL HEADER */
.channel-bar{position:fixed;top:0;left:0;right:0;height:48px;z-index:100;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(0,0,0,0.95);border-bottom:2px solid #ff0040;}
.back-btn{font-size:18px;cursor:pointer;opacity:0.7;}
.channel-logo{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;color:#ff0040;letter-spacing:2px;}
.live-tag{display:flex;align-items:center;gap:4px;padding:3px 8px;background:#ff0040;border-radius:3px;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;letter-spacing:1px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 0.8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.lang-strip{display:flex;gap:5px;margin-left:auto;}
.lang-btn{padding:4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#fff;font-size:11px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:600;}
.lang-btn.active{background:#ff0040;border-color:#ff0040;}

/* MAIN SCREEN */
.news-screen{position:fixed;top:48px;left:0;right:0;bottom:0;background:#000;display:flex;flex-direction:column;}

/* STUDIO BG - no random images */
.studio-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%, #1a0008 0%, #0a000f 50%, #000 100%);}
.studio-bg::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,0,64,0.015) 60px,rgba(255,0,64,0.015) 61px),repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(255,0,64,0.015) 60px,rgba(255,0,64,0.015) 61px);}
.studio-glow{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120%;height:40%;background:radial-gradient(ellipse,rgba(255,0,64,0.08) 0%,transparent 70%);}

/* BREAKING TICKER */
.ticker-wrap{position:absolute;top:0;left:0;right:0;height:28px;background:rgba(255,0,64,0.92);display:flex;align-items:center;overflow:hidden;z-index:10;}
.ticker-label{padding:0 10px;font-family:'Orbitron',monospace;font-size:8px;font-weight:900;letter-spacing:1px;background:#fff;color:#ff0040;height:100%;display:flex;align-items:center;flex-shrink:0;white-space:nowrap;}
.ticker-text{white-space:nowrap;animation:ticker 50s linear infinite;font-size:11px;font-weight:700;padding-left:20px;letter-spacing:0.3px;}
@keyframes ticker{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}

/* NEWS DOTS */
.story-dots{position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;}
.dot{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,0.25);transition:all 0.3s;cursor:pointer;}
.dot.active{background:#ff0040;width:28px;}

/* AUTO PROGRESS */
.auto-bar{position:absolute;top:28px;left:0;right:0;height:3px;background:rgba(255,255,255,0.08);}
.auto-fill{height:100%;background:rgba(255,0,64,0.5);width:0%;transition:width linear;}

/* ANCHOR AREA - CENTER STAGE */
.anchor-stage{position:absolute;top:40px;left:0;right:0;bottom:160px;display:flex;align-items:flex-end;justify-content:center;z-index:5;}
.anchor-container{display:flex;flex-direction:column;align-items:center;gap:0;}

/* ANCHOR AVATAR - Large SVG */
.anchor-svg-wrap{width:160px;height:200px;position:relative;filter:drop-shadow(0 0 20px rgba(255,0,64,0.3));}
.anchor-svg-wrap svg{width:100%;height:100%;}

/* DESK */
.anchor-desk{width:260px;height:28px;background:linear-gradient(180deg,#1a0a20,#0d0614);border-top:2px solid rgba(255,0,64,0.5);border-radius:8px 8px 0 0;position:relative;margin-top:-8px;}
.anchor-desk::before{content:'';position:absolute;top:-1px;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,0,64,0.8),transparent);}

/* ANCHOR CONTROLS */
.anchor-controls{position:absolute;top:34px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:15;}
.gender-wrap{display:flex;gap:4px;}
.gender-btn{padding:3px 8px;border-radius:8px;border:1px solid rgba(255,0,64,0.4);background:rgba(0,0,0,0.7);color:#fff;font-size:9px;font-family:'Orbitron',monospace;cursor:pointer;}
.gender-btn.active{background:#ff0040;border-color:#ff0040;}
.on-air-badge{display:flex;align-items:center;gap:4px;padding:3px 8px;background:rgba(0,0,0,0.8);border:1px solid rgba(255,0,64,0.4);border-radius:6px;font-family:'Orbitron',monospace;font-size:8px;color:#ff0040;}
.on-air-dot{width:5px;height:5px;border-radius:50%;background:#ff0040;animation:blink 0.8s infinite;}
.voice-bars{display:flex;gap:2px;align-items:flex-end;height:14px;}
.vbar{width:3px;border-radius:1px;background:#ff0040;opacity:0.2;transition:all 0.15s;}
.vbar:nth-child(1){height:4px;}
.vbar:nth-child(2){height:8px;}
.vbar:nth-child(3){height:14px;}
.vbar:nth-child(4){height:8px;}
.vbar:nth-child(5){height:4px;}
.vbar.active{opacity:1;animation:vb 0.3s infinite alternate;}
.vbar:nth-child(1){animation-delay:0s;}
.vbar:nth-child(2){animation-delay:0.06s;}
.vbar:nth-child(3){animation-delay:0.12s;}
.vbar:nth-child(4){animation-delay:0.18s;}
.vbar:nth-child(5){animation-delay:0.24s;}
@keyframes vb{0%{transform:scaleY(0.3)}100%{transform:scaleY(1)}}

/* NEWS CONTENT AREA */
.news-content{position:absolute;bottom:60px;left:0;right:0;padding:0 14px 8px;z-index:10;}
.news-source-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.news-source-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:rgba(255,0,64,0.85);border-radius:3px;font-size:9px;font-weight:700;letter-spacing:0.5px;font-family:'Orbitron',monospace;}
.news-counter{font-family:'Orbitron',monospace;font-size:9px;color:rgba(255,255,255,0.4);margin-left:auto;}
.news-headline{font-size:17px;font-weight:700;line-height:1.35;margin-bottom:6px;text-shadow:0 2px 12px rgba(0,0,0,0.9);}
.news-headline.ml-text{font-family:'Noto Sans Malayalam','Rajdhani',sans-serif;font-size:15px;}
.news-body{font-size:12px;line-height:1.5;color:rgba(255,255,255,0.75);max-height:52px;overflow:hidden;}
.news-body.ml-text{font-family:'Noto Sans Malayalam','Rajdhani',sans-serif;font-size:12px;}

/* TELEPROMPTER WORD HIGHLIGHT */
.word.active{background:rgba(255,0,64,0.35);border-radius:2px;padding:0 1px;}

/* CONTROLS */
.controls-bar{position:absolute;bottom:0;left:0;right:0;height:60px;padding:8px 14px;background:linear-gradient(to top,rgba(0,0,0,0.98),rgba(0,0,0,0.7));display:flex;align-items:center;gap:8px;z-index:20;}
.ctrl-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);color:#fff;}
.play-btn{width:46px;height:46px;background:#ff0040;border:none;box-shadow:0 0 18px rgba(255,0,64,0.5);font-size:16px;}
.progress{flex:1;height:3px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;cursor:pointer;}
.progress-fill{height:100%;background:#ff0040;width:0%;transition:width 0.3s;border-radius:2px;}
.speed-btn{padding:4px 9px;border-radius:7px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;font-family:'Orbitron',monospace;font-size:9px;cursor:pointer;}
.vol-btn{font-size:17px;cursor:pointer;opacity:0.7;}

/* LOADING */
.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:50;}
.loader-icon{font-size:44px;animation:spin 2s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.loader-text{font-family:'Orbitron',monospace;font-size:10px;color:#ff0040;letter-spacing:2px;margin-top:10px;}
</style>
</head>
<body>

<div class="channel-bar">
  <div class="back-btn" onclick="history.back()">←</div>
  <div class="channel-logo">📺 DDOTT NEWS</div>
  <div class="live-tag"><div class="live-dot"></div>LIVE</div>
  <div class="lang-strip">
    <button class="lang-btn active" onclick="loadNews('en',this)">EN</button>
    <button class="lang-btn" onclick="loadNews('ml',this)">ML</button>
    <button class="lang-btn" onclick="loadNews('hi',this)">HI</button>
    <button class="lang-btn" onclick="loadNews('ar',this)">AR</button>
  </div>
</div>

<div class="news-screen">
  <div class="loader" id="loader">
    <div class="loader-icon">📡</div>
    <div class="loader-text">LOADING NEWS...</div>
  </div>

  <div class="studio-bg"><div class="studio-glow"></div></div>
  <div class="auto-bar"><div class="auto-fill" id="autoFill"></div></div>
  <div class="ticker-wrap"><div class="ticker-label">BREAKING</div><div class="ticker-text" id="tickerText">Loading latest news...</div></div>
  <div class="story-dots" id="storyDots"></div>

  <!-- ANCHOR CONTROLS -->
  <div class="anchor-controls">
    <div class="gender-wrap">
      <button class="gender-btn active" id="btnMale" onclick="switchAnchor('male')">♂</button>
      <button class="gender-btn" id="btnFemale" onclick="switchAnchor('female')">♀</button>
    </div>
    <div class="on-air-badge"><div class="on-air-dot"></div><span id="airLabel">ON AIR</span></div>
    <div class="voice-bars" id="voiceBars">
      <div class="vbar"></div><div class="vbar"></div><div class="vbar"></div><div class="vbar"></div><div class="vbar"></div>
    </div>
  </div>

  <!-- ANCHOR STAGE -->
  <div class="anchor-stage">
    <div class="anchor-container">
      <div class="anchor-svg-wrap" id="anchorSvgWrap"></div>
      <div class="anchor-desk"></div>
    </div>
  </div>

  <!-- NEWS CONTENT -->
  <div class="news-content">
    <div class="news-source-row">
      <div class="news-source-tag" id="newsSource">DDOTT NEWS</div>
      <div class="news-counter" id="newsCounter"></div>
    </div>
    <div class="news-headline" id="newsHeadline">Loading...</div>
    <div class="news-body" id="newsBody"></div>
  </div>

  <div class="controls-bar">
    <button class="ctrl-btn" onclick="prevNews()">⏮</button>
    <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" onclick="nextNews()">⏭</button>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <button class="speed-btn" onclick="cycleSpeed()" id="speedBtn">1x</button>
    <div class="vol-btn" onclick="toggleMute()" id="volBtn">🔊</div>
  </div>
</div>

<script>
const WORKER = 'https://ddott-news.meradivin.workers.dev/news';
const VOICES = {en:'en-US', ml:'ml-IN', hi:'hi-IN', ar:'ar-SA'};
let news=[], idx=0, playing=false, speed=1, muted=false, lang='en';
let synth=window.speechSynthesis, autoTimer=null, progressTimer=null, speaking=false;
let currentAnchor='male', mouthInterval=null;

// ── SVG ANCHORS ──────────────────────────────────────────────
const MALE_SVG = `<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgm" cx="50%" cy="80%"><stop offset="0%" stop-color="#12002a"/><stop offset="100%" stop-color="#050010"/></radialGradient>
    <linearGradient id="skinm" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4956a"/><stop offset="100%" stop-color="#b8733e"/></linearGradient>
    <linearGradient id="suitm" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d2144"/><stop offset="100%" stop-color="#071428"/></linearGradient>
  </defs>
  <rect width="120" height="160" fill="url(#bgm)"/>
  <!-- body/suit -->
  <rect x="10" y="110" width="100" height="55" rx="8" fill="url(#suitm)"/>
  <polygon points="60,110 44,160 60,138" fill="#1a3a6e"/>
  <polygon points="60,110 76,160 60,138" fill="#152e58"/>
  <!-- tie -->
  <polygon points="60,112 56,124 60,150 64,124" fill="#ff0040"/>
  <!-- shirt collar -->
  <polygon points="38,110 60,122 60,130" fill="#ffffff"/>
  <polygon points="82,110 60,122 60,130" fill="#eeeeee"/>
  <!-- neck -->
  <rect x="49" y="96" width="22" height="18" rx="6" fill="url(#skinm)"/>
  <!-- head -->
  <ellipse cx="60" cy="62" rx="34" ry="40" fill="url(#skinm)"/>
  <!-- hair -->
  <ellipse cx="60" cy="24" rx="34" ry="16" fill="#1a0f08"/>
  <rect x="26" y="23" width="68" height="14" fill="#1a0f08"/>
  <!-- ears -->
  <ellipse cx="26" cy="64" rx="7" ry="9" fill="#b8733e"/>
  <ellipse cx="94" cy="64" rx="7" ry="9" fill="#b8733e"/>
  <!-- eyebrows -->
  <path d="M36 46 Q46 41 54 44" stroke="#1a0f08" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M66 44 Q74 41 84 46" stroke="#1a0f08" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- eyes white -->
  <ellipse cx="45" cy="56" rx="9" ry="7" fill="white"/>
  <ellipse cx="75" cy="56" rx="9" ry="7" fill="white"/>
  <!-- iris -->
  <circle cx="45" cy="56" r="5" fill="#2d1a0e"/>
  <circle cx="75" cy="56" r="5" fill="#2d1a0e"/>
  <circle cx="47" cy="54" r="2" fill="white"/>
  <circle cx="77" cy="54" r="2" fill="white"/>
  <!-- nose -->
  <path d="M56 66 Q60 74 64 66" stroke="#9a5c2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="55" cy="72" rx="4" ry="2.5" fill="#a86840"/>
  <ellipse cx="65" cy="72" rx="4" ry="2.5" fill="#a86840"/>
  <!-- mouth -->
  <path id="mouth-m" d="M46 84 Q60 90 74 84" stroke="#7a2e20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M46 84 Q60 80 74 84" fill="#c0504a" opacity="0.4"/>
</svg>`;

const FEMALE_SVG = `<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgf" cx="50%" cy="80%"><stop offset="0%" stop-color="#1a0520"/><stop offset="100%" stop-color="#080010"/></radialGradient>
    <linearGradient id="skinf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0b090"/><stop offset="100%" stop-color="#d0805a"/></linearGradient>
    <linearGradient id="suitf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2d0a3e"/><stop offset="100%" stop-color="#1a0628"/></linearGradient>
  </defs>
  <rect width="120" height="160" fill="url(#bgf)"/>
  <!-- body -->
  <rect x="10" y="110" width="100" height="55" rx="8" fill="url(#suitf)"/>
  <path d="M44 110 Q60 128 76 110" fill="#ff0040" opacity="0.85"/>
  <!-- neck -->
  <rect x="50" y="96" width="20" height="18" rx="6" fill="url(#skinf)"/>
  <!-- head -->
  <ellipse cx="60" cy="62" rx="32" ry="38" fill="url(#skinf)"/>
  <!-- hair back -->
  <ellipse cx="60" cy="60" rx="36" ry="42" fill="#1a0808"/>
  <!-- face over hair -->
  <ellipse cx="60" cy="62" rx="32" ry="38" fill="url(#skinf)"/>
  <!-- hair top -->
  <ellipse cx="60" cy="24" rx="32" ry="14" fill="#1a0808"/>
  <rect x="28" y="23" width="64" height="12" fill="#1a0808"/>
  <!-- hair sides -->
  <rect x="24" y="24" width="9" height="46" rx="5" fill="#1a0808"/>
  <rect x="87" y="24" width="9" height="46" rx="5" fill="#1a0808"/>
  <!-- ears -->
  <ellipse cx="28" cy="64" rx="6" ry="8" fill="#d0805a"/>
  <ellipse cx="92" cy="64" rx="6" ry="8" fill="#d0805a"/>
  <!-- earrings -->
  <circle cx="28" cy="74" r="4" fill="#ffd700"/>
  <circle cx="92" cy="74" r="4" fill="#ffd700"/>
  <!-- eyebrows arched -->
  <path d="M34 44 Q44 38 52 42" stroke="#1a0808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M68 42 Q76 38 86 44" stroke="#1a0808" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- eye shadow -->
  <ellipse cx="44" cy="55" rx="11" ry="7" fill="#7b3fa0" opacity="0.25"/>
  <ellipse cx="76" cy="55" rx="11" ry="7" fill="#7b3fa0" opacity="0.25"/>
  <!-- eyes white -->
  <ellipse cx="44" cy="55" rx="9" ry="6.5" fill="white"/>
  <ellipse cx="76" cy="55" rx="9" ry="6.5" fill="white"/>
  <!-- lashes -->
  <path d="M35 50 L32 46 M38 49 L36 45 M41 48 L40 44 M44 48 L44 44 M47 49 L49 45 M50 50 L53 47" stroke="#1a0808" stroke-width="1.5" fill="none"/>
  <path d="M67 50 L64 46 M70 49 L68 45 M73 48 L73 44 M76 48 L76 44 M79 49 L81 45 M82 50 L85 47" stroke="#1a0808" stroke-width="1.5" fill="none"/>
  <!-- iris -->
  <circle cx="44" cy="55" r="5" fill="#3a1040"/>
  <circle cx="76" cy="55" r="5" fill="#3a1040"/>
  <circle cx="46" cy="53" r="2" fill="white"/>
  <circle cx="78" cy="53" r="2" fill="white"/>
  <!-- nose -->
  <path d="M57 67 Q60 73 63 67" stroke="#b06040" stroke-width="1.8" fill="none"/>
  <!-- lips -->
  <path d="M44 82 Q52 77 60 78 Q68 77 76 82" fill="#e03060"/>
  <path id="mouth-f" d="M44 82 Q60 90 76 82" fill="#c02050"/>
  <path d="M44 82 Q60 84 76 82" fill="#ff6090" opacity="0.5"/>
  <!-- cheek blush -->
  <ellipse cx="28" cy="66" rx="9" ry="5" fill="#ff8080" opacity="0.2"/>
  <ellipse cx="92" cy="66" rx="9" ry="5" fill="#ff8080" opacity="0.2"/>
</svg>`;

function renderAnchor(gender) {
  document.getElementById('anchorSvgWrap').innerHTML = gender === 'male' ? MALE_SVG : FEMALE_SVG;
}

function switchAnchor(gender) {
  currentAnchor = gender;
  renderAnchor(gender);
  document.getElementById('btnMale').classList.toggle('active', gender==='male');
  document.getElementById('btnFemale').classList.toggle('active', gender==='female');
}

// ── MOUTH ANIMATION ──────────────────────────────────────────
function startTalking() {
  document.querySelectorAll('.vbar').forEach(b=>b.classList.add('active'));
  document.getElementById('airLabel').textContent = 'ON AIR';
  let open=false;
  clearInterval(mouthInterval);
  mouthInterval = setInterval(()=>{
    const mId = currentAnchor==='male' ? 'mouth-m' : 'mouth-f';
    const el = document.getElementById(mId);
    if(!el){clearInterval(mouthInterval);return;}
    open=!open;
    if(currentAnchor==='male'){
      el.setAttribute('d', open
        ? 'M46 84 Q60 96 74 84'
        : 'M46 84 Q60 90 74 84');
    } else {
      el.setAttribute('d', open
        ? 'M44 82 Q60 96 76 82'
        : 'M44 82 Q60 90 76 82');
    }
  }, 140);
}

function stopTalking() {
  clearInterval(mouthInterval);
  document.querySelectorAll('.vbar').forEach(b=>b.classList.remove('active'));
  const mId = currentAnchor==='male' ? 'mouth-m' : 'mouth-f';
  const el = document.getElementById(mId);
  if(el){
    el.setAttribute('d', currentAnchor==='male'
      ? 'M46 84 Q60 90 74 84'
      : 'M44 82 Q60 90 76 82');
  }
}

// ── NEWS LOAD ────────────────────────────────────────────────
async function loadNews(l, btn) {
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  hardStop();
  document.getElementById('loader').style.display='flex';

  // Malayalam font for headline/body
  const isML = l==='ml';
  document.getElementById('newsHeadline').className = 'news-headline' + (isML?' ml-text':'');
  document.getElementById('newsBody').className = 'news-body' + (isML?' ml-text':'');

  try {
    const res = await fetch(WORKER+'?lang='+lang);
    const data = await res.json();
    news = data.articles || [];
    idx=0;
    document.getElementById('loader').style.display='none';
    buildDots();
    renderNews(0);
    document.getElementById('tickerText').textContent = news.map(n=>n.title).join('   •   ');
  } catch(e) {
    document.getElementById('loader').style.display='none';
    document.getElementById('newsHeadline').textContent='Failed to load news';
  }
}

function buildDots() {
  document.getElementById('storyDots').innerHTML = news.slice(0,10).map((_,i)=>
    `<div class="dot ${i===0?'active':''}" onclick="jumpTo(${i})"></div>`).join('');
}

function renderNews(i) {
  if(i<0||i>=news.length) return;
  idx=i;
  const n = news[idx];
  document.getElementById('newsSource').textContent = n.source?.name || 'DDOTT NEWS';
  document.getElementById('newsHeadline').textContent = n.title;
  document.getElementById('newsBody').textContent = n.description || '';
  document.getElementById('newsCounter').textContent = (idx+1)+' / '+news.length;
  document.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('active',j===idx));
  document.getElementById('progressFill').style.width='0%';
}

// ── TTS WITH IMPROVED MALAYALAM ──────────────────────────────
function getBestVoice(lang) {
  const voices = synth.getVoices();
  const code = VOICES[lang]||'en-US';
  // Try exact match first
  let v = voices.find(v=>v.lang===code);
  // Fallback: partial match
  if(!v) v = voices.find(v=>v.lang.startsWith(code.split('-')[0]));
  return v || null;
}

function speakCurrent() {
  if(speaking) return;
  const n = news[idx];
  if(!n) return;
  if(muted) { scheduleNext(); return; }
  speaking=true;

  const text = n.title + '. ' + (n.description||'');
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = VOICES[lang]||'en-US';
  utt.rate = lang==='ml' ? speed * 0.85 : speed; // slightly slower for Malayalam
  utt.pitch = lang==='ml' ? 1.05 : 1.0;

  const voice = getBestVoice(lang);
  if(voice) utt.voice = voice;

  utt.onstart = ()=>{ animateProgress(); startTalking(); };
  utt.onend = ()=>{ stopTalking(); speaking=false; if(playing) scheduleNext(); };
  utt.onerror = ()=>{ stopTalking(); speaking=false; if(playing) scheduleNext(); };
  synth.speak(utt);
}

function scheduleNext() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(()=>{
    if(!playing) return;
    if(idx<news.length-1){ renderNews(idx+1); speakCurrent(); }
    else { playing=false; document.getElementById('playBtn').textContent='▶'; }
  }, 1200);
}

function animateProgress() {
  let w=0; clearInterval(progressTimer);
  progressTimer = setInterval(()=>{
    if(!playing){clearInterval(progressTimer);return;}
    w=Math.min(w+0.4,95);
    document.getElementById('progressFill').style.width=w+'%';
  }, 200);
}

function togglePlay() {
  playing=!playing;
  document.getElementById('playBtn').textContent=playing?'⏸':'▶';
  if(playing) speakCurrent(); else hardStop();
}

function jumpTo(i){ hardStop(); renderNews(i); if(playing){playing=true;speakCurrent();} }
function nextNews(){ hardStop(); if(idx<news.length-1){renderNews(idx+1);if(playing)speakCurrent();} }
function prevNews(){ hardStop(); if(idx>0){renderNews(idx-1);if(playing)speakCurrent();} }

function hardStop(){
  stopTalking(); speaking=false; synth.cancel();
  clearTimeout(autoTimer); clearInterval(progressTimer);
}

function cycleSpeed(){
  const s=[0.75,1,1.25,1.5,2];
  const i=s.indexOf(speed);
  speed=s[(i+1)%s.length];
  document.getElementById('speedBtn').textContent=speed+'x';
}

function toggleMute(){
  muted=!muted;
  document.getElementById('volBtn').textContent=muted?'🔇':'🔊';
}

// Swipe
let tx=0;
document.querySelector('.news-screen').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;});
document.querySelector('.news-screen').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){if(dx<0)nextNews();else prevNews();}
});

// Init
window.onload=()=>{
  renderAnchor('male');
  // Wait for voices to load
  if(synth.getVoices().length===0){
    synth.addEventListener('voiceschanged',()=>{},{ once:true });
  }
  loadNews('en',document.querySelector('.lang-btn'));
};
</script>
